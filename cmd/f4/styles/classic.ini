[style]
Name = Classic

[farcolors]
# The classic style intentionally uses f4's original built-in palette.
Panel.Cursor.Inactive = foreground:#D3D7CF | background:#555753
Panel.Cursor.Inactive.Selected = foreground:#FFFF00 | background:#555753
# Keep Classic selection on the same blue background as far2l/Norton
# Commander; the yellow foreground is the selection indicator.
Panel.Text.Selected = foreground:#FFFF00 | background:#0000A0
CommandLine.Prompt.Inactive = foreground:#555753 | background:#000000
KeyBar.Numbers = foreground:#D3D7CF | background:#000000
KeyBar.Labels = foreground:#000000 | background:#06989A
Viewer.Text = foreground:#D3D7CF | background:#0000A0
Viewer.Text.Selected = foreground:#000000 | background:#00FFFF
Viewer.Arrows = foreground:#FFFF00 | background:#0000A0
Viewer.Scrollbar = foreground:#808080 | background:#0000A0
Editor.Text = foreground:#D3D7CF | background:#0000A0
Editor.Scrollbar = foreground:#808080 | background:#0000A0

# Explicit overrides for top rows to prevent default dark gray bleed
Panel.Tabs = foreground:#00FFFF | background:#0000A0
Panel.Tabs.Active = foreground:#FFFFFF | background:#0000A0
Panel.Tabs.Accent = foreground:#FFFF00 | background:#0000A0
Panel.Tabs.Attention = foreground:#FF8700 | background:#0000A0
Editor.Status = foreground:#000000 | background:#00FFFF
[Highlight_0]
Name = Symbolic Links
IncludeAttributes = Symlink
NormalColor = foreground:#34E2E2

[Highlight_1]
Name = Hidden Files
IncludeAttributes = Hidden
NormalColor = foreground:#06989A

[Highlight_2]
Name = System Files
IncludeAttributes = System
NormalColor = foreground:#06989A

[Highlight_3]
Name = Directories
IncludeAttributes = Directory
NormalColor = foreground:#EEEEEC

[Highlight_4]
Name = Scripts
Mask = *.sh, *.bash, *.py, *.pl, *.cmd, *.exe, *.bat, *.com
ExcludeAttributes = Directory
Mark = *
NormalColor = foreground:#8AE234

[Highlight_5]
Name = Archives
Mask = *.zip, *.rar, *.tar, *.gz, *.7z, *.tgz, *.bz2, *.xz, *.zst, *.jar, *.cab, *.lzh, *.cpio, *.rpm
ExcludeAttributes = Directory
NormalColor = foreground:#AD7FA8

[Highlight_6]
Name = Temporary Files
Mask = *.bak, *.tmp
ExcludeAttributes = Directory
NormalColor = foreground:#C4A000

[Highlight_7]
Name = Executables
IncludeAttributes = Executable
ExcludeAttributes = Directory
Mark = *
NormalColor = foreground:#8AE234
