# Independent group colour themes. Conditions and artwork remain in their own data.
# Current: Group.Highlighting("Modern") extracted from the saved 46-group snapshot.
# Folder and parent-folder normal states include the former Qt folder-icon blue.
# Explicit empty states are retained; omitted states inherit the panel palette.
[FileGroups]
Version = 3

[FileColorTheme.current]
Name = Current
Color.archives.NormalColor = "foreground:#CB78EB"
Color.archives.SelectedColor = "foreground:#000000"
Color.archives.CursorColor = "foreground:#CB78EB"
