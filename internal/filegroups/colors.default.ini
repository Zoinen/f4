# Each Zoin SVG has one RGB hue. Opacity is shading, not another colour.
# YAML is stroke-only; Fonts/React/Swift resolve currentColor from the root style.
# Preserve the panel's cursor and selection states by setting only NormalColor.
[FileColorTheme.zoin]
Name = Zoin
Color.archives.NormalColor = "foreground:#F79F57"
