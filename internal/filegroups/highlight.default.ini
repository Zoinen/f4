# Shared file groups. Icon catalogs contain artwork only; these predicates are frontend-neutral.
[FileGroups]
Version = 3
Order = type.shell-scripts,type.claude,type.docker,type.git,type.go-source,type.markdown,type.npm,type.ruby,type.rust,type.c-source,type.cpp-source,type.stylesheets,type.databases,type.fonts,type.debug-symbols,type.projects,type.libraries,type.temporary-files,type.web-pages,type.react,type.javascript,type.json,type.python,type.vector-images,type.swift,type.tables,type.typescript,type.yaml,type.images,type.archives,type.executables,type.audio,type.video,type.source-code,type.books,type.configuration,type.locked-files,type.text-files,type.scripts,type.parent-folder,type.folders,type.files

[FileGroupTheme.generic]
Name = Generic
IconCatalog =

[Group.type.shell-scripts]
Name = Shell scripts
Mask = .bash_profile,.bashrc,.zprofile,.zshenv,.zshrc,*.sh,*.bash,*.zsh,*.fish
MaskSyntax = far
Case = insensitive
ExcludeAttributes = Directory
Factory = true
Icons.Enabled = true
LegacyIDs = qt.zoin.bash.names,qt.zoin.bash.extensions

[Group.type.claude]
Name = Claude
Mask = claude.md
MaskSyntax = far
Case = insensitive
ExcludeAttributes = Directory
