# >>> f4 file groups help >>>
# File groups: Options -> Settings -> File groups. This generated block is
# refreshed when File groups are saved with Apply, never by startup or Cancel.
# [FileGroupTheme.<id>] selects an artwork catalog: Name, IconCatalog, Enabled, TintIcons.
# IconTheme on a group scopes all features; Icon.<catalog> selects artwork.
# Shipped icon themes contain artwork only, not their own matching rules.
# Icons match normalized group names: Archives -> archives.svg, Go source -> go-source.svg.
# Missing artwork uses the selected catalog's standard file/folder fallback.
# Renaming a group changes its automatic artwork. Explicit Icon.* overrides remain supported.
# Icons selects the preview artwork; Colors independently previews file colors.
# Apply saves the color selection; Cancel restores the last applied selection.
# Neither selector changes the window/menu color style.
# Enter/F4 opens group details. Child OK updates the draft; Settings Apply saves.
# Comments outside this block, unknown fields and unknown sections are retained.
# Older unmarked comments below may describe the legacy format.
#
# [FileGroups] Version=3; Order lists stable group IDs, not row numbers.
# Apply writes Mode=snapshot: a complete editable working set, not overrides.
# [Group.ID] stores one group; deleting its section removes it from the set.
# Standard groups and added groups are edited/deleted in exactly the same way.
# Restore standard set copies the shipped set into the draft after confirmation.
# Apply saves the reset; Cancel discards it. Updates do not resurrect deletions.
# Older files without Mode still load their original field-level inheritance.
# A quoted empty value explicitly clears a field.
# Enabled=false disables a group; FEATURE.Enabled=false disables one feature.
# Highlight.Enabled, Icons.Enabled, Sort.Enabled and Associations.Enabled are
# independent. An icon-only match cannot terminate the color cascade.
# IconTheme="" (or absent) means universal: the whole group is always active.
# IconTheme=lucide, zoin or system scopes ALL features to that icon theme.
# Native uses system. A frontend without a declared theme uses generic.
# Universal groups precede the selected theme's groups. Other sets stay saved,
# but never match, including commands. Color styles are a separate setting.
# IconTheme scope is independent of Icon.THEME resource references below.
#
# Conditions: Mask; MaskSyntax=far or legacy-glob; Case=platform, sensitive or
# insensitive; IncludeAttributes; ExcludeAttributes; SizeAbove; SizeBelow;
# DateType=modified, created or accessed; DateAfter; DateBefore; DateRelative.
# Attributes: Directory, Hidden, Executable, ReadOnly, System, Archive, Symlink,
# Junction. Junction uses VFS reparse metadata regardless of the host OS.
# Far masks support comma/semicolon lists and | exclusions. Imported highlighting
# keeps its comma-only legacy glob syntax and original case behavior.
# Absolute dates use YYYY-MM-DD HH:MM:SS (UTC); relative bounds use 1h, 30m, 2d.
#
# The four color states are independent, foreground/background separately:
# [FileColorTheme.ID] stores Name and Color.<normalized-group-name>.<state>.
# FileGroups.ColorTheme selects the active file color theme independently of icons.
# Example: Color.archives.NormalColor = "foreground:#F79F57".
# Current captures existing group colors; Zoin uses the shipped SVG base hues.
# Missing names fall through; quoted empty states explicitly clear their value.
# The color matrix edits the chosen theme's entry by group name.
# Legacy Palette.<hex UTF-8 scheme name>.<field> variants migrate on Apply.
# Highlight.Mask (and other Highlight.<condition> fields) changes highlighting
# only; the main conditions still control icons, sorting and associations.
# States: NormalColor, SelectedColor, CursorColor, SelectedCursorColor.
# Highlight.Enabled, Mark, ContinueProcessing and UseDefaults stay on the group.
# Legacy names: NormalFileName, SelectedFileName, FileNameUnderCursor,
# FileNameSelectedUnderCursor. Canonical keys take precedence when both exist.
# Expressions include foreground:#AABBCC | background:#112233, F_WHITE | B_BLUE,
# and palette references such as foreground:Panel.Text. Mark sets the marker.
# ContinueProcessing=true allows later matching highlighting rules to contribute.
#
# UseDefaults=true (legacy UseDefaults=1) overrides only specified colors or
# the marker of an attribute without replacing the rest of the theme's rules.
# Priority: Junction, Symlink, Hidden or System, Directory. Directory overrides
# do not recolour links or hidden folders; Symlink overrides exclude Junction.
# The same highlighting applies to directory-tree entries.
#
# Icon.THEME or Icon.*: asset:NAME, file:PATH, native:NAME, or none.
# OverrideNativeIcon=false lets supplied plugin icons and Native-theme OS icons
# win; true lets the explicit group icon win. Other themes do not invoke OS lookup.
# Sort.Number sets an enabled sort group; unclassified entries use 10000.
#
# [Command.GROUP/ID] names an application; CommandOrder orders its stable IDs.
# Name, Disabled and six command/enabled pairs are supported: Execute, AltExec,
# View, AltView, Edit, AltEdit; each slot has a corresponding .Enabled key.
# Version 3 group/command values use Go quoted strings for escapes and newlines.
# A Windows command such as C:\Tools\open.exe must be written as
# Execute = "C:\\Tools\\open.exe !.!". Legacy backslashes are read literally.
# Matching command sets are collected in group/application order. Test match
# never executes a command; association changes become active only after Apply.
# Full format, migration and precedence: docs/FILE_GROUPS.md.
