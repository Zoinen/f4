[style]
Name = Modern

[farcolors]
# Panel
Panel.Box = foreground:#444444 | background:#232323
Panel.Cursor = foreground:#AAAAAA | background:#3B6290
Panel.Cursor.Selected = foreground:#F1EC0E | background:#3B6290
Panel.Cursor.Inactive = foreground:#D0D0D0 | background:#555753
Panel.Cursor.Inactive.Selected = foreground:#F1EC0E | background:#555753
Panel.Dir = foreground:#FFFFFF | background:#232323
Panel.FastFindNoMatch = foreground:#C45B5B | background:#232323
Panel.Info.Selected = foreground:#F1EC0E | background:#3B6290
Panel.Info.Total = foreground:#D0D0D0 | background:#232323
Panel.Scrollbar = foreground:#5A5A5A | background:#232323
Panel.Scrollbar.Minimal = foreground:#A0A0A0 | background:#232323
Panel.Text = foreground:#AAAAAA | background:#232323
Panel.Text.Highlight = foreground:#C678DD | background:#232323
Panel.Text.Info = foreground:#B8B8B8 | background:#232323
Panel.Text.Selected = foreground:#F1EC0E | background:#232323
Panel.Tabs = foreground:#AAAAAA | background:#000000
Panel.Tabs.Active = foreground:#FFFFFF | background:#232323
Panel.Tabs.Accent = foreground:#7FAFE3
Panel.Tabs.Attention = foreground:#FF9F43
Panel.Title = foreground:#D0D0D0 | background:#232323
Panel.Title.Column = foreground:#C8C8C8 | background:#232323
Panel.Title.Selected = foreground:#FFFFFF | background:#434343

# Lists and tables
# Table.Scrollbar is used by generic lists and tables; menus, help, panels,
# the viewer and the editor have scrollbar keys of their own. Table.Separator
# is used for table column separators, not for the panel or dialog frame.
Table.Separator = foreground:#5A5A5A | background:#232323
Table.Scrollbar = foreground:#5A5A5A | background:#232323

# Dialog
Dialog.Box = foreground:#5A5A5A | background:#434343
Dialog.Box.Title = foreground:#E8E8E8 | background:#434343
Dialog.Box.Title.Highlight = foreground:#7FAFE3 | background:#434343
Dialog.Indicator.Background = background:#232323
Dialog.Text = foreground:#D0D0D0 | background:#434343
Dialog.Settings.Background = background:#343434
Dialog.Highlight = foreground:#7FAFE3 | background:#434343
Dialog.Combo.Text = foreground:#D0D0D0 | background:#232323
Dialog.Combo.Text.Selected = foreground:#FFFFFF | background:#3B6290
Dialog.Combo.Highlight = foreground:#7FAFE3 | background:#232323
Dialog.Combo.Highlight.Selected = foreground:#D8E9FF | background:#3B6290
Dialog.Combo.Box = foreground:#5A5A5A | background:#232323
Dialog.Combo.Title = foreground:#D0D0D0 | background:#232323
Dialog.Combo.Scrollbar = foreground:#5A5A5A | background:#232323
Dialog.Edit = foreground:#D0D0D0 | background:#232323
Dialog.Edit.Selected = foreground:#FFFFFF | background:#3B6290
Dialog.Edit.Unchanged = foreground:#9A9A9A | background:#232323
Dialog.Button = foreground:#D0D0D0 | background:#434343
Dialog.Button.Selected = foreground:#FFFFFF | background:#3B6290
Dialog.Button.Highlight = foreground:#7FAFE3 | background:#434343
Dialog.Button.Highlight.Selected = foreground:#D8E9FF | background:#3B6290

# Warning message
WarnDialog.Box = foreground:#8A5A5A | background:#3B1C1C
WarnDialog.Box.Title = foreground:#FFA1A1 | background:#3B1C1C
WarnDialog.Box.Title.Highlight = foreground:#FF6C60 | background:#3B1C1C
WarnDialog.Text = foreground:#FFA1A1 | background:#3B1C1C
WarnDialog.Highlight = foreground:#FCE94F | background:#3B1C1C
WarnDialog.Edit = foreground:#FFA1A1 | background:#231111
WarnDialog.Edit.Selected = foreground:#FFFFFF | background:#5E2727
WarnDialog.Edit.Unchanged = foreground:#8A5A5A | background:#231111
WarnDialog.Button = foreground:#FFA1A1 | background:#3B1C1C
WarnDialog.Button.Selected = foreground:#FFFFFF | background:#5E2727
WarnDialog.Button.Highlight = foreground:#FF6C60 | background:#3B1C1C
WarnDialog.Button.Highlight.Selected = foreground:#FF6C60 | background:#5E2727

# Menu
Menu.Box = foreground:#5A5A5A | background:#434343
# The menu scrollbar runs down the menu frame, so it takes the frame colours,
# as every other scrollbar in this style sits on its own surface.
Menu.Scrollbar = foreground:#5A5A5A | background:#434343
Menu.Title = foreground:#D0D0D0 | background:#434343
Menu.Text = foreground:#D0D0D0 | background:#434343
Menu.Text.Selected = foreground:#FFFFFF | background:#3B6290
Menu.Highlight = foreground:#7FAFE3 | background:#434343
Menu.Highlight.Selected = foreground:#D8E9FF | background:#3B6290

# Horizontal menu
MenuBar.Text = foreground:#D0D0D0 | background:#343434
MenuBar.Text.Selected = foreground:#FFFFFF | background:#3B6290
MenuBar.Highlight = foreground:#7FAFE3 | background:#343434
MenuBar.Highlight.Selected = foreground:#D8E9FF | background:#3B6290

# Key bar
KeyBar.Numbers = foreground:#8A8A8A | background:#000000
KeyBar.Labels = foreground:#C8C8C8 | background:#363636

# Command line
CommandLine.Prompt = foreground:#9CDC6A | background:#000000
CommandLine.Path = foreground:#9CDC6A | background:#000000
CommandLine.User = foreground:#8ae234 | background:#000000
CommandLine.Prompt.Inactive = foreground:#555753 | background:#000000
CommandLine.Text = foreground:#D0D0D0 | background:#000000
CommandLine.Text.Selected = foreground:#FFFFFF | background:#3B6290
CommandLine.UserScreen = foreground:#D0D0D0 | background:#000000

# Viewer
Viewer.Text = foreground:#D0D0D0 | background:#232323
Viewer.Text.Selected = foreground:#FFFFFF | background:#3B6290
Viewer.Status = foreground:#D0D0D0 | background:#434343
Viewer.Arrows = foreground:#A8A8A8 | background:#232323
Viewer.Scrollbar = foreground:#5A5A5A | background:#232323

# Editor
Editor.Text = foreground:#D0D0D0 | background:#232323
Editor.Text.Selected = foreground:#FFFFFF | background:#3B6290
Editor.Status = foreground:#D0D0D0 | background:#434343
Editor.Scrollbar = foreground:#5A5A5A | background:#232323
Editor.WrapMark = foreground:#7FAFE3 | background:#232323
Editor.Occurrence = foreground:#232323 | background:#C678DD
# Chroma syntax highlighting (f4#1470)
Editor.Syntax.Comment = foreground:#6A6A6A | background:#232323
Editor.Syntax.Keyword = foreground:#61AFEF | background:#232323
Editor.Syntax.String = foreground:#98C379 | background:#232323
Editor.Syntax.Number = foreground:#D19A66 | background:#232323
Editor.Syntax.Operator = foreground:#D0D0D0 | background:#232323
Editor.Syntax.Function = foreground:#E5C07B | background:#232323
Editor.Syntax.Variable = foreground:#D0D0D0 | background:#232323
Editor.Syntax.Heading = foreground:#61AFEF | background:#232323

# Help
Help.Text = foreground:#D0D0D0 | background:#2A2A2C
Help.Bold = foreground:#FFFFFF | background:#2A2A2C
Help.Link = foreground:#6CA6CD | background:#2A2A2C
Help.SelectedLink = foreground:#FFFFFF | background:#3B6290
Help.Box = foreground:#5A5A5A | background:#2A2A2C
Help.Box.Title = foreground:#5A5A5A | background:#2A2A2C
Help.Scrollbar = foreground:#5A5A5A | background:#2A2A2C

# Terminal
Terminal.Cursor = foreground:#FFFFFF
# Canonical Modern file palette, promoted from the imported Far rules.
