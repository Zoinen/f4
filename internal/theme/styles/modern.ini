FileGroup = attribute.symlink
LegacyID = style.eef6c7f6ddd4067eb8afcea1a2104116ed5c09287b11433ed96a2b3c47cbb55c.Highlight_0
IncludeAttributes = Symlink
NormalColor = foreground:#66D9EF

