name: CI

on:
  push:
    branches: [ "main", "zoin" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main", "zoin" ]
    # Docs-only pull requests skip CI entirely: nothing below compiles,
    # packages or tests Markdown. A PR touching both code and docs still
    # runs -- the filter only skips when EVERY changed file matches.
    # Deliberately not on the push trigger: it also carries release tags,
    # where a path filter could silently skip a release.
    paths-ignore:
      - '**.md'
      - 'docs/**'
  workflow_dispatch:
    inputs:
      shuffle:
        description: "go test shuffle seed (or on for a random seed)"
        required: false
        default: "on"
        type: string
      bootstrap_multimedia_dependencies:
        description: "Build and publish missing Qt Multimedia video/audio packages"
        required: false
        default: false
        type: boolean
      publish_qt_release:
        description: "Publish Linux amd64/arm64 Qt binaries as an explicit feature-lane release"
        required: false
        default: false
        type: boolean
      release_tag:
        description: "Release tag for publish_qt_release, for example v2026.10.08"
        required: false
        default: ""
        type: string

# A newer push supersedes the run in flight: with ~30 jobs per run and 20
# concurrent runners on the free tier, two overlapping runs queue each other
# into waves. Tag pushes publish releases, so those runs are never cancelled;
# each tag is its own group anyway.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# Where a tag build writes the tag with -X: every build step below takes the
# name from here. The linker skips an -X whose name resolves to nothing without
# a word, which is how tagged builds came to report a commit hash once the
# variable moved from package main to internal/app. Two checks keep that from
# returning: TestReleaseWorkflowWritesBuildVersion in internal/app ties this
# line to the variable on every run, and on a tag the smoke tests run
# scripts/check_release_version.sh on the binaries they start.
env:
  VERSION_SYMBOL: github.com/unxed/f4/internal/app.buildVersion

jobs:
  # Lunobot bots never open their own pull requests for routine work: it
  # lands in lunobot/staging and reaches main in trains (LUNOBOT.md § 7.2 in
  # unxed/lunobot), one full-matrix run per train instead of one per ticket.
  # Only lunobot/train/* and lunobot/urgent/* may be PR heads; any other
  # lunobot/* PR fails this job at once and every heavy job below, which
  # needs it, is skipped -- the drift shows up red without spending the
  # matrix. `[ci-full]`/batch skipping is gone with the batches themselves:
  # a train is pushed once, so every run it gets is the one that decides.
  should-run-full:
    name: Should run full matrix
    runs-on: ubuntu-latest
    outputs:
      run-full: ${{ steps.decide.outputs.run-full }}
    steps:
    - name: Decide whether to run the full matrix
      id: decide
      env:
        EVENT_NAME: ${{ github.event_name }}
        HEAD_REF: ${{ github.head_ref }}
      run: |
        set -euo pipefail
        run_full=true

        if [ "$EVENT_NAME" = "pull_request" ]; then
          case "$HEAD_REF" in
            lunobot/train/*|lunobot/urgent/*) ;;
            lunobot/*)
              echo "::error::$HEAD_REF: routine bot work lands in lunobot/staging via train.py land, not in its own PR (LUNOBOT.md § 7.2)"
              exit 1 ;;
          esac
        fi

        echo "event=$EVENT_NAME head_ref=$HEAD_REF run_full=$run_full" >&2
        echo "run-full=$run_full" >> "$GITHUB_OUTPUT"

  # The build matrix is deliberately inline data. Pull requests build all
  # six cells because those are the artifacts anyone actually downloads
  # from a PR: the six desktop OS/architecture pairs.
  # Exotic targets live in build-batch below and run outside pull requests.
  #
  # There is no separate musl cell any more. linux/amd64 and linux/arm64 are
  # built once, in goffi's universal ("Profile U") mode, and the single file
  # runs on glibc and musl alike -- see the Build binaries step below.
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    needs: [should-run-full]
    if: github.ref != 'refs/heads/zoin' && needs.should-run-full.outputs.run-full == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # 6 cells; capped so this one job doesn't claim every runner the
      # free-tier pool has (see the concurrency comment above the jobs).
      max-parallel: 3
      matrix: { include: [{ goos: linux, goarch: amd64 }, { goos: linux, goarch: arm64 }, { goos: windows, goarch: amd64 }, { goos: windows, goarch: arm64 }, { goos: darwin, goarch: amd64 }, { goos: darwin, goarch: arm64 }] }
    env:
      CGO_ENABLED: 0
      BUILD_TAGS: ''
      # Artifact and archive basename, unchanged -- the updater and the
      # Homebrew job match on these suffixes.
      ASSET: ${{ format('f4-{0}-{1}', matrix.goos, matrix.goarch) }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: recursive # Автоматически подтягивает vtui и vtinput
        ssh-key: ${{ secrets.SUBMODULE_SSH_KEY }}

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26.9'
        cache-dependency-path: go.sum

    - name: Collect core version metadata
      shell: bash
      env:
        F4_RELEASE_TAG: ${{ inputs.release_tag }}
      run: |
        {
          echo "F4_BUILD_REVISION=$(git rev-parse HEAD)"
          echo "F4_BUILD_TIME=$(git show -s --format=%cI HEAD)"
          echo "F4_BUILD_MODIFIED=false"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "F4_BUILD_VERSION=$GITHUB_REF_NAME"
          elif [[ -n "$F4_RELEASE_TAG" ]]; then
            echo "F4_BUILD_VERSION=$F4_RELEASE_TAG"
          else
            echo "F4_BUILD_VERSION="
          fi
        } >> "$GITHUB_ENV"
    - name: Compute build impact
      id: affected
      uses: ./.github/actions/affected-packages

    - name: Check formatting
      # One cell carries the repo-wide checks; linux/amd64 is the fastest.
      # Deliberately not gated on build impact: gofmt covers test files too,
      # so a tests-only pull request still needs this check.
      if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
      run: |
        if [ -n "$(gofmt -s -l .)" ]; then
          echo "The following files are not properly formatted:"
          gofmt -s -l .
          echo "Please run 'gofmt -s -w .' locally and commit the changes."
          exit 1
        fi

    - name: Check language file formatting
      # One cell carries the repo-wide checks; linux/amd64 is the fastest.
      if: steps.affected.outputs.build == 'yes' && matrix.goos == 'linux' && matrix.goarch == 'amd64'
      run: go run ./tools/langfmt -check internal/i18n/lang/*.lng

    - name: Verify generated application icons
      # One cell carries the repo-wide checks; linux/amd64 is the fastest.
      if: steps.affected.outputs.build == 'yes' && matrix.goos == 'linux' && matrix.goarch == 'amd64'
      run: |
        # `go generate` on a package with no directives prints nothing and
        # exits 0, so the git diff below would pass by having regenerated
        # nothing at all. That is not hypothetical: the directive lives in the
        # main package because the toolchain links a .syso only from there, and
        # it travels with whatever file it sits in.
        #
        # -n prints the commands it would run to STDERR, not stdout, so the
        # redirect is the check rather than decoration.
        go generate -n ./cmd/f4 2>&1 | grep -q . || {
          echo "::error::no //go:generate directive under cmd/f4; the icon and .syso generator would silently not run"
          exit 1
        }
        go generate ./cmd/f4
        git diff --exit-code -- \
          internal/gui/assets/icon/generated \
          cmd/f4/rsrc_windows_amd64.syso \
          cmd/f4/rsrc_windows_arm64.syso

    - name: Build binaries
      if: steps.affected.outputs.build == 'yes'
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
      run: |
        mkdir -p build/plugins/dummy_internal
        EXT=""
        if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi

        # Preserve the zoin build metadata while using upstream's portable
        # goffi-universal Linux profile.
        VERSION_LDFLAGS="$(python3 ci/go-build-metadata.py)"

        # One Linux binary per architecture, with FFI, for glibc and musl
        # both.
        #
        # This used to be a pair of trades, neither of them good. The generic
        # cells linked statically (goffi_static): they started anywhere but
        # could not dlopen, so the FFI bridge, the GPU, Wayland and Ebiten
        # backends were all gone and vtui fell back to its pure-Go X11 and
        # ANSI paths. The musl cells kept every backend by pointing goffi's
        # imports at musl's libc and baking /lib/ld-musl-<arch>.so.1 into
        # PT_INTERP -- which is precisely what made those artifacts unable to
        # start anywhere else, hence a second set of downloads and a flavor
        # the updater had to know about.
        #
        # goffi's universal mode ("Profile U") removes the choice. It imports
        # every libc symbol with an empty SONAME, so the linker records the
        # undefined symbols but no DT_NEEDED and the binary names no libc at
        # all; the interpreter is then stripped after linking (below), so the
        # kernel loads the file directly the way it loads a static one. At
        # startup, before any libc symbol is touched, goffi re-execs the
        # process through whatever dynamic loader the host actually has, with
        # that host's libc pre-loaded, and every symbol binds against it.
        # One file, FFI alive, glibc and musl both. See docs/PROFILE_U.md in
        # unxed/goffi.
        #
        # Unlike goffi_musl this needs no -gcflags, and unlike goffi_static it
        # keeps every backend. What it does need is a host loader it
        # recognises: on a system that has none -- a scratch container, a
        # distro that keeps ld.so somewhere else -- the process cannot bring
        # up libc and dies at startup, where the old static artifact would
        # have run without FFI. That is the one thing the static flavor could
        # do that this cannot.
        LDFLAGS="-s -w $VERSION_LDFLAGS"
        if [ "$GOOS" = "linux" ]; then
          BUILD_TAGS="${BUILD_TAGS:+$BUILD_TAGS,}goffi_universal"
        fi

        APP_LDFLAGS="$LDFLAGS"
        if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          APP_LDFLAGS="$APP_LDFLAGS -X $VERSION_SYMBOL=$GITHUB_REF_NAME"
        fi

        # fakecgo supplies environ/__progname (and __ps_strings on NetBSD)
        # in place of the crt0 these cgo-free builds do not link. Those
        # symbols have to reach the *dynamic* symbol table, which needs
        # //go:cgo_export_dynamic, which the compiler only accepts in a
        # package built as std. Both BSDs need it; nothing else does.
        GCFLAGS=""
        case "$GOOS" in
          freebsd|netbsd)
            GCFLAGS="-gcflags=github.com/go-webgpu/goffi/internal/fakecgo=-std"
            ;;
        esac

        BUILD_TAG_ARGS=()
        if [ -n "$BUILD_TAGS" ]; then
          BUILD_TAG_ARGS=(-tags "$BUILD_TAGS")
        fi

        # Build core
        go build "${BUILD_TAG_ARGS[@]}" -trimpath $GCFLAGS -ldflags="$APP_LDFLAGS" -o build/f4$EXT ./cmd/f4

        # Build GUI-only binary for Windows (no console flash)
        if [ "$GOOS" = "windows" ]; then
          # f4-gui.exe is a small launcher for f4.exe (f4#1567), not a second
          # copy of the whole program linked as a GUI application.
          go build -trimpath -ldflags="-s -w -H windowsgui" -o build/f4-gui$EXT ./cmd/f4-gui-launcher

        fi

        # Copy language and help assets
        cp -r internal/i18n/lang internal/dialog/help build/
        cp f4.example.ini build/
        mkdir -p build/licenses
        cp plugins/visren/LICENSE.upstream build/licenses/VisRen-BSD-3-Clause.txt

        # Add freedesktop launch metadata and the application icon to Linux archives.
        if [ "$GOOS" = "linux" ]; then
          mkdir -p build/share/applications
          cp packaging/linux/org.unxed.f4.desktop build/share/applications/
          for size in 16 24 28 30 32 36 42 48 56 64 128 256 512 1024; do
            icon_dir="build/share/icons/hicolor/${size}x${size}/apps"
            mkdir -p "$icon_dir"
            cp "internal/gui/assets/icon/generated/f4-${size}.png" \
              "$icon_dir/io.github.unxed.f4.png"
          done
          mkdir -p build/share/icons/hicolor/scalable/apps
          cp internal/gui/assets/icon/f4.svg \
            build/share/icons/hicolor/scalable/apps/io.github.unxed.f4.svg
        fi

        # Build internal dummy plugin
        cd plugins/dummy_internal
        go build "${BUILD_TAG_ARGS[@]}" -trimpath $GCFLAGS -ldflags="$LDFLAGS" -o ../../build/plugins/dummy_internal/f4-internal-dummy-plugin$EXT .

        # Keep every downloadable f4 file under one directory when unpacked
        # by hand. The updater strips this wrapper and still accepts the old
        # flat archives for in-place updates.
        cd ../..
        rm -rf package
        mkdir -p package/f4
        cp -a build/. package/f4/

    # The universal contract, asserted rather than assumed: no PT_INTERP and
    # no DT_NEEDED. Both halves matter and neither is visible later -- a
    # binary that kept its interpreter starts fine on this runner and fails
    # only on Alpine, and a stray DT_NEEDED from any dependency pins the
    # artifact to one libc exactly as the old musl flavor was pinned.
    #
    # goffi-strip-interp and goffi-audit come from the goffi the build just
    # linked against (go.mod pins the fork), so there is no separate tool to
    # install or keep in sync. This step deliberately does not set GOOS or
    # GOARCH: the tools run on the runner and take the cross-built file as an
    # argument.
    #
    # Only build/f4 is an executable. plugins/dummy_internal is a library
    # package, so the file the build step writes next to it is a Go archive
    # with no ELF headers of its own.
    - name: Make the Linux binary libc-independent
      if: steps.affected.outputs.build == 'yes' && matrix.goos == 'linux'
      run: |
        set -euo pipefail
        go run github.com/go-webgpu/goffi/cmd/goffi-strip-interp build/f4
        go run github.com/go-webgpu/goffi/cmd/goffi-audit build/f4

    # Running the arm64 artifact means running a foreign-architecture
    # container, which needs the binfmt handlers this action registers. The
    # "fix binary" flag it sets is not a detail: the universal binary re-execs
    # itself through the host loader, and without that flag the kernel would
    # have no interpreter registered for the exec'd image.
    - name: Set up QEMU
      if: steps.affected.outputs.build == 'yes' && matrix.goos == 'linux' && matrix.goarch != 'amd64' && github.event_name != 'pull_request'
      uses: docker/setup-qemu-action@v3

    # A cross-built binary nobody ever started is not evidence of anything,
    # and the release publishes it all the same. Go runs every package's
    # init() before main, so a single --version call is enough to catch a
    # broken toolchain or an architecture a dependency cannot actually
    # handle. --version returns before any terminal setup, so no tty is
    # needed.
    #
    # One artifact now claims to cover both libcs, so proving it takes real
    # userlands of both: a glibc one and a musl one, running the very file
    # that gets packaged. qemu-user's -L sysroot cannot stand in for them --
    # it redirects the interpreter lookup, while goffi's re-exec bridge
    # probes the loader paths itself with raw syscalls and so would find the
    # runner's own glibc and report a pass that means nothing.
    #
    # On a tag every run here also has to report exactly that tag as its
    # version (scripts/check_release_version.sh): the tag is written in with
    # -X, which the linker skips silently when the name does not resolve.
    #
    # The container runs ride with pushes and tags, where the nightly and
    # release jobs publish and a red run blocks them via needs. Pull requests
    # keep the ELF contract above (which catches the realistic breakage: a
    # tag not applying, a dependency dragging a SONAME in) plus the native
    # run of the amd64 cell.
    - name: Smoke test the binary
      if: steps.affected.outputs.build == 'yes' && matrix.goos == 'linux'
      env:
        GOARCH_CELL: ${{ matrix.goarch }}
        CROSS_LIBC_SMOKE: ${{ github.event_name != 'pull_request' }}
      run: |
        set -euo pipefail

        # Pinned so a rebuilt upstream image cannot change what this proves.
        GLIBC_IMAGE=debian:bookworm-slim
        MUSL_IMAGE=alpine:3.24.1
        # glibc 2.31. Until 2.34 glibc kept pthread_create and dlopen out of
        # libc.so.6, in libpthread.so.0 and libdl.so.2, so a bridge that
        # preloads libc alone starts on bookworm and dies on Ubuntu 20.04
        # before main (#1381). bookworm cannot tell the two apart; this can.
        OLD_GLIBC_IMAGE=debian:bullseye-slim

        if [ "$GOARCH_CELL" = "amd64" ]; then
          bash scripts/check_release_version.sh ./build/f4 --version
        fi

        if [ "$CROSS_LIBC_SMOKE" != "true" ]; then
          echo "Pull request: ELF contract and the native run only."
          exit 0
        fi

        run_args=(--rm --volume "$PWD/build:/mnt:ro")
        if [ "$GOARCH_CELL" != "amd64" ]; then
          run_args+=(--platform "linux/$GOARCH_CELL")
        fi

        for image in "$GLIBC_IMAGE" "$OLD_GLIBC_IMAGE" "$MUSL_IMAGE"; do
          echo "==> $image"
          bash scripts/check_release_version.sh docker run "${run_args[@]}" "$image" /mnt/f4 --version
        done

    # Windows is published as .7z as well as .zip (#1656). f4 from v0.2.0-beta
    # to v0.3.0-beta asks for .7z first and otherwise takes the first .zip by
    # name that ends with "-windows-<arch>.zip", and f4-lite-windows-amd64.zip
    # used to sort before f4-windows-amd64.zip: without the .7z those builds
    # updated themselves into the lite edition. The .7z holds exactly what the
    # .zip does; filters are off (-mf=off) so any 7z reader f4 ever shipped
    # decodes it.
    - name: Package
      if: steps.affected.outputs.build == 'yes'
      run: |
        if [ "${{ matrix.goos }}" = "windows" ]; then
          (cd package && zip -r "../$ASSET.zip" f4)
          SEVENZIP=$(command -v 7z || command -v 7zz || command -v 7za || true)
          if [ -z "$SEVENZIP" ]; then
            sudo apt-get update -qq </dev/null
            sudo apt-get install -y -qq 7zip </dev/null
            SEVENZIP=$(command -v 7zz || command -v 7z)
          fi
          (cd package && "$SEVENZIP" a -t7z -mx=9 -mf=off -bd "../$ASSET.7z" f4 </dev/null)
        else
          tar -czvf "$ASSET.tar.gz" -C package f4
        fi

        if [ "${{ matrix.goos }}" = "darwin" ]; then
          VERSION="0.0.${GITHUB_RUN_NUMBER}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          APP="F4.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp build/f4 "$APP/Contents/MacOS/f4"
          chmod +x "$APP/Contents/MacOS/f4"
          cp internal/gui/assets/icon/generated/f4.icns "$APP/Contents/Resources/f4.icns"
          sed -e "s/__VERSION__/$VERSION/g" \
              -e "s/__BUILD_VERSION__/$GITHUB_RUN_NUMBER/g" \
              packaging/macos/Info.plist > "$APP/Contents/Info.plist"
          zip -r "$ASSET.app.zip" "$APP"
        fi

    - name: Upload Artifact
      if: steps.affected.outputs.build == 'yes'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.ASSET }}
        path: ${{ env.ASSET }}.*
        retention-days: 7

  qt-host:
    name: Qt host (${{ matrix.platform }}, list + Gallery)
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.publish_qt_release) }}
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            platform: darwin
          - runner: macos-15-intel
            platform: darwin
    env:
      CONAN_HOME: ${{ github.workspace }}/.conan2
      F4_CONAN_REMOTE_URL: ${{ vars.F4_CONAN_REMOTE_URL }}
      F4_CONAN_UPLOAD_URL: ${{ vars.F4_CONAN_UPLOAD_URL }}
      F4_CONAN_USERNAME: ${{ vars.F4_CONAN_USERNAME }}

    steps:
    - name: Checkout f4
      uses: actions/checkout@v4
      with:
        submodules: recursive
        ssh-key: ${{ secrets.SUBMODULE_SSH_KEY }}

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.x'
        cache-dependency-path: go.sum

    - name: Collect core version metadata
      shell: bash
      env:
        F4_RELEASE_TAG: ${{ inputs.release_tag }}
      run: |
        {
          echo "F4_BUILD_REVISION=$(git rev-parse HEAD)"
          echo "F4_BUILD_TIME=$(git show -s --format=%cI HEAD)"
          echo "F4_BUILD_MODIFIED=false"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            echo "F4_BUILD_VERSION=$GITHUB_REF_NAME"
          elif [[ -n "$F4_RELEASE_TAG" ]]; then
            echo "F4_BUILD_VERSION=$F4_RELEASE_TAG"
          else
            echo "F4_BUILD_VERSION="
          fi
        } >> "$GITHUB_ENV"

    - name: Enable the MSVC build environment
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install native build tools
      shell: bash
      run: |
        python -m pip install --upgrade pip
        # Ninja 1.13.0 truncates long MSVC linker response-file lines at
        # 16,383 characters, producing broken object paths such as
        # `ry\CMakeFiles\...`. Keep the Windows static Qt link stable on the
        # fixed in the 1.13.1+ line; use the available 1.13.2 wheel.
        python -m pip install "conan==2.29.1" "cmake==3.31.6" "ninja==1.13.2"
        conan profile detect --force

    - name: Cache the macOS native dependency graph
      uses: actions/cache@v4
      with:
        path: |
          .conan2
          build/qwindowkit-install
        key: qt-host-6.11.1-darwin-${{ runner.arch }}-video-v4
        restore-keys: |
          qt-host-6.11.1-darwin-${{ runner.arch }}-video-v4
          qt-host-6.11.1-darwin-${{ runner.arch }}-v3

    - name: Configure Conan binary remote
      shell: bash
      env:
        F4_CONAN_TOKEN: ${{ secrets.F4_CONAN_REMOTE_TOKEN }}
      run: bash ci/configure-conan-remote.sh

    - name: Patch legacy bzip2 Conan recipe
      shell: bash
      run: bash ci/patch-bzip2-recipe.sh

    - name: Patch Qt Conan recipe dependencies
      shell: bash
      run: bash ci/patch-qt-recipe.sh

    - name: Build and test the Qt host
      shell: bash
      run: |
        conan_platform_settings=()
        if [[ "$RUNNER_OS" == "macOS" ]]; then
          conan_platform_settings+=("-s:h" "os.version=13.0")
          if [[ "$(uname -m)" == "x86_64" ]]; then
            # Apple Clang on the Intel macOS runner can spend indefinitely in
            # OpenSSL's optional assembly build.  The portable Qt host does
            # not require those CPU-specific optimizations, and keeping the
            # portable C implementation preserves the TLS feature set.
            conan_platform_settings+=("-o:h" "openssl/*:no_asm=True")
          fi
        fi
        conan install qt/host --build=missing \
          -s:h build_type=Release -s:h compiler.cppstd=20 \
          -o:h '*:with_video_thumbnails=True' \
          -o:h '*:with_ffmpeg_backend=True' \
          -o:h 'qt/*:with_ffmpeg=True' \
          -c:a '*/*:tools.cmake.cmaketoolchain:extra_variables={"CMAKE_POLICY_VERSION_MINIMUM":{"cache":True,"type":"STRING","value":"3.5"}}' \
          -c:a '*/*:tools.cmake:configure_args=["-DCMAKE_POLICY_VERSION_MINIMUM=3.5"]' \
          -c tools.system.package_manager:mode=install \
          -c tools.system.package_manager:sudo=True \
          "${conan_platform_settings[@]}" \
          --output-folder=qt/host/build-ci
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          qt_cmake_prefix="$(cygpath -w "$PWD/qt/host/build-ci")"
          pwsh -File ci/build-qwindowkit.ps1 -QtRoot "$qt_cmake_prefix" -BuildType Release
        else
          bash ci/build-qwindowkit.sh "$PWD/qt/host/build-ci" Release
        fi
        cmake -S qt/host -B qt/host/build-ci -G Ninja \
          -DCMAKE_TOOLCHAIN_FILE="$PWD/qt/host/build-ci/conan_toolchain.cmake" \
          -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DUSE_QWK=ON \
          -DF4_ENABLE_VIDEO_THUMBNAILS=ON -DF4_ENABLE_FFMPEG_BACKEND=ON \
          -DCMAKE_PREFIX_PATH="$PWD/build/qwindowkit-install"
        cmake --build qt/host/build-ci --config Release --parallel 4
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          python - <<'PY'
        import pathlib
        import subprocess

        build_dir = pathlib.Path("qt/host/build-ci").resolve()
        run_environment = build_dir / "conanrun.bat"
        diagnostics_dir = build_dir / ".diagnostics"
        if not run_environment.is_file():
            raise SystemExit(f"Conan run environment is missing: {run_environment}")
        command = (
            f'call "{run_environment}" && '
            f'if not exist "{diagnostics_dir}" mkdir "{diagnostics_dir}" && '
            f'set "QT_QPA_PLATFORM=offscreen" && '
            f'set "QSG_RHI_BACKEND=software" && '
            f'set "QML_IMPORT_PATH={build_dir / "ZoinGallery"};{build_dir / "qml"}" && '
            f'set "QML2_IMPORT_PATH={build_dir / "ZoinGallery"};{build_dir / "qml"}" && '
            f'ctest --test-dir "{build_dir}" -C Release --output-on-failure '
            f'-R "^(F4|QtMediaClient|QtShellController|WindowGeometryPersistence)"'
        )
        result = subprocess.run(["cmd.exe", "/d", "/c", command])
        if result.returncode:
            raise SystemExit(f"Qt CTest gate failed: {result.returncode}")
        PY
        else
          test -f qt/host/build-ci/conanrun.sh
          source qt/host/build-ci/conanrun.sh
          mkdir -p qt/host/build-ci/.diagnostics
          export QT_QPA_PLATFORM=offscreen
          export QSG_RHI_BACKEND=software
          if [[ -f /etc/fonts/fonts.conf ]]; then
            export FONTCONFIG_FILE=/etc/fonts/fonts.conf
            export FONTCONFIG_PATH=/etc/fonts
          fi
          export QML_IMPORT_PATH="$PWD/qt/host/build-ci/ZoinGallery:$PWD/qt/host/build-ci/qml"
          export QML2_IMPORT_PATH="$PWD/qt/host/build-ci/ZoinGallery:$PWD/qt/host/build-ci/qml"
          set +e
          ctest --test-dir qt/host/build-ci -C Release --output-on-failure \
            -R '^(F4|QtMediaClient|QtShellController|WindowGeometryPersistence)'
          qt_test_status=$?
          set -e
          if [[ "$qt_test_status" -ne 0 ]]; then
            echo "::error::Qt CTest gate failed: $qt_test_status"
            exit "$qt_test_status"
          fi
        fi

    - name: Publish available Conan package graph
      # Upload packages even when a later Qt packaging/smoke-test step fails.
      # The per-job Conan cache contains only completed package binaries, so
      # this preserves useful work for the next parallel attempt.
      if: always() && !cancelled()
      shell: bash
      env:
        F4_CONAN_UPLOAD_TOKEN: ${{ secrets.F4_CONAN_UPLOAD_TOKEN }}
      run: python ci/upload-conan-packages.py

    - name: Install the integrated sidecar tree
      shell: bash
      run: |
        cmake --install qt/host/build-ci --config Release --prefix qt/host/stage-ci
        if [[ "$RUNNER_OS" == "macOS" ]]; then
          # Repair the final installed copy explicitly. This remains correct
          # even when a CMake generator changes install-script ordering.
          app_host="qt/host/stage-ci/bin/f4-qt-host.app/Contents/MacOS/f4-qt-host"
          while IFS= read -r rpath; do
            [[ -n "$rpath" ]] || continue
            install_name_tool -delete_rpath "$rpath" "$app_host"
          done < <(otool -l "$app_host" | awk '/cmd LC_RPATH/{getline; getline; sub(/^.*path /, ""); sub(/ [(]offset.*/, ""); print}')
          install_name_tool -add_rpath '@loader_path/../../../../lib' "$app_host"
        fi
        executable_suffix=""
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          executable_suffix=".exe"
        fi
        version_ldflags="$(python3 ci/go-build-metadata.py)"
        CGO_ENABLED=0 go build -trimpath -ldflags="-s -w $version_ldflags" \
          -o "qt/host/stage-ci/bin/f4${executable_suffix}" ./cmd/f4
        bash scripts/check_release_version.sh "qt/host/stage-ci/bin/f4${executable_suffix}" --version
        mkdir -p qt/host/stage-ci/bin/plugins/dummy_internal
        (
          cd plugins/dummy_internal
          CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' \
            -o "../../qt/host/stage-ci/bin/plugins/dummy_internal/f4-internal-dummy-plugin${executable_suffix}" .
        )
        cp -R internal/i18n/lang internal/dialog/help qt/host/stage-ci/bin/

    - name: Assemble classic macOS Qt app bundle
      if: runner.os == 'macOS'
      shell: bash
      run: |
        set -euo pipefail
        app="qt/host/stage-ci/F4.app"
        app_source="qt/host/stage-ci/bin/f4-qt-host.app"
        mkdir -p "$app/Contents/MacOS" "$app/Contents/Resources"

        # Keep the Qt host as the bundle's executable. With no arguments it
        # starts the sibling Go core in the same Contents/MacOS directory,
        # which makes Finder/LaunchServices launches use the Qt frontend.
        cp "qt/host/stage-ci/bin/f4" "$app/Contents/MacOS/f4"
        cp "$app_source/Contents/MacOS/f4-qt-host" \
          "$app/Contents/MacOS/f4-qt-host"
        cp "$app_source/Contents/Info.plist" "$app/Contents/Info.plist"
        cp -R "$app_source/Contents/Resources/." \
          "$app/Contents/Resources/"

        # Move every runtime payload under the bundle. The existing sidecar
        # tree remains the separately packaged developer/debug artifact.
        cp -R qt/host/stage-ci/lib qt/host/stage-ci/plugins \
          qt/host/stage-ci/qml qt/host/stage-ci/licenses \
          "$app/Contents/Resources/"
        cp -R qt/host/stage-ci/bin/lang qt/host/stage-ci/bin/help \
          qt/host/stage-ci/bin/plugins "$app/Contents/Resources/"
        chmod +x "$app/Contents/MacOS/f4" "$app/Contents/MacOS/f4-qt-host"
        sed -e 's/^Prefix=\.\.$/Prefix=./' \
          qt/host/stage-ci/bin/qt.conf \
          > "$app/Contents/Resources/qt.conf"

        # The installed nested app uses the sidecar-relative RPATH. The
        # classic bundle has the same libraries one level below MacOS, so
        # rewrite the copy rather than leaving any build-machine path behind.
        app_host="$app/Contents/MacOS/f4-qt-host"
        while IFS= read -r rpath; do
          install_name_tool -delete_rpath "$rpath" "$app_host"
        done < <(otool -l "$app_host" | awk '/cmd LC_RPATH/{getline; getline; sub(/^.*path /, ""); sub(/ [(]offset.*/, ""); print}')
        install_name_tool -add_rpath '@loader_path/../Resources/lib' "$app_host"

        # Conan's macOS Qt package is a relocatable collection of dylibs, not
        # a Qt framework tree, so macdeployqt has nothing useful to deploy
        # here.  The runtime has already been copied above.  Keep an ad-hoc
        # bundle seal for CI/local integrity; release artifacts do not require
        # a Developer ID certificate or Apple notarization.
        codesign --force --deep --sign - "$app"
        codesign --verify --deep --strict --verbose=2 "$app"

    - name: Prune macOS Conan build trees before cache save
      if: success()
      shell: bash
      run: |
        if [[ -d "$CONAN_HOME/p" ]]; then
          find "$CONAN_HOME/p" -type d -name s -prune -exec rm -rf {} +
        fi

    - name: Preserve the completed macOS native dependency graph
      if: success()
      uses: actions/cache/save@v4
      with:
        path: |
          .conan2
          build/qwindowkit-install
        key: qt-host-6.11.1-darwin-${{ runner.arch }}-v3

    - name: Validate and smoke-test the installed tree
      shell: bash
      run: |
        python - <<'PY'
        import os
        import pathlib
        import subprocess

        root = pathlib.Path("qt/host/stage-ci").resolve()
        suffix = ".exe" if os.environ["RUNNER_OS"] == "Windows" else ""
        core = root / "bin" / f"f4{suffix}"
        host = root / "bin" / f"f4-qt-host{suffix}"
        app_host = root / "bin" / "f4-qt-host.app" / "Contents" / "MacOS" / "f4-qt-host"
        app_icon = root / "bin" / "f4-qt-host.app" / "Contents" / "Resources" / "AppIcon.icns"
        classic_app_host = root / "F4.app" / "Contents" / "MacOS" / "f4-qt-host"
        classic_app_icon = root / "F4.app" / "Contents" / "Resources" / "AppIcon.icns"
        lucide_license = root / "licenses" / "Lucide-LICENSE.txt"
        required = [core, host, lucide_license]
        if os.environ["RUNNER_OS"] == "macOS":
            required.extend([app_host, app_icon, classic_app_host, classic_app_icon])
        missing = [str(path) for path in required if not path.is_file()]
        if missing:
            raise SystemExit("missing installed executable(s): " + ", ".join(missing))

        version = subprocess.run(
            [str(core), "--version"],
            cwd=root / "bin", env=os.environ.copy(), text=True,
            stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=30,
        )
        print("== f4 core version ==")
        print(version.stdout)
        if version.returncode != 0:
            raise SystemExit(
                f"installed f4 core returned {version.returncode} for --version"
            )

        env = os.environ.copy()
        env["QT_QPA_PLATFORM"] = "offscreen"
        env["QSG_RHI_BACKEND"] = "software"
        # Restrict Qt discovery to the installed tree. ZoinGallery is linked
        # statically, so successful startup proves that its QML types were
        # registered without relying on build-tree module/plugin files.
        env["QML_IMPORT_PATH"] = str(root / "qml")
        env["QML2_IMPORT_PATH"] = str(root / "qml")
        env["QT_PLUGIN_PATH"] = str(root / "plugins")
        if os.environ["RUNNER_OS"] == "Windows":
            # Do not inherit Conan cache paths: the smoke test must prove that
            # all runtime DLLs are present in the staged artifact.
            runtime_dirs = [root / "bin", root / "lib"]
            env["PATH"] = os.pathsep.join(
                [str(path) for path in runtime_dirs if path.is_dir()]
                + [env.get("PATH", "")]
            )
        host_command = ["--f4-ext-connect=127.0.0.1:1", "--f4-ext-nonce=ci-smoke",
                        "--f4-ext-cols=100", "--f4-ext-rows=30"]

        def run_host(executable, host_env, label):
            result = subprocess.run(
                [str(executable), *host_command],
                cwd=root / "bin", env=host_env, text=True,
                stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=30,
            )
            print(f"== {label} ==")
            print(result.stdout)
            if result.returncode != 2:
                raise SystemExit(
                    f"installed {label} returned {result.returncode}; expected 2 for a refused test socket"
                )
            failure_markers = (
                "QQmlApplicationEngine failed to load component",
                "module \"ZoinGallery\" is not installed",
                "Could not find the Qt platform plugin",
            )
            if any(marker in result.stdout for marker in failure_markers):
                raise SystemExit(f"installed {label} reported a deployment/QML import failure")

        run_host(host, env, "Qt host")

        if os.environ["RUNNER_OS"] == "macOS":
            # The app copy is what LaunchServices executes.  Do not give it
            # explicit sidecar paths: qt.conf plus the repaired @loader_path
            # RPATH must make the installed bundle relocatable on its own.
            app_env = env.copy()
            app_env.pop("QT_PLUGIN_PATH", None)
            app_env.pop("QML_IMPORT_PATH", None)
            app_env.pop("QML2_IMPORT_PATH", None)
            app_env.pop("DYLD_LIBRARY_PATH", None)
            app_env.pop("DYLD_FRAMEWORK_PATH", None)
            run_host(app_host, app_env, "macOS app bundle")

            rpath_dump = subprocess.run(
                ["otool", "-l", str(app_host)],
                check=True, text=True, stdout=subprocess.PIPE,
            ).stdout
            rpaths = []
            rpath_lines = rpath_dump.splitlines()
            for index, line in enumerate(rpath_lines):
                if line.strip() != "cmd LC_RPATH" or index + 2 >= len(rpath_lines):
                    continue
                path_line = rpath_lines[index + 2].strip()
                if path_line.startswith("path "):
                    rpaths.append(path_line[5:].split(" (offset ", 1)[0])
            print(f"macOS app RPATHs: {rpaths}")
            if any("/Users/runner/" in path for path in rpaths) or "@loader_path/../../../../lib" not in rpaths:
                raise SystemExit("installed macOS app bundle retained a non-relocatable RPATH")

            # The release-facing classic bundle owns its complete Qt runtime.
            # The host sets these paths from Contents/Resources before Qt is
            # initialized, so this test deliberately supplies no QT_* paths.
            classic_env = app_env.copy()
            run_host(classic_app_host, classic_env, "macOS classic app bundle")
            classic_rpath_dump = subprocess.run(
                ["otool", "-l", str(classic_app_host)],
                check=True, text=True, stdout=subprocess.PIPE,
            ).stdout
            classic_rpaths = []
            classic_rpath_lines = classic_rpath_dump.splitlines()
            for index, line in enumerate(classic_rpath_lines):
                if line.strip() != "cmd LC_RPATH" or index + 2 >= len(classic_rpath_lines):
                    continue
                path_line = classic_rpath_lines[index + 2].strip()
                if path_line.startswith("path "):
                    classic_rpaths.append(path_line[5:].split(" (offset ", 1)[0])
            print(f"classic macOS app RPATHs: {classic_rpaths}")
            if any("/Users/runner/" in path for path in classic_rpaths) or "@loader_path/../Resources/lib" not in classic_rpaths:
                raise SystemExit("classic macOS app bundle retained a non-relocatable RPATH")
        PY

    - name: Package integrated artifact
      id: qt-package
      shell: bash
      run: |
        go_arch="$(go env GOARCH)"
        artifact_base="f4-qt-${{ matrix.platform }}-${go_arch}"
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          archive="${artifact_base}.zip"
          ARTIFACT_ARCHIVE="$archive" python - <<'PY'
        import os
        import pathlib
        import zipfile

        source = pathlib.Path("qt/host/stage-ci")
        with zipfile.ZipFile(os.environ["ARTIFACT_ARCHIVE"], "w", zipfile.ZIP_DEFLATED) as archive:
            for path in source.rglob("*"):
                if path.is_file():
                    archive.write(path, path.relative_to(source))
        PY
        else
          archive="${artifact_base}.tar.gz"
          tar -czf "$archive" -C qt/host/stage-ci .
        fi
        app_archive=""
        if [[ "$RUNNER_OS" == "macOS" ]]; then
          app_archive="${artifact_base}.app.zip"
          ditto -c -k --sequesterRsrc --keepParent \
            qt/host/stage-ci/F4.app "$app_archive"
        fi
        {
          echo "name=$artifact_base"
          echo "archive=$archive"
          echo "app_archive=$app_archive"
        } >> "$GITHUB_OUTPUT"

    - name: Upload integrated Qt artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.qt-package.outputs.name }}
        path: ${{ steps.qt-package.outputs.archive }}
        if-no-files-found: error
        retention-days: 7

    - name: Upload classic macOS Qt app bundle
      if: runner.os == 'macOS'
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.qt-package.outputs.name }}-app
        path: ${{ steps.qt-package.outputs.app_archive }}
        if-no-files-found: error
        retention-days: 7

  portable-qt:
    name: Portable single-file Qt (${{ matrix.platform }}/${{ matrix.arch }})
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.publish_qt_release) }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
            arch: amd64
            goarch: amd64
            conan_arch: x86_64
            # Conan package IDs do not record the libc they were compiled
            # against. Keep this compatibility contract in the cache namespace
            # rather than allowing a newer runner's packages to leak in.
            cache_contract: glibc-2.27-gcc11
          - runner: ubuntu-24.04-arm
            platform: linux
            arch: arm64
            goarch: arm64
            conan_arch: armv8
            cache_contract: glibc-2.27-gcc11
          - runner: windows-2022
            platform: windows
            arch: amd64
            goarch: amd64
            conan_arch: x86_64
            msvc_arch: amd64
            cache_contract: msvc-v143-static
          - runner: windows-2022
            platform: windows
            arch: arm64
            goarch: arm64
            conan_arch: armv8
            msvc_arch: amd64_arm64
            # The previous cache contains a target Qt package that was
            # packaged without Qt Quick after host qsb discovery failed.
            # Keep it out of restore-keys while the recipe guard rebuilds it.
            cache_contract: msvc-v143-static-qt-tools-v2
    env:
      F4_RELEASE_TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_qt_release && inputs.release_tag || '' }}
      CONAN_HOME: ${{ github.workspace }}/.conan2-portable-${{ matrix.platform }}-${{ matrix.arch }}
      F4_CONAN_REMOTE_URL: ${{ vars.F4_CONAN_REMOTE_URL }}
      F4_CONAN_UPLOAD_URL: ${{ vars.F4_CONAN_UPLOAD_URL }}
      F4_CONAN_USERNAME: ${{ vars.F4_CONAN_USERNAME }}

    steps:
    - name: Checkout f4
      uses: actions/checkout@v4
      with:
        submodules: recursive
        ssh-key: ${{ secrets.SUBMODULE_SSH_KEY }}

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.x'
        cache-dependency-path: go.sum

    - name: Enable the MSVC build environment
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1
      with:
        arch: ${{ matrix.msvc_arch }}

    - name: Restore packaged portable native dependencies
      id: portable-conan-cache
      uses: actions/cache/restore@v4
      with:
        # Conan package folders are reusable after an interrupted build; its
        # source and object trees are not. Keep this deliberately narrow so
        # an ARM Qt build can checkpoint within GitHub's cache quota.
        # Do not hash this workflow: release packaging and macOS checks must
        # not invalidate the native Linux/Windows Conan dependency graph.
        path: ${{ env.CONAN_HOME }}/p
        key: portable-conan-packages-6.11.1-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.cache_contract }}-v8-video-audio-complete-${{ hashFiles('qt/host/conanfile.py', 'qt/host/CMakeLists.txt', 'ci/build-portable-qt-linux.sh', 'ci/arm64_glibc_archives.py', 'ci/build-qwindowkit.sh', 'ci/build-qwindowkit.ps1', 'ci/patches/qwindowkit-default-maximize-hint.patch', 'ci/patches/libiconv-1.17-fix-error-function-declaration-without-prototype.patch', 'ci/configure-conan-remote.sh', 'ci/patch-qt-recipe.sh', 'ci/patch-qt-dependencies.py', 'ci/patch-qt-qmltools-recipe.py', 'ci/patch-bzip2-recipe.py', 'ci/patch-bzip2-recipe.sh', 'ci/patch-libgettext-recipe.py', 'ci/patch-libgettext-recipe.sh', 'ci/patch-libiconv-recipe.py', 'ci/patch-libiconv-recipe.sh', 'ci/patch-libffi-recipe.py', 'ci/patch-libffi-recipe.sh') }}
        restore-keys: |
          portable-conan-packages-6.11.1-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.cache_contract }}-v8-video-audio-complete-
          portable-conan-packages-6.11.1-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.cache_contract }}-v8-video-audio-checkpoint-
          portable-conan-packages-6.11.1-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.cache_contract }}-v7-video-complete-
          portable-conan-packages-6.11.1-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.cache_contract }}-v7-video-checkpoint-
          portable-conan-packages-6.11.1-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.cache_contract }}-v6-complete-
          portable-conan-packages-6.11.1-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.cache_contract }}-v6-checkpoint-

    - name: Cache the ARM64 baseline CMake tool
      if: runner.os == 'Linux' && matrix.arch == 'arm64'
      uses: actions/cache@v4
      with:
        path: ${{ env.CONAN_HOME }}/.f4-build-tools
        key: portable-cmake-3.31.6-linux-arm64-v1

    - name: Build the glibc 2.27 portable executable
      if: runner.os == 'Linux'
      shell: bash
      env:
        F4_CONAN_TOKEN: ${{ secrets.F4_CONAN_REMOTE_TOKEN }}
        F4_CONAN_UPLOAD_TOKEN: ${{ secrets.F4_CONAN_UPLOAD_TOKEN }}
        F4_CONAN_UPLOAD_REQUIRED: ${{ (github.ref == 'refs/heads/zoin' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.bootstrap_multimedia_dependencies)) && '1' || '0' }}
        F4_CONAN_REQUIRED_RECIPE_REFS: qt/6.11.1,pulseaudio/14.2,ffmpeg/7.1.5,libffi/3.4.8
        F4_CONAN_EXPECTED_ARCH: ${{ matrix.conan_arch }}
        # Consume the audited prebuilt graph, including Qt/FFmpeg/PulseAudio.
        # Only an explicit bootstrap dispatch may repair native packages.
        # Publishing always consumes the graph with --build=never.
        F4_CONAN_TRUST_REMOTE_BASELINE: ${{ github.event_name != 'pull_request' && !(github.event_name == 'workflow_dispatch' && inputs.bootstrap_multimedia_dependencies && !inputs.publish_qt_release) && '1' || '0' }}
        F4_CONAN_BOOTSTRAP_MULTIMEDIA: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap_multimedia_dependencies && !inputs.publish_qt_release && '1' || '0' }}
      run: |
        go_root="$(go env GOROOT)"
        set +e
        docker run --rm \
          -e CONAN_HOME=/workspace/.conan2-portable-linux-${{ matrix.arch }} \
          -e TARGET_ARCH=${{ matrix.goarch }} \
          -e GITHUB_REF -e GITHUB_REF_NAME -e GITHUB_SHA -e VERSION_SYMBOL \
          -e F4_RELEASE_TAG \
          -e F4_CONAN_REMOTE_URL \
          -e F4_CONAN_UPLOAD_URL \
          -e F4_CONAN_USERNAME \
          -e F4_CONAN_TOKEN \
          -e F4_CONAN_UPLOAD_TOKEN \
          -e F4_CONAN_UPLOAD_REQUIRED \
          -e F4_CONAN_REQUIRED_RECIPE_REFS \
          -e F4_CONAN_EXPECTED_ARCH \
          -e F4_CONAN_TRUST_REMOTE_BASELINE \
          -e F4_CONAN_BOOTSTRAP_MULTIMEDIA \
          -v "$PWD:/workspace" \
          -v "$go_root:/opt/go:ro" \
          -w /workspace \
          ubuntu:18.04 \
          bash ci/build-portable-qt-linux.sh
        build_status=$?
        set -e
        docker run --rm \
          -v "$PWD:/workspace" \
          ubuntu:18.04 \
          sh -c 'for path in \
            /workspace/.conan2-portable-linux-${{ matrix.arch }}/p \
            /workspace/.conan2-portable-linux-${{ matrix.arch }}/.f4-build-tools \
            /workspace/build/qwindowkit-src \
            /workspace/build/qwindowkit-build \
            /workspace/build/qwindowkit-install \
            /workspace/qt/host/build-portable-linux-${{ matrix.arch }}; do \
              if [ -e "$path" ]; then chmod -R a+rwX "$path"; fi; \
            done'
        exit "$build_status"

    - name: Install native build tools
      if: runner.os == 'Windows'
      shell: bash
      run: |
        python -m pip install --upgrade pip
        # Ninja 1.13.0 truncates long MSVC linker response-file lines at
        # 16,383 characters, producing broken object paths such as
        # `ry\CMakeFiles\...`. Keep the Windows static Qt link stable on the
        # fixed in the 1.13.1+ line; use the available 1.13.2 wheel.
        python -m pip install "conan==2.29.1" "cmake==3.31.6" "ninja==1.13.2"
        conan profile detect --force

    - name: Configure Conan binary remote (Windows)
      if: runner.os == 'Windows'
      shell: bash
      env:
        F4_CONAN_TOKEN: ${{ secrets.F4_CONAN_REMOTE_TOKEN }}
      run: bash ci/configure-conan-remote.sh

    - name: Patch legacy bzip2 Conan recipe (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: bash ci/patch-bzip2-recipe.sh

    - name: Patch libgettext Conan recipe for Windows MSVC
      if: runner.os == 'Windows'
      shell: bash
      run: bash ci/patch-libgettext-recipe.sh

    - name: Patch libiconv Conan recipe for Windows ARM64
      if: runner.os == 'Windows' && matrix.arch == 'arm64'
      shell: bash
      run: bash ci/patch-libiconv-recipe.sh

    - name: Patch libffi Conan recipe for Windows ARM64
      if: runner.os == 'Windows' && matrix.arch == 'arm64'
      shell: bash
      run: bash ci/patch-libffi-recipe.sh

    - name: Patch Qt Conan recipe dependencies (Windows)
      if: runner.os == 'Windows'
      shell: bash
      run: bash ci/patch-qt-recipe.sh "${{ matrix.arch }}"

    - name: Build the portable Windows executable
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"

        # tukaani.org intermittently times out from GitHub's Windows runners.
        # Export the unchanged Conan Center recipe with the byte-identical
        # archive served by the upstream project's GitHub release instead.
        $xzRevisionJson = conan list "xz_utils/5.8.3:*" -r conancenter --format=json | ConvertFrom-Json
        if ($LASTEXITCODE -ne 0) { throw "Unable to list the xz recipe revisions" }
        $xzRevisions = $xzRevisionJson.conancenter.'xz_utils/5.8.3'.revisions
        $xzRevision = ($xzRevisions.PSObject.Properties |
          Sort-Object { $_.Value.timestamp } -Descending |
          Select-Object -First 1).Name
        if ([string]::IsNullOrWhiteSpace($xzRevision)) {
          throw "Unable to resolve the latest xz recipe revision"
        }
        conan download "xz_utils/5.8.3#$xzRevision" --only-recipe --remote=conancenter
        if ($LASTEXITCODE -ne 0) { throw "Unable to download the xz recipe" }
        $xzRecipe = (conan cache path "xz_utils/5.8.3#$xzRevision" | Select-Object -Last 1).Trim()
        if ($LASTEXITCODE -ne 0) { throw "Unable to locate the xz recipe" }
        $xzRecipeCopy = Join-Path $env:RUNNER_TEMP "f4-xz-recipe"
        Remove-Item -Recurse -Force $xzRecipeCopy -ErrorAction SilentlyContinue
        New-Item -ItemType Directory -Force $xzRecipeCopy | Out-Null
        Copy-Item "$xzRecipe/conanfile.py", "$xzRecipe/conandata.yml" $xzRecipeCopy
        $xzData = Join-Path $xzRecipeCopy "conandata.yml"
        (Get-Content $xzData -Raw).Replace(
          "https://tukaani.org/xz/",
          "https://github.com/tukaani-project/xz/releases/download/v5.8.3/"
        ) | Set-Content $xzData -NoNewline
        if (!(Select-String -Quiet -Path $xzData -SimpleMatch `
          "https://github.com/tukaani-project/xz/releases/download/v5.8.3/xz-5.8.3.tar.xz")) {
          throw "The xz mirror URL was not installed into the recipe"
        }
        conan export $xzRecipeCopy --name=xz_utils --version=5.8.3
        if ($LASTEXITCODE -ne 0) { throw "Unable to export the mirrored xz recipe" }

        $conanInstalled = $false
        $buildDir = "qt/host/build-portable-windows-${{ matrix.arch }}"
        $distDir = "dist/f4-windows-${{ matrix.arch }}"
        # OpenSSL's optional zlib provider is not linkable in the
        # ConanCenter ARM64/MSVC package; f4 does not use it.
        # Qt's cross-build recipe needs native qsb and QML tools. Configure
        # its build-context Qt tool requirement with the same modules so
        # Qt6ShaderToolsTools, Qt6QuickTools, and qmlcachegen exist for the
        # ARM64 target. QtDeclarative's svgtoqml host tool is only generated
        # when the native build-context Qt also has qtsvg enabled.
        $nativeQtOptions = @()
        if ("${{ matrix.arch }}" -eq "arm64") {
          $nativeQtOptions = @("-o:b", "qt/*:qtsvg=True")
        }
        $qtForceOnRetry = $false
        if ("${{ matrix.arch }}" -eq "arm64") {
          $qtMarker = Join-Path $env:CONAN_HOME "p/.f4-qt-quick-ready"
          if (!(Test-Path -LiteralPath $qtMarker -PathType Leaf)) {
            # An earlier ARM package was published without Qt Quick.  The
            # recipe validation now rejects it, but Conan considers a matching
            # remote package present and --build=missing will not replace it.
            # Drop stale local Qt binaries and try the remote graph first. If
            # that package is still invalid, the retry below forces a rebuild
            # with the corrected qsb/QML-tool wiring. This lets a successful
            # one-time rebuild published by an earlier job be reused without
            # compiling Qt again.
            conan remove "qt/6.11.1:*" --confirm
            if ($LASTEXITCODE -ne 0) { throw "Unable to remove the stale ARM64 Qt package" }
            $qtForceOnRetry = $true
          } else {
            Write-Host "Reusing the validated ARM64 Qt Quick package graph"
          }
        }
        for ($attempt = 1; $attempt -le 3; $attempt++) {
          $conanBuildArgs = @("--build=missing")
          if ($qtForceOnRetry -and $attempt -gt 1) {
            $conanBuildArgs += "--build=qt/*"
          }
          conan install qt/host @conanBuildArgs `
            -s:h arch=${{ matrix.conan_arch }} -s:h build_type=Release -s:h compiler.cppstd=20 `
            -s:h compiler.runtime=static `
            -s:b build_type=Release -s:b compiler.cppstd=20 `
            -s:b compiler.runtime=static `
            -o:h "qt/*:shared=False" `
            -o:h "*:with_video_thumbnails=True" `
            -o:h "*:with_ffmpeg_backend=True" `
            -o:h "qt/*:with_ffmpeg=True" `
            -o:b "qt/*:shared=False" `
            -o:b "qt/*:qtdeclarative=True" `
            -o:b "qt/*:qtshadertools=True" `
            @nativeQtOptions `
            -o:h "qt/*:with_libjpeg=libjpeg-turbo" `
            -o:b "qt/*:with_libjpeg=libjpeg-turbo" `
            -o:h "openssl/*:no_zlib=True" `
            -o:b "openssl/*:no_zlib=True" `
            -o:b "qt/*:with_pq=False" `
            -o:b "qt/*:with_odbc=False" `
            -o:h "qt/*:disabled_features=quickcontrols2_fusion quickcontrols2_imagine quickcontrols2_material quickcontrols2_universal quickcontrols2_fluentwinui3 quickcontrols2_stylekit quickcontrols2_windows" `
            -o:b "qt/*:disabled_features=quickcontrols2_fusion quickcontrols2_imagine quickcontrols2_material quickcontrols2_universal quickcontrols2_fluentwinui3 quickcontrols2_stylekit quickcontrols2_windows" `
            -o:h "libraw/*:shared=False" `
            -c:a '*/*:tools.cmake.cmaketoolchain:extra_variables={"CMAKE_POLICY_VERSION_MINIMUM":{"cache":True,"type":"STRING","value":"3.5"}}' `
            -c:a '*/*:tools.cmake:configure_args=["-DCMAKE_POLICY_VERSION_MINIMUM=3.5"]' `
            -c tools.cmake.cmaketoolchain:generator=Ninja `
            -c tools.system.package_manager:mode=install `
            --output-folder=$buildDir
          if ($LASTEXITCODE -eq 0) {
            $conanInstalled = $true
            break
          }
          if ($attempt -lt 3) {
            $delay = $attempt * 15
            Write-Warning "Conan install attempt $attempt failed; retrying in ${delay}s"
            Start-Sleep -Seconds $delay
          }
        }
        if (!$conanInstalled) { throw "Conan install failed after 3 attempts" }
        if ("${{ matrix.arch }}" -eq "arm64") {
          New-Item -ItemType File -Force (Join-Path $env:CONAN_HOME "p/.f4-qt-quick-ready") | Out-Null
        }
        New-Item -ItemType File -Force (Join-Path $buildDir '.f4-conan-ready') | Out-Null
        $PSNativeCommandUseErrorActionPreference = $true

        pwsh -File ci/build-qwindowkit.ps1 `
          -QtRoot "$PWD/$buildDir" `
          -BuildType Release -Linkage static
        $qtCrossTools = Join-Path $PWD "$buildDir/f4-qt-cross-tools.cmake"
        $qtCrossToolArgs = @()
        if (Test-Path -LiteralPath $qtCrossTools -PathType Leaf) {
          # Conan writes this setting into its toolchain, but CMake reads
          # CMAKE_PROJECT_INCLUDE_BEFORE before the toolchain has executed.
          # Pass it on the command line so the native Qt executable targets
          # are declared before the target Qt package's build modules load.
          $qtCrossToolArgs += "-DCMAKE_PROJECT_INCLUDE_BEFORE=$qtCrossTools"
        }
        $buildTesting = "ON"
        if ("${{ matrix.arch }}" -eq "arm64") {
          # The x64 runner cannot execute ARM64 tests, and compiling those
          # targets only lengthens the cross-build without contributing to
          # the portable artifact. Native test coverage remains enabled for
          # the amd64 cell.
          $buildTesting = "OFF"
        }
        cmake -S qt/host -B $buildDir -G Ninja `
          "-DCMAKE_TOOLCHAIN_FILE=$PWD/$buildDir/conan_toolchain.cmake" `
          -DCMAKE_BUILD_TYPE=Release `
          "-DCMAKE_PREFIX_PATH=$PWD/build/qwindowkit-install" `
          "-DQWindowKit_DIR=$PWD/build/qwindowkit-install/lib/cmake/QWindowKit" `
          "-DBUILD_TESTING=$buildTesting" -DUSE_QWK=ON -DF4_PORTABLE_STATIC=ON `
          -DF4_ENABLE_VIDEO_THUMBNAILS=ON -DF4_ENABLE_FFMPEG_BACKEND=ON `
          @qtCrossToolArgs
        cmake --build $buildDir --config Release --parallel 4
        New-Item -ItemType Directory -Force (Join-Path $buildDir '.diagnostics') | Out-Null
        $env:QT_QPA_PLATFORM = "offscreen"
        $env:QSG_RHI_BACKEND = "software"
        $env:QML_IMPORT_PATH = "$PWD/$buildDir/ZoinGallery;$PWD/$buildDir/qml"
        $env:QML2_IMPORT_PATH = "$PWD/$buildDir/ZoinGallery;$PWD/$buildDir/qml"
        if ("${{ matrix.arch }}" -eq "arm64") {
          # The GitHub Windows runner is x64, so it cannot execute the ARM64
          # CTest binaries.  The cross-build still compiles and links every
          # test target; the native ARM smoke/test pass belongs on an ARM64
          # runner or the local Windows ARM VM.
          Write-Host "Skipping Windows ARM64 target CTest on the x64 runner"
        } else {
          $PSNativeCommandUseErrorActionPreference = $false
          ctest --test-dir $buildDir -C Release --output-on-failure `
            -R "^(F4|QtMediaClient|QtShellController|WindowGeometryPersistence)"
          $qtTestStatus = $LASTEXITCODE
          $PSNativeCommandUseErrorActionPreference = $true
          if ($qtTestStatus -ne 0) {
            throw "Qt CTest gate failed: $qtTestStatus"
          }
        }

        $qtHost = "$PWD/$buildDir/bin/Release/f4-qt-host.exe"
        pwsh -File ci/audit-portable-qt-windows.ps1 -HostPath $qtHost
        if ("${{ matrix.arch }}" -eq "arm64") {
          Write-Host "Skipping Windows ARM64 target startup smoke on the x64 runner"
        } else {
          $env:QT_QPA_PLATFORM = "offscreen"
          $env:QSG_RHI_BACKEND = "software"
          $env:F4_QT_HOST_STARTUP_SMOKE_ONLY = "1"
          $smokeProcess = Start-Process -FilePath $qtHost -NoNewWindow -PassThru `
            -ArgumentList @("--f4-ext-connect=127.0.0.1:1", "--f4-ext-nonce=ci-smoke", `
              "--f4-ext-cols=100", "--f4-ext-rows=30")
          if (!$smokeProcess.WaitForExit(120000)) {
            Stop-Process -Id $smokeProcess.Id -Force
            throw "Static Qt host did not finish its disconnected smoke test within 120 seconds"
          }
          $smokeStatus = $smokeProcess.ExitCode
          if ($smokeStatus -ne 2) {
            throw "Disconnected static Qt host returned $smokeStatus, expected 2"
          }
        }

        python ci/package-embedded-qt-host.py $qtHost
        go test -tags f4_embedded_qt_host `
          -run "TestMaterializeEmbeddedQtHost|TestGeneratedEmbeddedQtHostPayload" ./internal/plughost
        New-Item -ItemType Directory -Force $distDir | Out-Null
        $env:CGO_ENABLED = "0"
        $env:GOOS = "windows"
        $env:GOARCH = "${{ matrix.goarch }}"
        $launcherLdflags = python ci/go-build-metadata.py
        if ($LASTEXITCODE -ne 0) { throw "Go launcher metadata generation failed" }
        go build -trimpath -tags f4_embedded_qt_host -ldflags="$launcherLdflags" `
          -o $distDir/f4.exe ./cmd/f4
        if ($LASTEXITCODE -ne 0) { throw "Go launcher build failed" }
        if ("${{ matrix.goarch }}" -eq "amd64") {
          $versionOutput = & "$distDir/f4.exe" --version
          if ($LASTEXITCODE -ne 0) { throw "Portable launcher --version failed" }
          if ($env:GITHUB_REF -like "refs/tags/v*" -and
              ($versionOutput -split '\s+')[0] -ne $env:GITHUB_REF_NAME) {
            throw "Portable launcher reports $versionOutput instead of $env:GITHUB_REF_NAME"
          }
        }
        $files = @(Get-ChildItem $distDir -File)
        if ($files.Count -ne 1 -or $files[0].Name -ne "f4.exe") {
          throw "Portable Windows artifact must contain only f4.exe"
        }

    - name: Publish available Conan package graph (Windows)
      # Keep completed dependency binaries when the static executable or its
      # smoke test fails after Conan has already built them.
      if: always() && !cancelled() && runner.os == 'Windows'
      shell: bash
      env:
        F4_CONAN_UPLOAD_TOKEN: ${{ secrets.F4_CONAN_UPLOAD_TOKEN }}
      run: python ci/upload-conan-packages.py

    - name: Prune Windows Conan cache to reusable packages
      if: always() && !cancelled() && runner.os == 'Windows'
      shell: pwsh
      run: |
        $packageRoot = Join-Path $env:CONAN_HOME 'p'
        if (Test-Path -LiteralPath $packageRoot) {
          conan cache clean "*" --source --build --temp --backup-sources
          if ($LASTEXITCODE -ne 0) { throw "Unable to prune the Conan cache" }
          New-Item -ItemType File -Force (Join-Path $packageRoot '.f4-package-cache-ready') | Out-Null
        }

    - name: Save interrupted Conan package checkpoint
      # Actions caches are immutable. A checkpoint must receive a new key on
      # each failed run, otherwise restoring one partial graph would prevent
      # the next run from saving the packages it finishes afterwards.
      if: always() && !cancelled() && steps.portable-conan-cache.outputs.cache-hit != 'true' && hashFiles(format('.conan2-portable-{0}-{1}/p/.f4-package-cache-ready', matrix.platform, matrix.arch)) != '' && hashFiles(format('qt/host/build-portable-{0}-{1}/.f4-conan-ready', matrix.platform, matrix.arch)) == ''
      uses: actions/cache/save@v4
      with:
        path: ${{ env.CONAN_HOME }}/p
        key: portable-conan-packages-6.11.1-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.cache_contract }}-v8-video-audio-checkpoint-${{ hashFiles('qt/host/conanfile.py', 'qt/host/CMakeLists.txt', 'ci/build-portable-qt-linux.sh', 'ci/arm64_glibc_archives.py', 'ci/build-qwindowkit.sh', 'ci/build-qwindowkit.ps1', 'ci/patches/qwindowkit-default-maximize-hint.patch', 'ci/patches/libiconv-1.17-fix-error-function-declaration-without-prototype.patch', 'ci/configure-conan-remote.sh', 'ci/patch-qt-recipe.sh', 'ci/patch-qt-dependencies.py', 'ci/patch-qt-qmltools-recipe.py', 'ci/patch-bzip2-recipe.py', 'ci/patch-bzip2-recipe.sh', 'ci/patch-libgettext-recipe.py', 'ci/patch-libgettext-recipe.sh', 'ci/patch-libiconv-recipe.py', 'ci/patch-libiconv-recipe.sh', 'ci/patch-libffi-recipe.py', 'ci/patch-libffi-recipe.sh') }}-${{ github.run_id }}-${{ github.run_attempt }}

    - name: Save complete Conan package graph
      if: always() && !cancelled() && steps.portable-conan-cache.outputs.cache-hit != 'true' && hashFiles(format('.conan2-portable-{0}-{1}/p/.f4-package-cache-ready', matrix.platform, matrix.arch)) != '' && hashFiles(format('qt/host/build-portable-{0}-{1}/.f4-conan-ready', matrix.platform, matrix.arch)) != ''
      uses: actions/cache/save@v4
      with:
        path: ${{ env.CONAN_HOME }}/p
        key: portable-conan-packages-6.11.1-${{ matrix.platform }}-${{ matrix.arch }}-${{ matrix.cache_contract }}-v8-video-audio-complete-${{ hashFiles('qt/host/conanfile.py', 'qt/host/CMakeLists.txt', 'ci/build-portable-qt-linux.sh', 'ci/arm64_glibc_archives.py', 'ci/build-qwindowkit.sh', 'ci/build-qwindowkit.ps1', 'ci/patches/qwindowkit-default-maximize-hint.patch', 'ci/patches/libiconv-1.17-fix-error-function-declaration-without-prototype.patch', 'ci/configure-conan-remote.sh', 'ci/patch-qt-recipe.sh', 'ci/patch-qt-dependencies.py', 'ci/patch-qt-qmltools-recipe.py', 'ci/patch-bzip2-recipe.py', 'ci/patch-bzip2-recipe.sh', 'ci/patch-libgettext-recipe.py', 'ci/patch-libgettext-recipe.sh', 'ci/patch-libiconv-recipe.py', 'ci/patch-libiconv-recipe.sh', 'ci/patch-libffi-recipe.py', 'ci/patch-libffi-recipe.sh') }}

    - name: Package portable single-file artifact
      shell: bash
      run: |
        set -euo pipefail
        artifact_base="f4-${{ matrix.platform }}-${{ matrix.arch }}"
        source_dir="dist/${artifact_base}"
        if [[ "${{ matrix.platform }}" == "windows" ]]; then
          archive="${artifact_base}.zip"
          SOURCE_DIR="$source_dir" ARCHIVE="$archive" python - <<'PY'
        import os
        import pathlib
        import zipfile

        source_dir = pathlib.Path(os.environ["SOURCE_DIR"])
        archive_path = pathlib.Path(os.environ["ARCHIVE"])
        with zipfile.ZipFile(archive_path, "w", zipfile.ZIP_DEFLATED) as archive:
            archive.write(source_dir / "f4.exe", "f4.exe")
        PY
          # Same Qt launcher as the zip, with filters disabled for old readers.
          sevenzip="$(command -v 7z || command -v 7zz || command -v 7za)"
          archive_output="$PWD/${artifact_base}.7z"
          pushd "$source_dir" >/dev/null
          "$sevenzip" a -t7z -mx=9 -mf=off -bd "$archive_output" f4.exe
          popd >/dev/null
        else
          archive="${artifact_base}.tar.gz"
          tar -czf "$archive" -C "$source_dir" f4
        fi
        echo "Packaged $archive"

    - name: Upload portable single-file artifact
      uses: actions/upload-artifact@v4
      with:
        name: f4-portable-${{ matrix.platform }}-${{ matrix.arch }}
        path: f4-${{ matrix.platform }}-${{ matrix.arch }}.*
        if-no-files-found: error
        retention-days: 7

  portable-qt-linux:
    name: Linux release binary (${{ matrix.arch }})
    if: ${{ github.event_name == 'workflow_dispatch' && inputs.publish_qt_release }}
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
            goarch: amd64
            conan_arch: x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
            goarch: arm64
            conan_arch: armv8
    env:
      F4_RELEASE_TAG: ${{ inputs.release_tag }}
      CONAN_HOME: ${{ github.workspace }}/.conan2-portable-linux-${{ matrix.arch }}
      F4_CONAN_REMOTE_URL: ${{ vars.F4_CONAN_REMOTE_URL }}
      F4_CONAN_UPLOAD_URL: ${{ vars.F4_CONAN_UPLOAD_URL }}
      F4_CONAN_USERNAME: ${{ vars.F4_CONAN_USERNAME }}

    steps:
    - name: Checkout f4
      uses: actions/checkout@v4
      with:
        submodules: recursive
        ssh-key: ${{ secrets.SUBMODULE_SSH_KEY }}

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.x'
        cache-dependency-path: go.sum

    - name: Restore packaged Linux Conan dependencies
      id: portable-conan-cache
      uses: actions/cache/restore@v4
      with:
        path: ${{ env.CONAN_HOME }}/p
        key: portable-conan-packages-6.11.1-linux-${{ matrix.arch }}-glibc-2.27-gcc11-v8-video-audio-complete-${{ hashFiles('qt/host/conanfile.py', 'qt/host/CMakeLists.txt', 'ci/build-portable-qt-linux.sh', 'ci/arm64_glibc_archives.py', 'ci/build-qwindowkit.sh', 'ci/build-qwindowkit.ps1', 'ci/patches/qwindowkit-default-maximize-hint.patch', 'ci/patches/libiconv-1.17-fix-error-function-declaration-without-prototype.patch', 'ci/configure-conan-remote.sh', 'ci/patch-qt-recipe.sh', 'ci/patch-qt-dependencies.py', 'ci/patch-qt-qmltools-recipe.py', 'ci/patch-bzip2-recipe.py', 'ci/patch-bzip2-recipe.sh', 'ci/patch-libgettext-recipe.py', 'ci/patch-libgettext-recipe.sh', 'ci/patch-libiconv-recipe.py', 'ci/patch-libiconv-recipe.sh', 'ci/patch-libffi-recipe.py', 'ci/patch-libffi-recipe.sh') }}
        restore-keys: |
          portable-conan-packages-6.11.1-linux-${{ matrix.arch }}-glibc-2.27-gcc11-v8-video-audio-complete-
          portable-conan-packages-6.11.1-linux-${{ matrix.arch }}-glibc-2.27-gcc11-v8-video-audio-checkpoint-
          portable-conan-packages-6.11.1-linux-${{ matrix.arch }}-glibc-2.27-gcc11-v7-video-complete-
          portable-conan-packages-6.11.1-linux-${{ matrix.arch }}-glibc-2.27-gcc11-v7-video-checkpoint-
          portable-conan-packages-6.11.1-linux-${{ matrix.arch }}-glibc-2.27-gcc11-v6-complete-
          portable-conan-packages-6.11.1-linux-${{ matrix.arch }}-glibc-2.27-gcc11-v6-checkpoint-

    - name: Cache the ARM64 baseline CMake tool
      if: matrix.arch == 'arm64'
      uses: actions/cache@v4
      with:
        path: ${{ env.CONAN_HOME }}/.f4-build-tools
        key: portable-cmake-3.31.6-linux-arm64-v1

    - name: Build the glibc 2.27 portable executable
      shell: bash
      env:
        F4_CONAN_TOKEN: ${{ secrets.F4_CONAN_REMOTE_TOKEN }}
        F4_CONAN_UPLOAD_TOKEN: ${{ secrets.F4_CONAN_UPLOAD_TOKEN }}
        F4_CONAN_UPLOAD_REQUIRED: ${{ (github.ref == 'refs/heads/zoin' || startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.bootstrap_multimedia_dependencies)) && '1' || '0' }}
        F4_CONAN_REQUIRED_RECIPE_REFS: qt/6.11.1,pulseaudio/14.2,ffmpeg/7.1.5,libffi/3.4.8
        F4_CONAN_EXPECTED_ARCH: ${{ matrix.conan_arch }}
        # --build=never in trusted mode forbids building the entire graph.
        # The narrower repair-path flag cannot be combined with trusted mode.
        F4_CONAN_FORBID_QT_FFMPEG_BUILD: '0'
        F4_CONAN_TRUST_REMOTE_BASELINE: ${{ github.event_name != 'pull_request' && !(github.event_name == 'workflow_dispatch' && inputs.bootstrap_multimedia_dependencies && !inputs.publish_qt_release) && '1' || '0' }}
        F4_CONAN_BOOTSTRAP_MULTIMEDIA: ${{ github.event_name == 'workflow_dispatch' && inputs.bootstrap_multimedia_dependencies && !inputs.publish_qt_release && '1' || '0' }}
      run: |
        go_root="$(go env GOROOT)"
        set +e
        docker run --rm \
          -e CONAN_HOME=/workspace/.conan2-portable-linux-${{ matrix.arch }} \
          -e TARGET_ARCH=${{ matrix.goarch }} \
          -e GITHUB_REF -e GITHUB_REF_NAME -e GITHUB_SHA -e VERSION_SYMBOL \
          -e F4_RELEASE_TAG \
          -e F4_CONAN_REMOTE_URL \
          -e F4_CONAN_UPLOAD_URL \
          -e F4_CONAN_USERNAME \
          -e F4_CONAN_TOKEN \
          -e F4_CONAN_UPLOAD_TOKEN \
          -e F4_CONAN_UPLOAD_REQUIRED \
          -e F4_CONAN_REQUIRED_RECIPE_REFS \
          -e F4_CONAN_EXPECTED_ARCH \
          -e F4_CONAN_FORBID_QT_FFMPEG_BUILD \
          -e F4_CONAN_TRUST_REMOTE_BASELINE \
          -e F4_CONAN_BOOTSTRAP_MULTIMEDIA \
          -v "$PWD:/workspace" \
          -v "$go_root:/opt/go:ro" \
          -w /workspace \
          ubuntu:18.04 \
          bash ci/build-portable-qt-linux.sh
        build_status=$?
        set -e
        docker run --rm \
          -v "$PWD:/workspace" \
          ubuntu:18.04 \
          sh -c 'for path in \
            /workspace/.conan2-portable-linux-${{ matrix.arch }}/p \
            /workspace/.conan2-portable-linux-${{ matrix.arch }}/.f4-build-tools \
            /workspace/build/qwindowkit-src \
            /workspace/build/qwindowkit-build \
            /workspace/build/qwindowkit-install \
            /workspace/qt/host/build-portable-linux-${{ matrix.arch }}; do \
              if [ -e "$path" ]; then chmod -R a+rwX "$path"; fi; \
            done'
        exit "$build_status"

    - name: Save interrupted Linux Conan package checkpoint
      if: always() && !cancelled() && steps.portable-conan-cache.outputs.cache-hit != 'true' && hashFiles(format('.conan2-portable-linux-{0}/p/.f4-package-cache-ready', matrix.arch)) != '' && hashFiles(format('qt/host/build-portable-linux-{0}/.f4-conan-ready', matrix.arch)) == ''
      uses: actions/cache/save@v4
      with:
        path: ${{ env.CONAN_HOME }}/p
        key: portable-conan-packages-6.11.1-linux-${{ matrix.arch }}-glibc-2.27-gcc11-v8-video-audio-checkpoint-${{ hashFiles('qt/host/conanfile.py', 'qt/host/CMakeLists.txt', 'ci/build-portable-qt-linux.sh', 'ci/arm64_glibc_archives.py', 'ci/build-qwindowkit.sh', 'ci/build-qwindowkit.ps1', 'ci/patches/qwindowkit-default-maximize-hint.patch', 'ci/patches/libiconv-1.17-fix-error-function-declaration-without-prototype.patch', 'ci/configure-conan-remote.sh', 'ci/patch-qt-recipe.sh', 'ci/patch-qt-dependencies.py', 'ci/patch-qt-qmltools-recipe.py', 'ci/patch-bzip2-recipe.py', 'ci/patch-bzip2-recipe.sh', 'ci/patch-libgettext-recipe.py', 'ci/patch-libgettext-recipe.sh', 'ci/patch-libiconv-recipe.py', 'ci/patch-libiconv-recipe.sh', 'ci/patch-libffi-recipe.py', 'ci/patch-libffi-recipe.sh') }}-${{ github.run_id }}-${{ github.run_attempt }}

    - name: Save complete Linux Conan package graph
      if: always() && !cancelled() && steps.portable-conan-cache.outputs.cache-hit != 'true' && hashFiles(format('.conan2-portable-linux-{0}/p/.f4-package-cache-ready', matrix.arch)) != '' && hashFiles(format('qt/host/build-portable-linux-{0}/.f4-conan-ready', matrix.arch)) != ''
      uses: actions/cache/save@v4
      with:
        path: ${{ env.CONAN_HOME }}/p
        key: portable-conan-packages-6.11.1-linux-${{ matrix.arch }}-glibc-2.27-gcc11-v8-video-audio-complete-${{ hashFiles('qt/host/conanfile.py', 'qt/host/CMakeLists.txt', 'ci/build-portable-qt-linux.sh', 'ci/arm64_glibc_archives.py', 'ci/build-qwindowkit.sh', 'ci/build-qwindowkit.ps1', 'ci/patches/qwindowkit-default-maximize-hint.patch', 'ci/patches/libiconv-1.17-fix-error-function-declaration-without-prototype.patch', 'ci/configure-conan-remote.sh', 'ci/patch-qt-recipe.sh', 'ci/patch-qt-dependencies.py', 'ci/patch-qt-qmltools-recipe.py', 'ci/patch-bzip2-recipe.py', 'ci/patch-bzip2-recipe.sh', 'ci/patch-libgettext-recipe.py', 'ci/patch-libgettext-recipe.sh', 'ci/patch-libiconv-recipe.py', 'ci/patch-libiconv-recipe.sh', 'ci/patch-libffi-recipe.py', 'ci/patch-libffi-recipe.sh') }}

    - name: Package portable Linux artifact
      shell: bash
      run: |
        set -euo pipefail
        artifact_base="f4-linux-${{ matrix.arch }}"
        source_dir="dist/${artifact_base}"
        archive="${artifact_base}.tar.gz"
        tar -czf "$archive" -C "$source_dir" f4
        echo "Packaged $archive"

    - name: Upload portable Linux artifact
      uses: actions/upload-artifact@v4
      with:
        name: f4-portable-linux-${{ matrix.arch }}
        path: f4-linux-${{ matrix.arch }}.tar.gz
        if-no-files-found: error
        retention-days: 7

  portable-qt-arm64-version:
    name: Portable Windows ARM64 version smoke
    needs: [portable-qt]
    if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.publish_qt_release) }}
    runs-on: windows-11-arm
    steps:
    - name: Download portable Windows ARM64 launcher
      uses: actions/download-artifact@v8
      with:
        name: f4-portable-windows-arm64
        path: portable-version-smoke
    - name: Verify the native launcher starts and reports its release tag
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"
        Expand-Archive portable-version-smoke/f4-windows-arm64.zip portable-version-smoke/unpacked
        $versionOutput = & ./portable-version-smoke/unpacked/f4.exe --version
        if ($LASTEXITCODE -ne 0) { throw "Portable Windows ARM64 --version failed" }
        Write-Output $versionOutput
        if ($env:GITHUB_REF -like "refs/tags/v*" -and
            ($versionOutput -split '\s+')[0] -ne $env:GITHUB_REF_NAME) {
          throw "Portable Windows ARM64 reports $versionOutput instead of $env:GITHUB_REF_NAME"
        }

  # Build and vet cells are batched in groups of up to three: enough
  # parallelism to keep elapsed time down while amortizing per-job checkout
  # and toolchain setup (~50s), which cost more than the actual cross-build.
  build-batch:
    name: Build batch (${{ matrix.name }})
    needs: [should-run-full]
    if: github.event_name != 'pull_request' && needs.should-run-full.outputs.run-full == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # 7 cells, pushes/tags only; capped so this job doesn't claim every
      # runner the free-tier pool has (see the concurrency comment above
      # the jobs) -- this is the matrix a tag release competes against.
      max-parallel: 3
      # The noffi rows are the extra architectures Go can cross-compile
      # Linux for; vtui's graphical/FFI backends are unavailable there,
      # so they use its ANSI-only noffi configuration.
      # One long line on purpose: actionlint chews minutes on a folded variant.
      matrix: ${{ fromJSON('{"include":[{"name":"linux/386, linux/mips, linux/mipsle","cells":[{"goos":"linux","goarch":"386","build_tags":"noffi"},{"goos":"linux","goarch":"mips","build_tags":"noffi"},{"goos":"linux","goarch":"mipsle","build_tags":"noffi"}],"assets":["f4-linux-386","f4-linux-mips","f4-linux-mipsle"]},{"name":"linux/mips64, linux/mips64le, linux/riscv64","cells":[{"goos":"linux","goarch":"mips64","build_tags":"noffi"},{"goos":"linux","goarch":"mips64le","build_tags":"noffi"},{"goos":"linux","goarch":"riscv64","build_tags":"noffi"}],"assets":["f4-linux-mips64","f4-linux-mips64le","f4-linux-riscv64"]},{"name":"linux/loong64, linux/ppc64, linux/ppc64le","cells":[{"goos":"linux","goarch":"loong64","build_tags":"noffi"},{"goos":"linux","goarch":"ppc64","build_tags":"noffi"},{"goos":"linux","goarch":"ppc64le","build_tags":"noffi"}],"assets":["f4-linux-loong64","f4-linux-ppc64","f4-linux-ppc64le"]},{"name":"linux/arm, freebsd/amd64, freebsd/arm64","cells":[{"goos":"linux","goarch":"arm"},{"goos":"freebsd","goarch":"amd64"},{"goos":"freebsd","goarch":"arm64"}],"assets":["f4-linux-arm","f4-freebsd-amd64","f4-freebsd-arm64"]},{"name":"dragonfly/amd64, openbsd/amd64, openbsd/arm64","cells":[{"goos":"dragonfly","goarch":"amd64"},{"goos":"openbsd","goarch":"amd64"},{"goos":"openbsd","goarch":"arm64"}],"assets":["f4-dragonfly-amd64","f4-openbsd-amd64","f4-openbsd-arm64"]},{"name":"netbsd/amd64, netbsd/arm64","cells":[{"goos":"netbsd","goarch":"amd64"},{"goos":"netbsd","goarch":"arm64"}],"assets":["f4-netbsd-amd64","f4-netbsd-arm64"]},{"name":"illumos/amd64, solaris/amd64","cells":[{"goos":"illumos","goarch":"amd64"},{"goos":"solaris","goarch":"amd64"}],"assets":["f4-illumos-amd64","f4-solaris-amd64"]}]}') }}
    env:
      CGO_ENABLED: 0
      CELLS: ${{ toJSON(matrix.cells) }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26.9'
        cache-dependency-path: go.sum

    - name: Build binaries
      run: |
        set -euo pipefail
        BATCH_ROOT="$PWD/batch-output"
        mkdir -p "$BATCH_ROOT/builds"

        while IFS= read -r cell; do
          GOOS=$(jq -r '.goos' <<<"$cell")
          GOARCH=$(jq -r '.goarch' <<<"$cell")
          BUILD_TAGS=$(jq -r '.build_tags // ""' <<<"$cell")
          export GOOS GOARCH

          CELL_KEY="${GOOS}-${GOARCH}"
          BUILD_DIR="$BATCH_ROOT/builds/$CELL_KEY"
          mkdir -p "$BUILD_DIR/plugins/dummy_internal"

          EXT=""
          if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi

          # These are the architectures goffi's universal mode does not
          # cover -- it targets linux/amd64 and linux/arm64, which the build
          # job above owns. Everything here keeps the static flavor: it
          # starts anywhere and has no FFI, which is what the noffi rows
          # assume anyway.
          LDFLAGS="-s -w"
          if [ "$GOOS" = "linux" ]; then
            BUILD_TAGS="${BUILD_TAGS:+$BUILD_TAGS,}goffi_static"
          fi

          APP_LDFLAGS="$LDFLAGS"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            APP_LDFLAGS="$APP_LDFLAGS -X $VERSION_SYMBOL=$GITHUB_REF_NAME"
          fi

          # fakecgo supplies environ/__progname (and __ps_strings on NetBSD)
          # in place of the crt0 these cgo-free builds do not link. Those
          # symbols have to reach the *dynamic* symbol table, which needs
          # //go:cgo_export_dynamic, which the compiler only accepts in a
          # package built as std. Both BSDs need it; nothing else does.
          GCFLAGS=""
          case "$GOOS" in
            freebsd|netbsd)
              GCFLAGS="-gcflags=github.com/go-webgpu/goffi/internal/fakecgo=-std"
              ;;
          esac

          BUILD_TAG_ARGS=()
          if [ -n "$BUILD_TAGS" ]; then
            BUILD_TAG_ARGS=(-tags "$BUILD_TAGS")
          fi

          go build "${BUILD_TAG_ARGS[@]}" -trimpath $GCFLAGS -ldflags="$APP_LDFLAGS" -o "$BUILD_DIR/f4$EXT" ./cmd/f4 </dev/null

          if [ "$GOOS" = "windows" ]; then
            go build -trimpath -ldflags="-s -w -H windowsgui" -o "$BUILD_DIR/f4-gui$EXT" ./cmd/f4-gui-launcher </dev/null
          fi

          cp -r internal/i18n/lang internal/dialog/help "$BUILD_DIR/"
          cp f4.example.ini "$BUILD_DIR/"
          mkdir -p "$BUILD_DIR/licenses"
          cp plugins/visren/LICENSE.upstream "$BUILD_DIR/licenses/VisRen-BSD-3-Clause.txt"

          if [ "$GOOS" = "linux" ]; then
            mkdir -p "$BUILD_DIR/share/applications"
            cp packaging/linux/org.unxed.f4.desktop "$BUILD_DIR/share/applications/"
            for size in 16 24 28 30 32 36 42 48 56 64 128 256 512 1024; do
              icon_dir="$BUILD_DIR/share/icons/hicolor/${size}x${size}/apps"
              mkdir -p "$icon_dir"
              cp "internal/gui/assets/icon/generated/f4-${size}.png" \
                "$icon_dir/io.github.unxed.f4.png"
            done
            mkdir -p "$BUILD_DIR/share/icons/hicolor/scalable/apps"
            cp internal/gui/assets/icon/f4.svg \
              "$BUILD_DIR/share/icons/hicolor/scalable/apps/io.github.unxed.f4.svg"
          fi

          (
            cd plugins/dummy_internal
            go build "${BUILD_TAG_ARGS[@]}" -trimpath $GCFLAGS -ldflags="$LDFLAGS" -o "$BUILD_DIR/plugins/dummy_internal/f4-internal-dummy-plugin$EXT" . </dev/null
          )
        done < <(jq -c '.[]' <<<"$CELLS")

    - name: Smoke test the binaries
      run: |
        set -euo pipefail
        BATCH_ROOT="$PWD/batch-output"
        QEMU_READY=no

        while IFS= read -r cell; do
          GOOS=$(jq -r '.goos' <<<"$cell")
          GOARCH_CELL=$(jq -r '.goarch' <<<"$cell")
          if [ "$GOOS" != "linux" ]; then
            continue
          fi

          CELL_KEY="${GOOS}-${GOARCH_CELL}"
          BUILD_DIR="$BATCH_ROOT/builds/$CELL_KEY"

          case "$GOARCH_CELL" in
            amd64)    QEMU=x86_64 ;;
            386)      QEMU=i386 ;;
            arm64)    QEMU=aarch64 ;;
            mipsle)   QEMU=mipsel ;;
            mips64le) QEMU=mips64el ;;
            loong64)  QEMU=loongarch64 ;;
            *)        QEMU="$GOARCH_CELL" ;;
          esac

          if file "$BUILD_DIR/f4" </dev/null | grep -q 'dynamically linked'; then
            echo "::error::$GOOS/$GOARCH_CELL binary is dynamically linked; the goffi_static tag did not take effect"
            file "$BUILD_DIR/f4" </dev/null
            exit 1
          fi

          if [ "$QEMU_READY" != "yes" ]; then
            sudo apt-get update -qq </dev/null
            sudo apt-get install -y -qq qemu-user-static </dev/null
            QEMU_READY=yes
          fi
          bash scripts/check_release_version.sh "qemu-$QEMU-static" "$BUILD_DIR/f4" --version </dev/null
        done < <(jq -c '.[]' <<<"$CELLS")

    - name: Package
      run: |
        set -euo pipefail
        BATCH_ROOT="$PWD/batch-output"

        while IFS= read -r cell; do
          GOOS=$(jq -r '.goos' <<<"$cell")
          GOARCH=$(jq -r '.goarch' <<<"$cell")
          CELL_KEY="${GOOS}-${GOARCH}"
          BUILD_DIR="$BATCH_ROOT/builds/$CELL_KEY"

          ASSET="f4-$GOOS-$GOARCH"
          ARTIFACT_DIR="$BATCH_ROOT/artifacts/$ASSET"
          mkdir -p "$ARTIFACT_DIR"
          PACKAGE_DIR="$BATCH_ROOT/packages/$ASSET"
          mkdir -p "$PACKAGE_DIR/f4"
          cp -a "$BUILD_DIR"/. "$PACKAGE_DIR/f4/"

          if [ "$GOOS" = "windows" ]; then
            (cd "$PACKAGE_DIR" && zip -r "$ARTIFACT_DIR/$ASSET.zip" f4 </dev/null)
          else
            tar -czvf "$ARTIFACT_DIR/$ASSET.tar.gz" -C "$PACKAGE_DIR" f4 </dev/null
          fi
        done < <(jq -c '.[]' <<<"$CELLS")

        expected_count=$(jq 'length' <<<"$CELLS")
        packaged_count=$(find "$BATCH_ROOT/artifacts" -type f -name '*.tar.gz' | wc -l)
        if [ "$packaged_count" -ne "$expected_count" ]; then
          echo "::error::packaged $packaged_count artifacts for $expected_count batch cells"
          exit 1
        fi

    - name: Upload artifact 1
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.assets[0] }}
        path: batch-output/artifacts/${{ matrix.assets[0] }}/${{ matrix.assets[0] }}.*
        retention-days: 7

    - name: Upload artifact 2
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.assets[1] }}
        path: batch-output/artifacts/${{ matrix.assets[1] }}/${{ matrix.assets[1] }}.*
        retention-days: 7

    - name: Upload artifact 3
      if: matrix.assets[2]
      uses: actions/upload-artifact@v7
      with:
        name: ${{ matrix.assets[2] }}
        path: batch-output/artifacts/${{ matrix.assets[2] }}/${{ matrix.assets[2] }}.*
        retention-days: 7

  # f4#1178: a "lite" build for routers and other embedded/old-weak-hardware
  # targets, where Colorer/MP3/FUSE/cloud/archive/network weight is a real
  # problem. The -tags lite build tag is the single point of truth for what
  # gets left out (see internal/plughost/plugins_lite.go,
  # internal/gui/backends_lite.go, internal/editor/colorer_lite.go,
  # vfs/hostmode/hostmode_lite.go, internal/media/audio_stub.go and
  # internal/fusefs/node_unsupported.go). vtui_noebiten and vtui_nogogpu
  # always go with it: they leave vtui's Ebitengine and gogpu backends, and
  # the GPU stack behind them, out of the binary, which keeps X11 and
  # Wayland (Win32 on Windows) as the only GUI backends.
  # internal/gui/liteguard.go refuses to compile a lite build without them.
  #
  # linux/amd64 is a universal build (goffi_universal, like the regular
  # release): Wayland needs FFI to load libxkbcommon. linux/arm and
  # linux/mipsle stay static (goffi_static), matching build-batch's regular
  # cells for them; vtui has no Wayland backend there and draws with X11.
  # linux/mipsle also keeps noffi, again matching its regular cell above.
  #
  # A control binary is built alongside each lite one, with the same tags
  # minus the lite ones, purely to print the size comparison f4#1178 asks
  # for in this job's own log; it is not packaged or uploaded.
  #
  # A lite build links no archive library and no SQLite engine: archives
  # go through plugins/multiarc's console-tool wrapper, internal/unpack reads
  # f4's own release and plugin archives with the standard library, and the
  # SQLite client and the spreadsheet's SQLite format are regular-build only.
  # cmd/f4/lite_deps_test.go checks all of this from `go list -deps`.
  build-lite:
    name: Build lite (${{ matrix.name }})
    needs: [should-run-full]
    if: github.event_name != 'pull_request' && needs.should-run-full.outputs.run-full == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux/amd64
            goos: linux
            goarch: amd64
            tags: goffi_universal
            asset: f4-lite-linux-amd64
          - name: windows/amd64
            goos: windows
            goarch: amd64
            tags: ''
            asset: f4-lite-windows-amd64
          - name: linux/arm
            goos: linux
            goarch: arm
            tags: goffi_static
            asset: f4-lite-linux-arm
          - name: linux/mipsle
            goos: linux
            goarch: mipsle
            tags: noffi,goffi_static
            asset: f4-lite-linux-mipsle
    env:
      CGO_ENABLED: 0
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
      ASSET: ${{ matrix.asset }}
      MATRIX_TAGS: ${{ matrix.tags }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26.9'
        cache-dependency-path: go.sum

    - name: Build lite and control binaries
      run: |
        set -euo pipefail
        mkdir -p build/plugins/dummy_internal build-control

        GCFLAGS=""
        # See build-batch above: both BSDs need fakecgo's crt0 replacement
        # built as std; linux does not, so this never applies to this job's
        # cells today, but it keeps the same shape if a BSD cell is added.
        case "$GOOS" in
          freebsd|netbsd)
            GCFLAGS="-gcflags=github.com/go-webgpu/goffi/internal/fakecgo=-std"
            ;;
        esac

        LDFLAGS="-s -w"
        APP_LDFLAGS="$LDFLAGS"
        if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          APP_LDFLAGS="$APP_LDFLAGS -X $VERSION_SYMBOL=$GITHUB_REF_NAME"
        fi

        EXT=""
        if [ "$GOOS" = "windows" ]; then
          EXT=".exe"
        fi
        LITE_TAGS="lite,vtui_noebiten,vtui_nogogpu${MATRIX_TAGS:+,$MATRIX_TAGS}"

        go build -tags "$LITE_TAGS" -trimpath $GCFLAGS \
          -ldflags="$APP_LDFLAGS" -o build/f4$EXT ./cmd/f4
        # Same as the regular build: f4-gui.exe, the launcher, so a launch from
        # Explorer opens no console window.
        if [ "$GOOS" = "windows" ]; then
          go build -trimpath -ldflags="-s -w -H windowsgui" -o build/f4-gui$EXT ./cmd/f4-gui-launcher
        fi
        go build -tags "$MATRIX_TAGS" -trimpath $GCFLAGS \
          -ldflags="$APP_LDFLAGS" -o build-control/f4$EXT ./cmd/f4

        echo "### f4#1178 size comparison: lite vs. regular (${{ matrix.name }}, -tags ${MATRIX_TAGS:-none}, stripped)" | tee -a "$GITHUB_STEP_SUMMARY"
        LITE_SIZE=$(stat -c%s build/f4$EXT)
        CONTROL_SIZE=$(stat -c%s build-control/f4$EXT)
        printf 'lite:    %10d bytes\nregular: %10d bytes\ndelta:   %10d bytes (%.1f%% smaller)\n' \
          "$LITE_SIZE" "$CONTROL_SIZE" "$((CONTROL_SIZE - LITE_SIZE))" \
          "$(awk "BEGIN { print ($CONTROL_SIZE-$LITE_SIZE)/$CONTROL_SIZE*100 }")" \
          | tee -a "$GITHUB_STEP_SUMMARY"
        rm -rf build-control

        go build -tags "$LITE_TAGS" -trimpath $GCFLAGS \
          -ldflags="$LDFLAGS" -o build/plugins/dummy_internal/f4-internal-dummy-plugin$EXT \
          ./plugins/dummy_internal

        cp -r internal/i18n/lang internal/dialog/help build/
        cp f4.example.ini build/
        mkdir -p build/licenses
        cp plugins/visren/LICENSE.upstream build/licenses/VisRen-BSD-3-Clause.txt

    - name: Smoke test the binary
      # Same mechanism as build-batch above: qemu-user-static's binaries run a
      # foreign-architecture static executable directly, no container needed.
      # The Windows binary cannot run on this Linux runner.
      if: matrix.goos != 'windows'
      run: |
        set -euo pipefail
        if [ "${{ matrix.goarch }}" = "amd64" ]; then
          bash scripts/check_release_version.sh ./build/f4 --version </dev/null
          exit 0
        fi
        case "${{ matrix.goarch }}" in
          arm)    QEMU=arm ;;
          mipsle) QEMU=mipsel ;;
          *)      QEMU="${{ matrix.goarch }}" ;;
        esac
        sudo apt-get update -qq </dev/null
        sudo apt-get install -y -qq qemu-user-static </dev/null
        bash scripts/check_release_version.sh "qemu-$QEMU-static" ./build/f4 --version </dev/null

    # Every lite archive is a .tar.gz, the Windows one included (#1656). A
    # lite .zip ends with "-windows-amd64.zip", and f4 up to v0.1.3-alpha
    # takes the first asset by name with that suffix: f4-lite-windows-amd64.zip
    # sorts before f4-windows-amd64.zip, so the regular edition would update
    # itself into lite. No regular Windows updater looks for a .tar.gz, and
    # the lite updater unpacks one on every OS.
    - name: Package
      run: |
        set -euo pipefail
        rm -rf package
        mkdir -p package/f4
        cp -a build/. package/f4/
        tar -czvf "$ASSET.tar.gz" -C package f4

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.ASSET }}
        path: ${{ env.ASSET }}.*
        retention-days: 7

  # f4#1178 part 1 of 4 (plan: issuecomment-5851218447 on #1178): CloudFox
  # (S3/Google Drive/Yandex Disk/WebDAV, plugins/cloudfox) moved out of the
  # main module into its own module and its own subprocess RPC plugin
  # binary, so the build job above no longer builds or tests it as part of
  # ./cmd/f4. This job is that binary's own build: it exists to prove the
  # extraction actually compiles, on a desktop matrix (native plugins are not
  # distributed through the community PlugRing catalog per PLUGRING.md, so
  # the exotic build-batch tier does not apply). It intentionally runs on
  # pull requests too, unlike build-lite, since verifying this split is
  # exactly what this PR is.
  #
  # go.mod here was written by hand (this repo's policy is CI-only
  # builds/toolchain runs, never local -- see plugins/cloudfox/go.mod's own
  # comment), so `go mod tidy` runs first rather than assuming it is already
  # correct.
  #
  # f4#1178 part 2 of 4: the release job below now publishes these builds as
  # GitHub Release assets, at the path plugring-manifest.json's URL template
  # expects. NOTE: this matrix only has 4 cells (windows/arm64 and
  # darwin/arm64 are missing) while the main `build` job above targets 6; a
  # user on either missing platform gets a 404 from the manifest URL today.
  # Widening this matrix is left to a later part -- it changes CI job budget
  # (see LUNOBOT.md), which this part deliberately did not touch.
  #
  # f4#1178 part 3 of 4: "not distributed through the community PlugRing
  # catalog" above is still true of plugring/index.yaml specifically -- that
  # is the file PLUGRING.md's policy governs, and a native per-platform
  # binary still does not belong in it. It is no longer the whole story:
  # internal/plughost/plugring_firstparty.go now offers this same binary
  # through a separate, explicitly first-party PlugRing entry that the
  # community distribution policy does not apply to (same repository, same
  # review, same CI -- not a third party's unreviewable binary).
  build-cloudfox-plugin:
    name: Build cloudfox-plugin (${{ matrix.name }})
    needs: [should-run-full]
    if: needs.should-run-full.outputs.run-full == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux/amd64
            goos: linux
            goarch: amd64
          - name: linux/arm64
            goos: linux
            goarch: arm64
          - name: windows/amd64
            goos: windows
            goarch: amd64
          - name: darwin/amd64
            goos: darwin
            goarch: amd64
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    defaults:
      run:
        working-directory: plugins/cloudfox

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26.9'
        cache-dependency-path: plugins/cloudfox/go.sum

    # go mod tidy asks sum.golang.org and proxy.golang.org for every module of a
    # plugin, and a transient answer from either ("stream error ... INTERNAL_ERROR
    # ... reading https://sum.golang.org/tile/...") turned a whole job red on
    # main and on trains (30-09-2026, main eb17c3a0a and train unxed/f4#1707).
    # The go.mod files of these modules are only settled by this step, so it is
    # retried instead of the job.
    - name: go mod tidy
      shell: bash
      run: |
        for attempt in 1 2 3 4; do
          go mod tidy && exit 0
          echo "go mod tidy failed (attempt $attempt of 4); retrying"
          sleep $((attempt * 20))
        done
        exit 1

    - name: Build cloudfox-plugin
      run: go build -trimpath -o cloudfox-plugin ./cmd/cloudfox-plugin

    - name: Run go vet (host GOOS/GOARCH only)
      if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
      run: go vet ./...

    # f4#1178 part 2 of 4: package into the same {os}-{arch} archive name
    # plugring-manifest.json's URL template expects, for two reasons. First,
    # the `release` job below downloads every artifact from this run with
    # `merge-multiple: true`; four matrix cells all producing a file literally
    # named `cloudfox-plugin` would collide into one arbitrary binary instead
    # of publishing four platform assets. Second, the release asset name has
    # to be predictable for the manifest URL to resolve at all.
    #
    # .tgz, not .tar.gz (#1656): the updater of every f4 released before
    # that fix takes the first asset whose name ends with
    # "-<os>-<arch>.tar.gz", and GitHub lists assets by name, so
    # cloudfox-plugin-linux-amd64.tar.gz would be installed in place of
    # f4-linux-amd64.tar.gz. The PlugRing installer reads both extensions.
    - name: Package cloudfox-plugin
      run: tar -czvf "cloudfox-plugin-$GOOS-$GOARCH.tgz" cloudfox-plugin

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: cloudfox-plugin-${{ matrix.goos }}-${{ matrix.goarch }}
        path: plugins/cloudfox/cloudfox-plugin-${{ matrix.goos }}-${{ matrix.goarch }}.tgz
        retention-days: 7

  # f4#1178 Android plugin, part 1 of 4 (mirrors build-cloudfox-plugin above,
  # per the owner's decision at
  # https://github.com/unxed/f4/issues/1178#issuecomment-5851392645 to give
  # Android the same "download this plugin on demand" treatment as cloud
  # storage/iOS). plugins/android (ADB device browsing over shell-v2/FISH+
  # or ADB Sync) no longer links into f4 at all, in either the full or the
  # lite build; this job builds its own extracted module as its own binary
  # to prove the extraction compiles, on the same desktop matrix
  # build-cloudfox-plugin uses (native plugins are not distributed through
  # the community PlugRing catalog per PLUGRING.md, so the exotic
  # build-batch tier does not apply here either).
  #
  # Unlike CloudFox, plugins/android has no unique heavy dependency of its
  # own to shed -- see plugins/android/rpc_plugin.go's package comment for
  # why this job still passes -tags lite: plugins/netfox (which
  # plugins/android reuses for FISH+) gates its FTP/SFTP/SSH-dialer/Pageant
  # files with //go:build lite/!lite rather than splitting them into a
  # separate module, so a plain `go build` here would otherwise link all of
  # that in even though plugins/android's own code never references it.
  #
  # go.mod here was written by hand, for the same reason
  # plugins/cloudfox/go.mod's own comment gives (this repo's policy is
  # CI-only builds/toolchain runs, never local): the `go mod tidy` step
  # below is the actual source of truth for it and go.sum.
  #
  # f4#1178 part 2 of 4: the release job below now publishes these builds as
  # GitHub Release assets too, at the path plugring-manifest.json's URL
  # template expects (mirrors build-cloudfox-plugin's own part 2). Same
  # caveat as that job: this matrix only has 4 of the 6 desktop cells (no
  # windows/arm64, darwin/arm64), so those two platforms still 404 on the
  # manifest URL; widening it is left to a later part, same reasoning as
  # cloudfox's own part 2 (CI job budget, see LUNOBOT.md).
  #
  # An install path through PlugRing (part 3) and a lite/full-build menu
  # entry (part 4) are still follow-up, exactly as they were for CloudFox.
  build-android-plugin:
    name: Build android-plugin (${{ matrix.name }})
    needs: [should-run-full]
    if: needs.should-run-full.outputs.run-full == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux/amd64
            goos: linux
            goarch: amd64
          - name: linux/arm64
            goos: linux
            goarch: arm64
          - name: windows/amd64
            goos: windows
            goarch: amd64
          - name: darwin/amd64
            goos: darwin
            goarch: amd64
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    defaults:
      run:
        working-directory: plugins/android

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26.9'
        cache-dependency-path: plugins/android/go.sum

    # go.sum entries don't affect the compiled binary -- that's controlled
    # by `-tags lite` on the actual build step below -- so a plain tidy
    # here is fine even though it resolves plugins/netfox's full (non-lite)
    # file set too; `go mod tidy` has no `-tags` flag to scope that (it
    # fails outright: "flag provided but not defined: -tags").
    # go mod tidy asks sum.golang.org and proxy.golang.org for every module of a
    # plugin, and a transient answer from either ("stream error ... INTERNAL_ERROR
    # ... reading https://sum.golang.org/tile/...") turned a whole job red on
    # main and on trains (30-09-2026, main eb17c3a0a and train unxed/f4#1707).
    # The go.mod files of these modules are only settled by this step, so it is
    # retried instead of the job.
    - name: go mod tidy
      shell: bash
      run: |
        for attempt in 1 2 3 4; do
          go mod tidy && exit 0
          echo "go mod tidy failed (attempt $attempt of 4); retrying"
          sleep $((attempt * 20))
        done
        exit 1

    - name: Build android-plugin
      run: go build -trimpath -tags lite -o android-plugin ./cmd/android-plugin

    - name: Run go vet (host GOOS/GOARCH only)
      if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
      run: go vet -tags lite ./...

    # f4#1178 part 2 of 4: package into the same {os}-{arch} archive name
    # plugring-manifest.json's URL template expects, for the same two reasons
    # as build-cloudfox-plugin's own Package step: the `release`/`nightly`
    # jobs below sweep every workflow artifact into one directory with
    # `merge-multiple: true`, so four matrix cells all producing a file
    # literally named `android-plugin` would collide into one arbitrary
    # binary instead of publishing four platform assets; and the release
    # asset name has to be predictable for the manifest URL to resolve.
    # .tgz, not .tar.gz, so that no updater already released takes it for
    # f4's own archive: see the cloudfox-plugin package step (#1656).
    - name: Package android-plugin
      run: tar -czvf "android-plugin-$GOOS-$GOARCH.tgz" android-plugin

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: android-plugin-${{ matrix.goos }}-${{ matrix.goarch }}
        path: plugins/android/android-plugin-${{ matrix.goos }}-${{ matrix.goarch }}.tgz
        retention-days: 7

  # f4#1178 iOS plugin, part 1 of 4 (plan: issuecomment-5851326218 on #1178,
  # decided at issuecomment-5851392645): plugins/ios (go-ios and its fully
  # separate userspace networking dependency chain -- gvisor.dev/gvisor,
  # quic-go, vishvananda/netlink+netns, songgao/water, miekg/dns,
  # grandcat/zeroconf, howett.net/plist, go.mozilla.org/pkcs7,
  # software.sslmate.com/src/go-pkcs12, golang.zx2c4.com/wintun) moved out of
  # the main module into its own module and its own subprocess RPC plugin
  # binary, so the build job above no longer builds or tests it as part of
  # ./cmd/f4. This job is that binary's own build: it exists to prove the
  # extraction actually compiles, on the same desktop matrix
  # build-cloudfox-plugin/build-android-plugin use (native plugins are not
  # distributed through the community PlugRing catalog per PLUGRING.md, so
  # the exotic build-batch tier does not apply). USB/usbmuxd access is a
  # desktop-only concern anyway (see plugins/ios/README.md's Requirements
  # section), so there is no separate mobile/embedded cell to add here.
  #
  # Like plugins/cloudfox/go.mod, plugins/ios/go.mod was written by hand
  # (this repo's policy is CI-only builds/toolchain runs, never local), so
  # `go mod tidy` runs first rather than assuming it is already correct.
  #
  # f4#1178 part 2 of 4: the release job below now publishes these builds as
  # GitHub Release assets, at the path plugring-manifest.json's URL template
  # expects. NOTE: this matrix only has 4 cells (windows/arm64 and
  # darwin/arm64 are missing) while the main `build` job above targets 6; a
  # user on either missing platform gets a 404 from the manifest URL today.
  # Widening this matrix is left to a later part -- it changes CI job budget
  # (see LUNOBOT.md), which this part deliberately did not touch. This
  # mirrors build-cloudfox-plugin's own part 2 change exactly, including its
  # 4-cell gap.
  build-ios-plugin:
    name: Build ios-plugin (${{ matrix.name }})
    needs: [should-run-full]
    if: needs.should-run-full.outputs.run-full == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: linux/amd64
            goos: linux
            goarch: amd64
          - name: linux/arm64
            goos: linux
            goarch: arm64
          - name: windows/amd64
            goos: windows
            goarch: amd64
          - name: darwin/amd64
            goos: darwin
            goarch: amd64
    env:
      GOOS: ${{ matrix.goos }}
      GOARCH: ${{ matrix.goarch }}
    defaults:
      run:
        working-directory: plugins/ios

    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26.9'
        cache-dependency-path: plugins/ios/go.sum

    # go mod tidy asks sum.golang.org and proxy.golang.org for every module of a
    # plugin, and a transient answer from either ("stream error ... INTERNAL_ERROR
    # ... reading https://sum.golang.org/tile/...") turned a whole job red on
    # main and on trains (30-09-2026, main eb17c3a0a and train unxed/f4#1707).
    # The go.mod files of these modules are only settled by this step, so it is
    # retried instead of the job.
    - name: go mod tidy
      shell: bash
      run: |
        for attempt in 1 2 3 4; do
          go mod tidy && exit 0
          echo "go mod tidy failed (attempt $attempt of 4); retrying"
          sleep $((attempt * 20))
        done
        exit 1

    - name: Build ios-plugin
      run: go build -trimpath -o ios-plugin ./cmd/ios-plugin

    - name: Run go vet (host GOOS/GOARCH only)
      if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
      run: go vet ./...

    # f4#1178 part 2 of 4: package into the same {os}-{arch} archive name
    # plugring-manifest.json's URL template expects, for two reasons. First,
    # the `release` job below downloads every artifact from this run with
    # `merge-multiple: true`; four matrix cells all producing a file literally
    # named `ios-plugin` would collide into one arbitrary binary instead of
    # publishing four platform assets. Second, the release asset name has to
    # be predictable for the manifest URL to resolve at all.
    # .tgz, not .tar.gz, so that no updater already released takes it for
    # f4's own archive: see the cloudfox-plugin package step (#1656).
    - name: Package ios-plugin
      run: tar -czvf "ios-plugin-$GOOS-$GOARCH.tgz" ios-plugin

    - name: Upload Artifact
      uses: actions/upload-artifact@v7
      with:
        name: ios-plugin-${{ matrix.goos }}-${{ matrix.goarch }}
        path: plugins/ios/ios-plugin-${{ matrix.goos }}-${{ matrix.goarch }}.tgz
        retention-days: 7

  # Android for f4 means Termux (#882). A plain CGO_ENABLED=0 cross-build
  # starts from a shell but dies the moment it re-execs itself for the
  # daemon: untrusted_app on current Android refuses to exec such a file,
  # and the lookup of Termux's own libraries never happens. What works on
  # the device is the NDK build: cgo, Bionic's loader, and a RUNPATH
  # pointing at $PREFIX/lib so the binary binds against Termux's libc the
  # way every other Termux package does. The runner image ships the NDK
  # (ANDROID_NDK_ROOT), so nothing has to be installed. API level 24 is
  # Termux's floor.
  #
  # Cells: arm64, which covers nearly every active Android device, and
  # 32-bit armv7 (#1380). The asset is named after GOARCH because that is
  # what the in-app updater asks for (internal/update assetSuffixes:
  # android/arm -> -termux-arm.tar.gz); deb_arch is Termux's own name for
  # the architecture, which is what apt in Termux compares against. GOARM=7
  # is what Termux itself builds its Go packages with on arm. x86_64 can be
  # added as another cell on request.
  build-termux:
    name: Build (termux/${{ matrix.goarch }})
    needs: [should-run-full]
    if: needs.should-run-full.outputs.run-full == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - goarch: arm64
            goarm: ''
            cc: aarch64-linux-android24-clang
            deb_arch: aarch64
            elf_machine: AArch64
          - goarch: arm
            goarm: '7'
            cc: armv7a-linux-androideabi24-clang
            deb_arch: arm
            elf_machine: ARM
    env:
      GOOS: android
      GOARCH: ${{ matrix.goarch }}
      GOARM: ${{ matrix.goarm }}
      CGO_ENABLED: 1
      TERMUX_PREFIX: /data/data/com.termux/files/usr
      ASSET: f4-termux-${{ matrix.goarch }}

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26.9'
        cache-dependency-path: go.sum

    - name: Compute build impact
      id: affected
      uses: ./.github/actions/affected-packages

    - name: Build binary
      if: steps.affected.outputs.build == 'yes'
      run: |
        set -euo pipefail
        NDK_BIN="$ANDROID_NDK_ROOT/toolchains/llvm/prebuilt/linux-x86_64/bin"
        export CC="$NDK_BIN/${{ matrix.cc }}"
        "$CC" --version | head -1

        APP_LDFLAGS="-s -w -r $TERMUX_PREFIX/lib"
        if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          APP_LDFLAGS="$APP_LDFLAGS -X $VERSION_SYMBOL=$GITHUB_REF_NAME"
        fi

        mkdir -p build
        go build -buildmode=pie -trimpath -ldflags="$APP_LDFLAGS" -o build/f4 ./cmd/f4
        cp -r internal/i18n/lang internal/dialog/help build/
        cp f4.example.ini build/
        mkdir -p build/licenses
        cp plugins/visren/LICENSE.upstream build/licenses/VisRen-BSD-3-Clause.txt

    # The binary cannot run here (it needs Bionic's loader), so assert the
    # two things that separate it from the useless pure-Go build instead:
    # it is dynamically linked and it names $PREFIX/lib as its RUNPATH.
    # Also that it is built for the cell's machine, so a wrong CC or GOARCH
    # in the matrix cannot publish one architecture under another's name.
    - name: Check the ELF contract
      if: steps.affected.outputs.build == 'yes'
      env:
        ELF_MACHINE: ${{ matrix.elf_machine }}
      run: |
        set -euo pipefail
        file build/f4
        readelf -h build/f4 | tee /tmp/hdr
        grep -Eq "^[[:space:]]*Machine:[[:space:]]+$ELF_MACHINE\$" /tmp/hdr
        readelf -d build/f4 | tee /tmp/dyn
        grep -q 'NEEDED' /tmp/dyn
        grep -q "RUNPATH.*$TERMUX_PREFIX/lib" /tmp/dyn

    # Two artifacts. The tarball mirrors the other platforms and is what
    # the in-app updater picks up (internal/update assetSuffixes maps GOOS=android
    # to the termux name). The .deb is the
    # native way to install in Termux: `pkg install ./f4-termux-arm64.deb`
    # (./f4-termux-arm.deb on armv7).
    # Termux runs with no chroot, so the paths inside are absolute
    # $PREFIX paths. Assets live in share/f4 next to the real binary and
    # bin/f4 is a symlink into it, which is how f4 finds help/ next to
    # os.Executable() without any lookup changes.
    - name: Package
      if: steps.affected.outputs.build == 'yes'
      env:
        DEB_ARCH: ${{ matrix.deb_arch }}
      run: |
        set -euo pipefail
        rm -rf package
        mkdir -p package/f4
        cp -a build/. package/f4/
        tar -czvf "$ASSET.tar.gz" -C package f4

        VERSION="0.0.${GITHUB_RUN_NUMBER}"
        if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          VERSION="${GITHUB_REF_NAME#v}"
        fi

        DEB=deb
        SHARE="$DEB$TERMUX_PREFIX/share/f4"
        mkdir -p "$DEB/DEBIAN" "$DEB$TERMUX_PREFIX/bin" "$SHARE"
        cp -r build/. "$SHARE/"
        ln -s ../share/f4/f4 "$DEB$TERMUX_PREFIX/bin/f4"
        cat > "$DEB/DEBIAN/control" <<EOF
        Package: f4
        Version: $VERSION
        Architecture: $DEB_ARCH
        Maintainer: unxed <https://github.com/unxed/f4>
        Homepage: https://github.com/unxed/f4
        Description: efficient and cozy two-panel file manager
        EOF
        # -Zxz: apt in Termux reads only control.tar{.zst,.lz4,.xz,.lzma,} and
        # rejects the zstd member dpkg-deb writes by default with "Could not
        # read meta data", which leaves `pkg install ./file.deb` broken. Only
        # `dpkg -i` takes the default.
        dpkg-deb -Zxz --build --root-owner-group "$DEB" "$ASSET.deb"
        dpkg-deb --info "$ASSET.deb"
        dpkg-deb --contents "$ASSET.deb"

    - name: Upload Artifact
      if: steps.affected.outputs.build == 'yes'
      uses: actions/upload-artifact@v7
      with:
        name: ${{ env.ASSET }}
        path: ${{ env.ASSET }}.*
        retention-days: 7

  # Эта джоба собирает Windows-бинарник тулчейном thongtech/go-legacy-win7,
  # чтобы f4 можно было запускать на Windows 7/8/8.1 (см. issue #514).
  #
  # Нужен релиз не старше go-legacy-win7-1.26.8-1: в более ранних сборках
  # не хватало части API стандартной библиотеки Go той же версии.
  # В 1.26.6-1 не было методов Or/And у типизированных
  # атомиков sync/atomic (thongtech/go-legacy-win7#13; без них не
  # собираются github.com/gogpu/gg и github.com/ncruces/go-sqlite3), а до
  # 1.26.7-1 включительно не было os.Root.RemoveAll (Go 1.25), который
  # использует github.com/unxed/zip начиная с v0.1.133. Раньше Or/And
  # дописывались прямо в GOROOT отдельным шагом; с 1.26.8-1 оба API на
  # месте (релиз собран на переработанной серии патчей: API апстрима
  # сохраняется, фоллбэки для Windows 7 — внутри), а тот шаг давал бы
  # ошибку "method already declared", поэтому он удалён.
  build-win7:
    name: Build (windows7/amd64)
    needs: [should-run-full]
    if: needs.should-run-full.outputs.run-full == 'true'
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
      GOOS: windows
      GOARCH: amd64

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26.9'
        cache-dependency-path: go.sum

    - name: Compute build impact
      id: affected
      uses: ./.github/actions/affected-packages

    - name: Download go-legacy-win7 toolchain
      if: steps.affected.outputs.build == 'yes'
      run: |
        set -euo pipefail
        curl -fL --retry 5 --retry-delay 10 --retry-all-errors \
          -o go-legacy-win7.tar.gz \
          https://github.com/thongtech/go-legacy-win7/releases/download/v1.26.8-1/go-legacy-win7-1.26.8-1.linux_amd64.tar.gz
        echo "0e8f70bc5c2f7a31ace600092453717ced935358e20c4f2cc9305309b0e283ee  go-legacy-win7.tar.gz" | sha256sum -c -
        mkdir -p "$HOME/go-legacy-win7"
        tar -xzf go-legacy-win7.tar.gz -C "$HOME/go-legacy-win7"
        echo "GOROOT=$HOME/go-legacy-win7/go-legacy-win7" >> "$GITHUB_ENV"
        echo "$HOME/go-legacy-win7/go-legacy-win7/bin" >> "$GITHUB_PATH"

    - name: Restore missing sync/atomic Or/And methods when needed
      if: steps.affected.outputs.build == 'yes'
      run: |
        if grep -Fq 'func (x *Int32) Or' "$GOROOT/src/sync/atomic/type.go"; then
          echo "go-legacy-win7 already provides typed atomic Or/And methods"
          exit 0
        fi
        cat > "$GOROOT/src/sync/atomic/or_and_win7compat.go" <<'EOF'
        // This file restores the Or/And methods on typed atomics (added
        // upstream in Go 1.23, see https://go.dev/issue/61395) that are
        // missing from the go-legacy-win7-1.26.6-1 toolchain despite it
        // being based on Go 1.26.6. See
        // https://github.com/thongtech/go-legacy-win7/issues/13.
        // Remove this file once that's fixed upstream.
        package atomic

        func (x *Int32) Or(mask int32) (old int32) {
            for {
                old = x.Load()
                if x.CompareAndSwap(old, old|mask) {
                    return old
                }
            }
        }

        func (x *Int32) And(mask int32) (old int32) {
            for {
                old = x.Load()
                if x.CompareAndSwap(old, old&mask) {
                    return old
                }
            }
        }

        func (x *Int64) Or(mask int64) (old int64) {
            for {
                old = x.Load()
                if x.CompareAndSwap(old, old|mask) {
                    return old
                }
            }
        }

        func (x *Int64) And(mask int64) (old int64) {
            for {
                old = x.Load()
                if x.CompareAndSwap(old, old&mask) {
                    return old
                }
            }
        }

        func (x *Uint32) Or(mask uint32) (old uint32) {
            for {
                old = x.Load()
                if x.CompareAndSwap(old, old|mask) {
                    return old
                }
            }
        }

        func (x *Uint32) And(mask uint32) (old uint32) {
            for {
                old = x.Load()
                if x.CompareAndSwap(old, old&mask) {
                    return old
                }
            }
        }

        func (x *Uint64) Or(mask uint64) (old uint64) {
            for {
                old = x.Load()
                if x.CompareAndSwap(old, old|mask) {
                    return old
                }
            }
        }

        func (x *Uint64) And(mask uint64) (old uint64) {
            for {
                old = x.Load()
                if x.CompareAndSwap(old, old&mask) {
                    return old
                }
            }
        }

        func (x *Uintptr) Or(mask uintptr) (old uintptr) {
            for {
                old = x.Load()
                if x.CompareAndSwap(old, old|mask) {
                    return old
                }
            }
        }

        func (x *Uintptr) And(mask uintptr) (old uintptr) {
            for {
                old = x.Load()
                if x.CompareAndSwap(old, old&mask) {
                    return old
                }
            }
        }
        EOF

    - name: Build binaries
      if: steps.affected.outputs.build == 'yes'
      run: |
        mkdir -p build/plugins/dummy_internal
        LDFLAGS="-s -w"
        APP_LDFLAGS="$LDFLAGS"
        if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          APP_LDFLAGS="$APP_LDFLAGS -X $VERSION_SYMBOL=$GITHUB_REF_NAME"
        fi

        # -tags win7 tells the updater it is this build, so it updates to
        # f4-windows7-amd64.zip. Without it, it asked for the regular Windows
        # archive like any windows/amd64 f4, and installed a build that
        # does not start on Windows 7/8/8.1 (#1656). The release check reads
        # the tag back from the archive.
        go build -tags win7 -trimpath -ldflags="$APP_LDFLAGS" -o build/f4.exe ./cmd/f4
        # f4-gui.exe: the launcher, same as in the main matrix (f4#1567).
        go build -trimpath -ldflags="-s -w -H windowsgui" -o build/f4-gui.exe ./cmd/f4-gui-launcher

        cp -r internal/i18n/lang internal/dialog/help build/
        cp f4.example.ini build/
        mkdir -p build/licenses
        cp plugins/visren/LICENSE.upstream build/licenses/VisRen-BSD-3-Clause.txt

        cd plugins/dummy_internal
        go build -trimpath -ldflags="$LDFLAGS" -o ../../build/plugins/dummy_internal/f4-internal-dummy-plugin.exe .

    - name: Package
      if: steps.affected.outputs.build == 'yes'
      run: |
        set -euo pipefail
        rm -rf package
        mkdir -p package/f4
        cp -a build/. package/f4/
        (cd package && zip -r ../f4-windows7-amd64.zip f4)

    - name: Upload Artifact
      if: steps.affected.outputs.build == 'yes'
      uses: actions/upload-artifact@v7
      with:
        name: f4-windows7-amd64
        path: f4-windows7-amd64.zip
        retention-days: 7

  # Windows before 10 cannot load a binary built by any Go since 1.21: the
  # runtime imports six kernel32 entry points that are not there, starting with
  # WerSetFlags, and the loader refuses the process before main runs. This job
  # builds the one artifact that does run there -- windows/386, stock toolchain,
  # with the go2xp shim linked in and the import table repointed at its
  # polyfills afterwards (github.com/unxed/go2xp).
  #
  # One artifact serves Windows XP SP3 and ReactOS, built with the XP profile.
  # The header is what makes that possible: XP refuses an image whose OS or
  # subsystem version is above 5.1 ("not a valid Win32 application", issue
  # #897), and ReactOS, which reports 5.2, loads anything up to that. The
  # earlier ReactOS profile declared 5.2 and so could not start on XP at all.
  #
  # The cost falls on ReactOS and is small: the XP profile redirects ReOpenFile,
  # FindFirstStreamW and FindNextStreamW to failing stubs, and ReactOS has real
  # ones. f4 calls none of them itself; Go's standard library reaches ReOpenFile
  # only to chmod a read-only file inside an os.Root, and NTFS streams do not
  # exist on the FAT volumes ReactOS installs onto. The ReactOS result was
  # measured with the ReactOS profile (f4 draws its panels, copies, views, edits
  # and runs commands there); this artifact has not been run on ReactOS or on XP
  # yet. XP needs a machine to sign it off (docs/WINE.md, legacy Windows).
  #
  # go2xp is pinned by commit: it decides which imports get redirected, and a
  # silent change there would change the artifact without changing this tree.
  # -ldflags keeps symbols (-w, no -s) because "go2xp audit" reads the proc*
  # symbol names to report what the target lacks; the audit is the gate that
  # fails this job if an absent export is neither polyfilled nor accepted by
  # the profile.
  #
  # release and nightly must list this job in needs. They download every
  # artifact of the run with no filter, so a job missing from needs got into
  # the release only when it happened to finish before they started -- and the
  # README links f4-legacy-windows-386.zip as the ReactOS download.
  build-reactos:
    name: Build (legacy windows/386)
    needs: [should-run-full]
    if: needs.should-run-full.outputs.run-full == 'true'
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
      GOOS: windows
      GOARCH: 386
      GO2XP_REF: cd906f3002233bda80e91dd1ad0728aa6ec8f1d6

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26.9'
        cache-dependency-path: go.sum

    - name: Compute build impact
      id: affected
      uses: ./.github/actions/affected-packages

    - name: Check out go2xp
      if: steps.affected.outputs.build == 'yes'
      uses: actions/checkout@v7
      with:
        repository: unxed/go2xp
        ref: ${{ env.GO2XP_REF }}
        path: go2xp-src

    - name: Move go2xp outside the f4 checkout
      if: steps.affected.outputs.build == 'yes'
      run: mv go2xp-src "$RUNNER_TEMP/go2xp-src"

    - name: Generate the windows/386 icon resource
      if: steps.affected.outputs.build == 'yes'
      run: |
        set -euo pipefail
        # tools/icons (see its go:generate directive in cmd/f4/main.go) only
        # calls go-winres for --arch amd64,arm64, because those are the only
        # GOARCH values the regular Windows build matrix uses, so no
        # rsrc_windows_386.syso is checked in and this job's go build linked
        # no icon at all (f4#897, item 1 of 3). A .syso is picked up by the
        # linker automatically as long as it sits next to main.go, exactly
        # like the checked-in amd64/arm64 ones, so generate it here instead
        # of checking in another binary asset; same tool, pinned version and
        # icon file as tools/icons/main.go's makeWindowsResources.
        # GOOS/GOARCH are job-level env for cross-compiling f4.exe itself;
        # go-winres has to run on the runner, not on the (386) target.
        (cd cmd/f4 && env -u GOOS -u GOARCH go run github.com/tc-hib/go-winres@v0.3.3 simply \
          --arch 386 \
          --out rsrc \
          --manifest gui \
          --product-name f4 \
          --file-description "f4 file manager" \
          --original-filename f4.exe \
          --icon ../../internal/gui/assets/icon/generated/f4.ico)
        ls -l cmd/f4/rsrc_windows_386.syso

    - name: Build binaries
      if: steps.affected.outputs.build == 'yes'
      run: |
        set -euo pipefail
        # A throwaway modfile keeps f4's own go.mod free of the dependency:
        # every other build target has no use for it.
        cp go.mod /tmp/f4-go2xp.mod
        cp go.sum /tmp/f4-go2xp.sum
        go mod edit -modfile=/tmp/f4-go2xp.mod \
          -require=github.com/unxed/go2xp@v0.0.0 \
          -replace=github.com/unxed/go2xp="$RUNNER_TEMP/go2xp-src"

        mkdir -p build
        LDFLAGS="-w"
        APP_LDFLAGS="$LDFLAGS"
        if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          APP_LDFLAGS="$APP_LDFLAGS -X $VERSION_SYMBOL=$GITHUB_REF_NAME"
        fi
        go build -trimpath -ldflags="$APP_LDFLAGS" -tags=go2xp \
          -modfile=/tmp/f4-go2xp.mod -o build/f4.exe ./cmd/f4

        cp -r internal/i18n/lang internal/dialog/help build/
        cp f4.example.ini build/

    - name: Verify clean embedded revision
      if: steps.affected.outputs.build == 'yes'
      run: |
        set -euo pipefail
        metadata="$(go version -m build/f4.exe)"
        printf '%s\n' "$metadata"
        if grep -Eq 'vcs\.modified(=|[[:space:]])true' <<<"$metadata"; then
          echo 'go build embedded vcs.modified=true' >&2
          exit 1
        fi

    - name: Patch the import table and audit it
      if: steps.affected.outputs.build == 'yes'
      run: |
        set -euo pipefail
        # The patcher runs on the runner, not on the target.
        go2xp_dir="$RUNNER_TEMP/go2xp-src"
        (cd "$go2xp_dir" && env -u GOOS -u GOARCH go build -o /tmp/go2xp ./cmd/go2xp)
        profile="$go2xp_dir/profiles/xp.json"
        /tmp/go2xp patch -profile "$profile" build/f4.exe build/f4-legacy.exe \
          | tee build/go2xp-patch.txt
        /tmp/go2xp verify -profile "$profile" build/f4-legacy.exe
        # The version XP checks is in the PE header, and a profile that
        # declares more than 5.1 makes the artifact unstartable there.
        python3 - build/f4-legacy.exe <<'EOF'
        import struct, sys
        d = open(sys.argv[1], 'rb').read()
        opt = struct.unpack_from('<I', d, 0x3c)[0] + 24
        os_v = struct.unpack_from('<HH', d, opt + 40)
        ss_v = struct.unpack_from('<HH', d, opt + 48)
        print('PE header: OS %d.%d, subsystem %d.%d' % (os_v + ss_v))
        if os_v > (5, 1) or ss_v > (5, 1):
            sys.exit('a header above 5.1 is refused by Windows XP SP3 (not a valid Win32 application)')
        EOF
        /tmp/go2xp audit -profile "$profile" build/f4-legacy.exe \
          | tee build/go2xp-audit.txt
        (cd "$go2xp_dir" && git rev-parse HEAD) > build/go2xp-commit.txt
        rm build/f4.exe

    - name: Package
      if: steps.affected.outputs.build == 'yes'
      run: |
        set -euo pipefail
        rm -rf package
        mkdir -p package/f4
        cp -a build/. package/f4/
        (cd package && zip -r ../f4-legacy-windows-386.zip f4)

    - name: Upload Artifact
      if: steps.affected.outputs.build == 'yes'
      uses: actions/upload-artifact@v7
      with:
        name: f4-legacy-windows-386
        path: f4-legacy-windows-386.zip
        retention-days: 7

  # go vet in the quality job below only ever sees the linux build of the tree,
  # which leaves the 44 windows-only and 8 darwin-only files here unexamined by
  # any of its analyzers — printf, copylocks, lostcancel, loopclosure and two
  # dozen more. The build matrix already covers nine GOOS values, so vet them.
  #
  # One cell per GOOS, plus one 32-bit cell. Only winepath_{windows,other}.go are
  # selected by GOARCH, and windows/amd64 and any non-windows target between them
  # cover both sides, so a second 64-bit arch would vet identical files. Word
  # size is the exception: the shift analyzer sizes types through the target's
  # TypesSizes, so a shift that is fine against a 64-bit int is a finding against
  # a 32-bit one. linux/arm is the matrix's 32-bit cell that builds without the
  # noffi tag. linux/amd64 is absent because the quality job vets it with the
  # full analyzer set.
  #
  # unsafeptr is the one analyzer that cannot come along. Every one of these
  # platforms converts a uintptr handed back by a syscall wrapper into a pointer
  # — the view MapViewOfFile mapped, strings Wine allocated on the process heap,
  # a pseudoconsole HANDLE, a buffer owned by an NSString — and the analyzer
  # cannot tell foreign memory from Go's. Those wrappers return uintptr by
  # signature, and vet accepts a uintptr-to-pointer conversion only for reflect
  # headers, reflect.Value.Pointer and pointer arithmetic, so moving the
  # conversion elsewhere only moves the diagnostic. The linux run keeps the full
  # set, unsafeptr included, so a genuine round trip in portable code still
  # fails the build.
  #
  # Cell notes, in full-matrix cell order:
  # - linux/arm carries goffi_static: the cross-built Linux artifacts that
  #   universal mode does not cover are built with it, so vet the files
  #   those builds actually compile -- the stubs, not the dlopen wrappers.
  #   The only arm32 compile anywhere in a PR run, so it is the one cell
  #   PRs keep.
  # - linux/amd64 carries goffi_universal, which is what the released
  #   amd64 and arm64 binaries are built with: it compiles the real dlopen
  #   wrappers and the re-exec bridge instead of those stubs, and nothing
  #   else vets that code on Linux. It needs no gcflags, unlike the
  #   goffi_musl cell it replaces (and unlike freebsd's fakecgo shim below).
  # Pull requests run only the linux/arm cell: every other target is
  # already compiled in the same PR run by its build and test jobs (and
  # go test runs vet's high-confidence checks natively), or -- for the
  # BSDs/illumos/solaris -- is exotic enough to check on pushes and tags,
  # like their builds. The full batched matrix runs everywhere else.
  vet:
    name: Vet (${{ matrix.name }})
    needs: [should-run-full]
    if: needs.should-run-full.outputs.run-full == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Up to 4 cells on pushes/tags (1 on pull requests already); capped
      # so this job doesn't claim every runner the free-tier pool has (see
      # the concurrency comment above the jobs).
      max-parallel: 2
      # One long line on purpose: actionlint chews minutes on a folded variant.
      matrix: ${{ github.event_name == 'pull_request' && fromJSON('{"include":[{"name":"linux/arm","cells":[{"target":"linux/arm","tags":"goffi_static"}]}]}') || fromJSON('{"include":[{"name":"windows/amd64, linux/arm, linux/amd64","cells":[{"target":"windows/amd64"},{"target":"linux/arm","tags":"goffi_static"},{"target":"linux/amd64","tags":"goffi_universal"}]},{"name":"darwin/arm64, freebsd/amd64, dragonfly/amd64","cells":[{"target":"darwin/arm64"},{"target":"freebsd/amd64","gcflags":"-gcflags=github.com/go-webgpu/goffi/internal/fakecgo=-std"},{"target":"dragonfly/amd64"}]},{"name":"openbsd/amd64, netbsd/amd64","cells":[{"target":"openbsd/amd64"},{"target":"netbsd/amd64","gcflags":"-gcflags=github.com/go-webgpu/goffi/internal/fakecgo=-std"}]},{"name":"illumos/amd64, solaris/amd64","cells":[{"target":"illumos/amd64"},{"target":"solaris/amd64"}]}]}') }}
    env:
      CGO_ENABLED: 0
      CELLS: ${{ toJSON(matrix.cells) }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26.9'
        cache-dependency-path: go.sum

    - name: Run go vet
      run: |
        set -euo pipefail
        while IFS= read -r cell; do
          TARGET=$(jq -r '.target' <<<"$cell")
          GCFLAGS=$(jq -r 'if .gcflags then .gcflags else "" end' <<<"$cell")
          TAGS=$(jq -r 'if .tags then .tags else "" end' <<<"$cell")

          # An array, so the empty GCFLAGS of most cells contributes no argument
          # rather than an empty one.
          flags=(-unsafeptr=false)
          if [ -n "$GCFLAGS" ]; then
            flags+=("$GCFLAGS")
          fi
          if [ -n "$TAGS" ]; then
            flags+=(-tags "$TAGS")
          fi
          GOOS="${TARGET%/*}" GOARCH="${TARGET#*/}" go vet "${flags[@]}" ./... </dev/null
        done < <(jq -c '.[]' <<<"$CELLS")

  # Quality and Lint used to be one job; its steps ran back to back and their
  # sum (~2:40) sat right on the critical path of a PR run. Separate runners
  # cost nothing here, so vet-and-scanners and the lint shards run side by side.
  quality:
    name: Quality
    needs: [should-run-full]
    if: needs.should-run-full.outputs.run-full == 'true'
    runs-on: ubuntu-latest
    env:
      CGO_ENABLED: 0
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26.9'
        cache-dependency-path: go.sum

    - name: Restore Go build cache (quality)
      uses: actions/cache@v4
      with:
        path: ~/.cache/go-build
        key: quality-go-${{ hashFiles('go.sum') }}
        restore-keys: |
          quality-go-

    - name: Compute affected packages
      id: affected
      uses: ./.github/actions/affected-packages

    - name: Test Qt recipe and Conan publication helpers
      run: python3 -m unittest ci/test_patch_qt_dependencies.py ci/test_arm64_glibc_archives.py ci/test_portable_conan_upload.py ci/test_portable_qt_linux.py

    - name: Run go vet
      if: steps.affected.outputs.packages != ''
      shell: bash
      env:
        AFFECTED: ${{ steps.affected.outputs.packages }}
      run: |
        if [ "$AFFECTED" = "all" ]; then
          targets=(./...)
        else
          read -ra targets <<<"$AFFECTED"
        fi
        go vet "${targets[@]}"

    # govulncheck is not incremental on purpose: it reports only
    # vulnerabilities the code actually reaches, so the whole tree is in scope
    # and the finding count stays at zero rather than accumulating a backlog.
    # The tool version is pinned; the vulnerability database it consults is
    # fetched at run time, so a newly published advisory turns this red without
    # any change here — which is the point.
    # build.yml is approaching 900 lines, most of it shell embedded in run:
    # blocks that nothing checked. actionlint validates the workflow schema and
    # every expression, and hands each run: block to shellcheck — which the
    # ubuntu image already ships, so it needs no setup here. Both classes of
    # mistake it catches otherwise cost a full CI round trip to discover.
    - name: Run actionlint
      run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.12

    - name: Run govulncheck
      run: go run golang.org/x/vuln/cmd/govulncheck@v1.7.0 ./...

  lint:
    name: Lint (${{ matrix.shard }})
    needs: [should-run-full]
    if: needs.should-run-full.outputs.run-full == 'true'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      # Numbered, not named. A shard that names a package path has to be
      # edited by every restructuring, and the one that did -- `cmd/f4` --
      # went on carrying the whole application in its name for three phases
      # after the application left it. The assignment is computed below from
      # `go list`, so a package that moves lands in a shard by itself.
      matrix: { include: [{ shard: 0, cache-key: lint-0 }, { shard: 1, cache-key: lint-1 }] }
    env:
      CGO_ENABLED: 0
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        # Full history: the incremental lint below diffs against origin/main.
        fetch-depth: 0
        submodules: recursive

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26.9'
        cache-dependency-path: go.sum

    - name: Compile standalone ConPTY probe
      if: matrix.shard == 'rest'
      working-directory: tools/conptyreconcile
      run: |
        go test -run '^$' ./...
        GOOS=windows GOARCH=amd64 go test -c -run '^$' -o /tmp/conptyreconcile-windows.test.exe ./...

    - name: Restore Go build cache (lint shard)
      uses: actions/cache@v4
      with:
        path: ~/.cache/go-build
        key: lint-${{ matrix.cache-key }}-go-${{ hashFiles('go.sum') }}
        restore-keys: |
          lint-${{ matrix.cache-key }}-go-

    - name: Compute affected packages
      id: affected
      uses: ./.github/actions/affected-packages

    - name: Select incremental lint packages
      id: shard
      uses: ./.github/actions/shard-packages
      with:
        shard: ${{ matrix.shard }}
        shards: '2'
        packages: ${{ steps.affected.outputs.packages }}

    - name: Convert import paths to package arguments
      id: lint-packages
      if: steps.shard.outputs.count != '0'
      shell: bash
      env:
        PACKAGES: ${{ steps.shard.outputs.packages }}
      run: |
        set -euo pipefail
        module=$(go list -m)
        args=""
        read -r -a shard_packages <<<"$PACKAGES"
        for package in "${shard_packages[@]}"; do
          case "$package" in
            "$module")   relative=./ ;;
            "$module"/*) relative="./${package#"$module"/}" ;;
            *)
              echo "::error::package is outside $module: $package"
              exit 1 ;;
          esac
          args="${args:+$args }$relative"
        done
        echo "args=$args" >> "$GITHUB_OUTPUT"

    - name: Run incremental golangci-lint
      if: steps.shard.outputs.count != '0'
      uses: golangci/golangci-lint-action@v9.3.0
      with:
        version: v2.13.1
        args: --new-from-rev=origin/main ${{ steps.lint-packages.outputs.args }}

    # The step above only reports findings on lines a pull request touched, so
    # everything the linters have to say about existing code stays invisible —
    # currently around 2450 findings. Rather than leave that permanently
    # unspoken, each linter graduates here once its backlog is actually zero,
    # and from then on it is checked across the whole tree and cannot regrow.
    # Adding a linter to this list means clearing its debt first, in the same
    # change.
    # Shard 0 carries it, not because of what it holds -- the shards are
    # numbered and their contents computed -- but because exactly one runner
    # must, and zero is the one that always exists.
    - name: Run whole-tree golangci-lint for the linters with no backlog
      if: matrix.shard == 0
      uses: golangci/golangci-lint-action@v9.3.0
      with:
        version: v2.13.1
        args: --config .golangci-strict.yml

  # Эта джоба создает постоянные релизы при пуше тэгов v*.*.*
  test:
    name: Test (${{ matrix.target }}${{ matrix.shard && format(' {0}', matrix.shard) || '' }})
    needs: [should-run-full]
    if: needs.should-run-full.outputs.run-full == 'true'
    runs-on: ${{ matrix.os }}
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # Up to 9 cells on pushes/tags (6 on pull requests); capped so this
      # job doesn't claim every runner the free-tier pool has (see the
      # concurrency comment above the jobs).
      max-parallel: 4
      # One hosted runner per native os/arch cell, except that the slow
      # darwin/arm64 and windows/amd64 cells split their tests by name.
      # Pull requests skip the second-arch twin of the two
      # desktop OSes: darwin/amd64 and windows/arm64 run on the slowest
      # runners of the whole matrix (4-5 minutes against the ~2:40 the
      # rest of a PR run takes) and only catch arch-specific breakage --
      # rare enough to test on pushes, tags and manual runs, which is
      # also where the published artifacts come from. linux/arm64 stays
      # everywhere: its runner is fast. Keep the conditional inline because
      # these jobs are the critical path, and an extra dependency edge would
      # bill its scheduling latency to every cell.
      # A-D/rest is the closest timing split after charging the A shard for
      # the isolated TestAllDialogs_LayoutValidation pass a second time.
      # The first regex also covers an exact "Test" name; the negated class
      # puts every other non-standard Test* suffix in the second shard.
      matrix: ${{ github.event_name == 'pull_request' && fromJSON('{"include":[{"os":"ubuntu-latest","target":"linux/amd64","cover":"linux"},{"os":"ubuntu-24.04-arm","target":"linux/arm64"},{"os":"macos-latest","target":"darwin/arm64","shard":"A-D","run":"^Test([A-D]|$)","cover":"macos"},{"os":"macos-latest","target":"darwin/arm64","shard":"rest","run":"^Test[^A-D]","cover":"macos"},{"os":"windows-latest","target":"windows/amd64","shard":"A-D","run":"^Test([A-D]|$)","cover":"windows"},{"os":"windows-latest","target":"windows/amd64","shard":"rest","run":"^Test[^A-D]","cover":"windows"}]}') || fromJSON('{"include":[{"os":"ubuntu-latest","target":"linux/amd64","cover":"linux"},{"os":"ubuntu-24.04-arm","target":"linux/arm64"},{"os":"macos-latest","target":"darwin/arm64","shard":"A-D","run":"^Test([A-D]|$)","cover":"macos"},{"os":"macos-latest","target":"darwin/arm64","shard":"rest","run":"^Test[^A-D]","cover":"macos"},{"os":"macos-15-intel","target":"darwin/amd64"},{"os":"windows-latest","target":"windows/amd64","shard":"A-D","run":"^Test([A-D]|$)","cover":"windows"},{"os":"windows-latest","target":"windows/amd64","shard":"rest","run":"^Test[^A-D]","cover":"windows"},{"os":"windows-11-arm","target":"windows/arm64"}]}') }}
    env:
      CGO_ENABLED: 0
      TEST_SHUFFLE: ${{ inputs.shuffle || 'on' }}
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Move Go caches to the fast disk (Windows)
      # C: is the OS disk and glacial at unpacking the ~650 MB Go cache --
      # three of this job's five and a half minutes on windows-latest went
      # into that alone; D: is the runner's local SSD. windows-11-arm images
      # have no D:, hence the probe.
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        if (Test-Path 'D:\') {
          Add-Content $env:GITHUB_ENV "GOCACHE=D:\go-build"
          Add-Content $env:GITHUB_ENV "GOMODCACHE=D:\go-mod"
        }

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26.9'
        # The salt file is part of the key on purpose: the cache stores
        # absolute paths, so a cache saved before a GOCACHE/GOMODCACHE move
        # above would restore to the old location -- and with the key
        # unchanged, setup-go would see a "hit" and never save a good one.
        # A salt rather than this workflow file, so that ordinary CI edits
        # do not rotate every test cell into a cold compile.
        cache-dependency-path: |
          go.sum
          .github/workflows/go-cache-salt

    - name: Compute affected packages
      id: affected
      uses: ./.github/actions/affected-packages

    # plugins/observer's tests need a tiny wasm test fixture (f4#1563, part
    # 1). Built only on this one cell -- linux/amd64 is where the affected
    # package (if any) is compiled everywhere else too, and wasi-sdk is only
    # worth installing once, not on all nine cells -- everywhere else the
    # tests skip themselves for lack of the fixture (see
    # scripts/build_observer_test_wasm.sh and plugins/observer/observer_test.go).
    - name: Cache wasi-sdk
      id: cache-wasi-sdk
      if: runner.os == 'Linux' && matrix.target == 'linux/amd64'
      uses: actions/cache@v4
      with:
        path: /opt/wasi-sdk
        key: wasi-sdk-34-x86_64-linux

    - name: Install wasi-sdk
      if: runner.os == 'Linux' && matrix.target == 'linux/amd64' && steps.cache-wasi-sdk.outputs.cache-hit != 'true'
      run: |
        curl -fsSL -o /tmp/wasi-sdk.tar.gz \
          https://github.com/WebAssembly/wasi-sdk/releases/download/wasi-sdk-34/wasi-sdk-34.0-x86_64-linux.tar.gz
        sudo mkdir -p /opt/wasi-sdk
        sudo tar -xzf /tmp/wasi-sdk.tar.gz --strip-components=1 -C /opt/wasi-sdk

    - name: Build plugins/observer test fixture
      if: runner.os == 'Linux' && matrix.target == 'linux/amd64'
      run: WASI_SDK_PATH=/opt/wasi-sdk ./scripts/build_observer_test_wasm.sh

    # plugins/observer's isoimg end-to-end test (f4#1563, part 2) builds a
    # real upstream Observer module -- not the from-scratch stub above --
    # with the same wasi-sdk, plus a tiny genisoimage-built ISO9660 image to
    # probe it against. Built only on this one cell, same reasoning as the
    # stub fixture above. See scripts/build_isoimg_test_wasm.sh,
    # scripts/build_isoimg_test_iso.sh and
    # plugins/observer/testdata/isoimg/compat/.
    - name: Install genisoimage
      if: runner.os == 'Linux' && matrix.target == 'linux/amd64'
      run: sudo apt-get update && sudo apt-get install -y genisoimage

    - name: Build plugins/observer isoimg test fixture (wasm)
      if: runner.os == 'Linux' && matrix.target == 'linux/amd64'
      run: WASI_SDK_PATH=/opt/wasi-sdk ./scripts/build_isoimg_test_wasm.sh

    - name: Build plugins/observer isoimg test fixture (iso)
      if: runner.os == 'Linux' && matrix.target == 'linux/amd64'
      run: ./scripts/build_isoimg_test_iso.sh

    # Confirms isoimg_test.wasm is spec-valid wasm and reports what
    # wasm-opt -Oz would shrink it to (f4#1563, part 2 open question 2),
    # using Binaryen's own prebuilt release, never built from source here.
    - name: Cache Binaryen
      id: cache-binaryen
      if: runner.os == 'Linux' && matrix.target == 'linux/amd64'
      uses: actions/cache@v4
      with:
        path: /opt/binaryen
        key: binaryen-133-x86_64-linux

    - name: Install Binaryen
      if: runner.os == 'Linux' && matrix.target == 'linux/amd64' && steps.cache-binaryen.outputs.cache-hit != 'true'
      run: |
        curl -fsSL -o /tmp/binaryen.tar.gz \
          https://github.com/WebAssembly/binaryen/releases/download/version_133/binaryen-version_133-x86_64-linux.tar.gz
        sudo mkdir -p /opt/binaryen
        sudo tar -xzf /tmp/binaryen.tar.gz --strip-components=1 -C /opt/binaryen

    - name: Check isoimg wasm fixture with Binaryen
      if: runner.os == 'Linux' && matrix.target == 'linux/amd64'
      run: BINARYEN_PATH=/opt/binaryen ./scripts/check_isoimg_wasm.sh plugins/observer/testdata/isoimg_test.wasm

    - name: Run Tests
      shell: bash
      env:
        AFFECTED: ${{ steps.affected.outputs.packages }}
        RUN_FILTER: ${{ matrix.run || '' }}
        # TestConPTYPackageKeepsLongLinesWhole downloads the ConPTY package
        # f4 fetches on first use and runs real programs in it (#885). It is
        # Windows-only; elsewhere the variable is unused.
        F4_NATIVE_CONPTY_PACKAGE: '1'
        # Coverage is collected on one Linux cell and both shards of each
        # split desktop cell. Each shard gets its own Codecov flag so the service
        # cannot replace a rest profile with the A-D profile.
        COVER: ${{ matrix.cover && '-coverpkg=./... -coverprofile=cover.out' || '' }}
      run: |
        # Pull requests test only the packages their diff reaches through
        # the import graph (see the affected-packages action); pushes, tags
        # and manual runs always test everything.
        # Coverage uploads must exercise the complete module. A profile made
        # from affected packages only records zeroes for every carried-forward
        # package and makes the project percentage look like a regression.
        if [ "$AFFECTED" = "all" ] || [ -n "$COVER" ]; then
          targets=(./...)
        elif [ -z "$AFFECTED" ]; then
          echo "No packages affected by this diff; skipping tests."
          exit 0
        else
          read -ra targets <<<"$AFFECTED"
        fi
        # Shuffle tests and subtests to expose order dependencies. Go prints
        # the seed on every run, so reproduce a failure with -shuffle=<seed>.
        # The seed selects a permutation of the test set, so it only reproduces
        # while that set remains unchanged. Shuffle also pins go's test-result
        # caching off, deliberately: a rolling-cache experiment showed this
        # suite is uncacheable anyway -- the tests read per-run environment
        # (temp dirs), so even an unchanged tree scored zero cache hits.
        run_args=()
        if [ -n "$RUN_FILTER" ]; then
          run_args=(-run "$RUN_FILTER")
        fi
        cover_args=()
        if [ -n "$COVER" ]; then
          read -r -a cover_args <<< "$COVER"
        fi
        go test "${cover_args[@]}" -shuffle="$TEST_SHUFFLE" -timeout 15m -skip '^TestAllDialogs_LayoutValidation$' "${run_args[@]}" "${targets[@]}"
        # go test -coverpkg=./... emits one copy of every instrumented block per package. Codecov does not merge those duplicate records reliably, so normalize the profile before upload.
        if [ -n "" ]; then
          go run github.com/wadey/gocovmerge@b5bfa59ec0adc420475f97f89b58045c721d761c cover.out > cover.merged.out
          mv cover.merged.out cover.out
        fi
        # Layout validation mutates shared UI registries from parallel
        # subtests. Go 1.26 schedules them aggressively enough to expose the
        # upstream race, so isolate that test in a single-threaded process.
        if [ -z "$RUN_FILTER" ] || [[ "TestAllDialogs_LayoutValidation" =~ $RUN_FILTER ]]; then
          case " ${targets[*]} " in
            *" ./... "*|*" github.com/unxed/f4/internal/app "*)
              # -v and the PASS check are the point: the -skip above removes
              # this test from every other target, so if this line names a
              # package that does not hold it, `go test -run` prints
              # "[no tests to run]" and exits 0 -- excluded everywhere, re-run
              # nowhere, cell still green.
              #
              # What is asserted is "=== RUN", not "--- PASS": the test skips
              # itself when nothing a layout depends on changed, and a skip is
              # a deliberate behaviour, not a failure. What must never happen
              # is the test not being *found* -- then `go test -run` prints
              # "[no tests to run]" and exits 0, and the -skip above has
              # already removed it from every other target.
              #
              # -count=1 because a cached result prints neither line, and
              # captured rather than piped because `... | grep -q` exits at
              # the first match, closes the pipe, and pipefail then fails the
              # step over the SIGPIPE it caused.
              if ! layout=$(GOMAXPROCS=1 go test -v -count=1 -timeout 15m -run '^TestAllDialogs_LayoutValidation$' ./internal/app 2>&1); then
                printf '%s\n' "$layout"
                exit 1
              fi
              printf '%s\n' "$layout"
              case "$layout" in
                *"=== RUN   TestAllDialogs_LayoutValidation"*) ;;
                *)
                  echo "::error::TestAllDialogs_LayoutValidation was not found in ./internal/app"
                  exit 1 ;;
              esac ;;
          esac
        fi

    - name: Test TTY-only GUI boundary
      if: matrix.target == 'linux/amd64'
      run: go test -tags tty_only,vtui_noebiten,vtui_nogogpu -run '^TestTTYOnly' ./internal/gui ./internal/app

    - name: Upload coverage to Codecov
      if: matrix.cover && hashFiles('cover.out') != ''
      uses: codecov/codecov-action@v7
      with:
        files: cover.out
        # Without this the uploader also sweeps the tree for anything that
        # looks like a report and picks up internal/i18n/lang/coverage_baseline.txt,
        # which counts translation keys, not statements.
        disable_search: true
        flags: ${{ matrix.cover }}${{ matrix.shard && format('-{0}', matrix.shard) || '' }}
        token: ${{ secrets.CODECOV_TOKEN }}
        # Coverage is a report, not a gate: a failed upload (or a repository
        # with no token yet) must not turn the test run red.
        fail_ci_if_error: false

    - name: Dump crash reports on failure
      if: failure()
      shell: bash
      run: |
        # Look for crash logs in cache and temp roots (vtui's fallback); never fail.
        set +e
        search_roots=()
        if [ -n "${XDG_CACHE_HOME:-}" ]; then
          search_roots+=("$XDG_CACHE_HOME/vtui_app/crashes")
        fi
        if [ -n "${HOME:-}" ]; then
          search_roots+=("$HOME/.cache/vtui_app/crashes")
          search_roots+=("$HOME/Library/Caches/vtui_app/crashes")
        fi
        if [ -n "${LOCALAPPDATA:-}" ]; then
          cache_dir="$LOCALAPPDATA"
          if command -v cygpath >/dev/null 2>&1; then
            if converted_cache_dir="$(cygpath -u "$LOCALAPPDATA" 2>/dev/null)"; then
              cache_dir="$converted_cache_dir"
            fi
          fi
          search_roots+=("$cache_dir/vtui_app/crashes")
        fi
        search_roots+=("${TMPDIR:-/tmp}")
        if [ -n "${TEMP:-}" ]; then
          temp_dir="$TEMP"
          if command -v cygpath >/dev/null 2>&1; then
            if converted_temp_dir="$(cygpath -u "$TEMP" 2>/dev/null)"; then
              temp_dir="$converted_temp_dir"
            fi
          fi
          search_roots+=("$temp_dir")
        fi
        echo "Crash report search roots:"
        printf '  %s\n' "${search_roots[@]}"
        report_count=0
        for _ in {1..20}; do
          IFS= read -r -d '' report || break
          report_count=$((report_count + 1))
          echo "=== $report ==="
          cat -- "$report"
        done < <(
          for base in "${search_roots[@]}"; do
            [ -d "$base" ] || continue
            find "$base" -maxdepth 4 -name '*.log' \
              \( -path '*f4-test-config*' -o -path '*/vtui_app/crashes/*' \) -print0 2>/dev/null
          done
        )
        if [ "$report_count" -eq 0 ]; then
          echo "No crash reports found."
        elif [ "$report_count" -eq 20 ]; then
          echo "Printed 20 crash reports; stopped at the cap."
        else
          echo "Printed $report_count crash report(s)."
        fi
        exit 0

  race:
    name: Race (shard ${{ matrix.shard }})
    needs: [should-run-full]
    if: needs.should-run-full.outputs.run-full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    strategy:
      fail-fast: false
      # 4 shards, every run; capped so this job doesn't claim every runner
      # the free-tier pool has (see the concurrency comment above the jobs).
      max-parallel: 3
      matrix:
        # Four numbered shards, filled by measured weight rather than by name.
        # The heaviest package lands alone in one of them and that is the floor:
        # a package cannot be split across runners without a test-name filter,
        # and a filter has to name the package it filters. Measured, the floor
        # is under the Test cells' wall clock, so the race job is no longer on
        # the critical path and does not need one.
        include:
          - { shard: 0 }
          - { shard: 1 }
          - { shard: 2 }
          - { shard: 3 }
    env:
      # The race detector requires cgo and the Ubuntu runner provides the
      # native compiler needed by the instrumented test binary.
      CGO_ENABLED: 1
    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Restore Go caches (race-instrumented)
      # The shared setup-go cache key is claimed by whichever ubuntu job
      # saves first -- always one without -race -- so these jobs recompiled
      # the whole tree under the detector on every run, ~2 minutes each.
      # Race-instrumented objects get a key of their own, shared by every
      # shard: they compile overlapping dependency sets, so whichever saves
      # first serves the rest. Which packages land in which shard is computed
      # at job time and would make a per-shard key rotate on every move.
      uses: actions/cache@v4
      with:
        path: |
          ~/.cache/go-build
          ~/go/pkg/mod
        key: race-go-${{ hashFiles('go.sum') }}
        restore-keys: |
          race-go-

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26.9'
        cache: false

    - name: Compute affected packages
      id: affected
      uses: ./.github/actions/affected-packages

    - name: Select race packages
      id: shard
      uses: ./.github/actions/shard-packages
      with:
        shard: ${{ matrix.shard }}
        shards: '4'
        packages: ${{ steps.affected.outputs.packages }}

    - name: Run race detector
      if: steps.shard.outputs.count != '0'
      shell: bash
      env:
        PACKAGES: ${{ steps.shard.outputs.packages }}
      run: |
        set -euo pipefail
        # The FFI dependencies keep Go-owned pointers typed and isolate the
        # genuinely foreign-pointer conversions behind nocheckptr helpers, so
        # luaplug can execute its FFI tests under the detector as well.
        #
        # TestSeedSweep in tools/conptyreconcile runs 3000 seeds through the
        # reconcile pipeline -- pure CPU work. The detector makes it roughly
        # 7x more expensive, holding a whole shard to ~7 minutes while its
        # neighbours finish in seconds. The full sweep still runs in the
        # regular non-race jobs; the race-detector pipeline remains covered by
        # the other ConPTY tests, including TestRandomisedRoundsAgainstTheMock
        # and TestKnownSeedsAgainstTheMock.
        #
        # No package name appears here. The shard action decides what this
        # runner gets, and an empty shard skipped the step above rather than
        # falling through to `go test` with no arguments, which would quietly
        # test the current directory.
        # An array, not a bare expansion: the list has to word-split into
        # separate arguments, and shellcheck is right that a bare $PACKAGES
        # would also glob.
        read -r -a packages <<<"$PACKAGES"
        go test -race -shuffle=on -timeout 15m -skip '^TestSeedSweep$' "${packages[@]}"

  # Keeps flake.nix's vendorHash in sync with go.mod/go.sum.
  #
  # buildGoModule fetches the module set into a fixed-output derivation whose
  # hash is pinned in flake.nix as vendorHash. Every dependency change
  # invalidates that hash and breaks `nix build` / `nix run github:unxed/f4`,
  # which is easy to miss because plain `go build` keeps working. This job
  # makes that failure impossible to miss, and repairs it:
  #
  #   - on pull requests touching go.mod/go.sum/flake.nix it builds the
  #     vendor derivation against the pull request's merge commit, so a
  #     dependency change without a hash bump fails the PR and reports the
  #     exact value to paste;
  #   - on pushes to main it commits the corrected hash back, so main's
  #     flake cannot sit broken in the window between a dependency change
  #     landing and someone noticing (this is what happened to #1530).
  #
  # Only the fixed-output vendor derivation is built (f4.goModules), not f4
  # itself: the hash is what this job is about, and the check stays fast.
  #
  # Moved in from its own former workflow file (nix.yml), which carried a
  # workflow-level `paths:` filter (go.mod/go.sum/flake.nix/its own file) so
  # docs-only and unrelated pushes/PRs skipped it entirely. There is no
  # per-job equivalent of a workflow-level `paths:` filter, so the
  # "Determine whether this run touches the flake's vendored inputs" step
  # below recomputes that same decision from the diff -- the same idea as
  # the affected-packages composite action the build job uses for its own
  # "Compute build impact" step, just inlined here since this job's
  # watched-path set is a fixed, short list rather than the whole package
  # graph. Deliberately NOT gated on should-run-full: this job is already
  # cheap and conditional on its own, and its whole point is to catch a
  # broken vendorHash even in a batched push that would otherwise skip the
  # full matrix.
  nix-vendor-hash:
    name: vendorHash matches go.mod/go.sum
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Determine whether this run touches the flake's vendored inputs
      id: paths
      env:
        BEFORE_SHA: ${{ github.event.before }}
      run: |
        set -euo pipefail

        relevant() { echo "relevant=yes" >> "$GITHUB_OUTPUT"; echo "relevant: yes ($1)"; exit 0; }
        not_relevant() { echo "relevant=no" >> "$GITHUB_OUTPUT"; echo "relevant: no ($1)"; exit 0; }

        is_watched() {
          case "$1" in
            go.mod|go.sum|flake.nix|.github/workflows/build.yml) return 0 ;;
            *) return 1 ;;
          esac
        }

        if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
          relevant "workflow_dispatch always ran the check in nix.yml too"
        fi

        if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
          # Same technique as affected-packages: fetch the base branch and
          # diff against it. The checkout above is the shallow merge commit
          # (base + PR), so this is exactly the PR's changes as long as the
          # base has not moved since the event; if it has, the diff only
          # gains base-side noise, which can only widen the result toward
          # "relevant" -- the safe direction.
          git fetch --quiet --depth=1 origin "refs/heads/$GITHUB_BASE_REF" || relevant "base fetch failed"
          files=$(git diff --name-only FETCH_HEAD HEAD)
        elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
          # nix.yml's own push trigger only ever fired for branches: [main];
          # tag pushes (build.yml's other push case) never touched vendorHash.
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            not_relevant "push is not to refs/heads/main"
          fi
          case "$BEFORE_SHA" in
            ""|0000000000000000000000000000000000000000)
              relevant "no previous commit to diff against" ;;
          esac
          git fetch --quiet --depth=1 origin "$BEFORE_SHA" || relevant "before-commit fetch failed"
          files=$(git diff --name-only FETCH_HEAD HEAD)
        else
          relevant "unrecognised event $GITHUB_EVENT_NAME; defaulting to running the check"
        fi

        [ -n "$files" ] || not_relevant "empty diff"

        while IFS= read -r f; do
          is_watched "$f" && relevant "$f changed"
        done <<<"$files"

        not_relevant "no watched path changed"

    - name: Set up Nix
      if: steps.paths.outputs.relevant == 'yes'
      uses: cachix/install-nix-action@v31

    - name: Verify vendorHash
      id: verify
      if: steps.paths.outputs.relevant == 'yes'
      # A fixed-output derivation re-fetches and re-hashes its content
      # whenever the store doesn't already have a path for it, and these
      # runners start with an empty Nix store on every job - so a plain
      # build here already re-verifies vendorHash from scratch every time.
      # (--rebuild looks tempting for extra rigor, but it only works when
      # the output is already valid/substitutable; on a fresh runner there
      # is nothing to rebuild against, so it fails unconditionally with
      # "are not valid, so checking is not possible" - which is exactly
      # what happened in CI here.)
      #
      # A vendorHash mismatch is deliberately not a failure here: the two
      # steps below decide what happens to it (fail a PR with the value to
      # paste, or repair main). Any other build failure is a real failure.
      run: |
        set -euo pipefail
        if nix build --no-link .#f4.goModules 2> nix-build.log; then
          echo "vendorHash in flake.nix matches go.mod/go.sum"
          exit 0
        fi
        cat nix-build.log
        got="$(sed -n 's/^ *got: *\(sha256-[A-Za-z0-9+\/=]*\)$/\1/p' nix-build.log | tail -n1)"
        if [ -z "$got" ]; then
          echo "::error::nix build failed for a reason other than a vendorHash mismatch"
          exit 1
        fi
        echo "vendorHash mismatch: go.mod/go.sum changed without a hash bump"
        echo "got=$got" >> "$GITHUB_OUTPUT"

    - name: Report the hash to paste
      if: steps.paths.outputs.relevant == 'yes' && github.event_name != 'push' && steps.verify.outputs.got != ''
      run: |
        echo "::error::vendorHash is stale. Set vendorHash = \"${{ steps.verify.outputs.got }}\" in flake.nix (see the comment above vendorHash) and push."
        exit 1

    - name: Update vendorHash
      if: steps.paths.outputs.relevant == 'yes' && github.event_name == 'push' && github.ref == 'refs/heads/main' && steps.verify.outputs.got != ''
      run: |
        set -euo pipefail
        got="${{ steps.verify.outputs.got }}"
        sed -i "s|vendorHash = \"[^\"]*\"|vendorHash = \"$got\"|" flake.nix
        grep -F "vendorHash = \"$got\"" flake.nix
        git config user.name "github-actions[bot]"
        git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
        git add flake.nix
        git commit -m "build(nix): update vendorHash [ci]"
        # Pushes authenticated with GITHUB_TOKEN do not trigger further
        # workflow runs, so this cannot recurse.
        git push

  # Runs the flake's own checks - currently just the Home Manager module's
  # tests (packaging/nix/home-manager-module-check.nix, added by PR #1584)
  # - plus one darwin-side evaluation, which a Linux runner would otherwise
  # skip entirely along with the rest of that platform's outputs.
  #
  # This started life as a second job in PR #1584's own version of nix.yml,
  # written before that file was folded into this workflow by #1583. Folded
  # in here for the same reason nix-vendor-hash above was: no per-job
  # equivalent of a workflow-level `paths:` filter exists once a job lives
  # in build.yml, so the "Determine whether this run touches the flake's
  # Home Manager module" step below recomputes that decision from the diff,
  # the same technique nix-vendor-hash uses for its own, differently-scoped
  # watched-path set. go.mod/go.sum are deliberately not watched here: the
  # check stands pkgs.hello in for f4 (see PR #1584's description) and never
  # touches f4's own sources, so a plain dependency bump can't affect it.
  flake-checks:
    name: flake checks (Home Manager module)
    runs-on: ubuntu-latest
    steps:
    - name: Checkout code
      uses: actions/checkout@v7

    - name: Determine whether this run touches the flake's Home Manager module
      id: paths
      env:
        BEFORE_SHA: ${{ github.event.before }}
      run: |
        set -euo pipefail

        relevant() { echo "relevant=yes" >> "$GITHUB_OUTPUT"; echo "relevant: yes ($1)"; exit 0; }
        not_relevant() { echo "relevant=no" >> "$GITHUB_OUTPUT"; echo "relevant: no ($1)"; exit 0; }

        is_watched() {
          case "$1" in
            flake.nix|flake.lock|.github/workflows/build.yml) return 0 ;;
            packaging/nix/*) return 0 ;;
            *) return 1 ;;
          esac
        }

        if [ "$GITHUB_EVENT_NAME" = "workflow_dispatch" ]; then
          relevant "workflow_dispatch always ran this check too"
        fi

        if [ "$GITHUB_EVENT_NAME" = "pull_request" ]; then
          # Same technique as affected-packages and nix-vendor-hash above:
          # fetch the base branch and diff against it.
          git fetch --quiet --depth=1 origin "refs/heads/$GITHUB_BASE_REF" || relevant "base fetch failed"
          files=$(git diff --name-only FETCH_HEAD HEAD)
        elif [ "$GITHUB_EVENT_NAME" = "push" ]; then
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            not_relevant "push is not to refs/heads/main"
          fi
          case "$BEFORE_SHA" in
            ""|0000000000000000000000000000000000000000)
              relevant "no previous commit to diff against" ;;
          esac
          git fetch --quiet --depth=1 origin "$BEFORE_SHA" || relevant "before-commit fetch failed"
          files=$(git diff --name-only FETCH_HEAD HEAD)
        else
          relevant "unrecognised event $GITHUB_EVENT_NAME; defaulting to running the check"
        fi

        [ -n "$files" ] || not_relevant "empty diff"

        while IFS= read -r f; do
          is_watched "$f" && relevant "$f changed"
        done <<<"$files"

        not_relevant "no watched path changed"

    - name: Set up Nix
      if: steps.paths.outputs.relevant == 'yes'
      uses: cachix/install-nix-action@v31

    - name: Run the flake checks
      if: steps.paths.outputs.relevant == 'yes'
      run: nix flake check -L

    - name: Evaluate the module for macOS
      # A Linux runner skips the darwin outputs entirely, including the
      # module's macOS profile path. Instantiating one darwin check
      # evaluates that side without building for it.
      if: steps.paths.outputs.relevant == 'yes'
      run: nix eval --raw .#checks.aarch64-darwin.home-manager-module.drvPath > /dev/null

  # f4 has had Wine-specific code (docs/WINE.md) since before this job
  # existed, verified only by unit tests of its "clean" parts and by manual
  # sessions under a real Wine on the author's machine. This is the missing
  # other half, modeled on unxed/libwinescape's own Wine job: build f4.exe
  # and actually run it under Wine on the runner.
  #
  # Moved in from its own former workflow file (wine.yml) so it shares this
  # workflow's should-run-full gating, concurrency group and job-count
  # accounting instead of running as a wholly separate, ungated pipeline
  # alongside it.
  #
  # Two things this job is NOT: it does not replace the manual WINE.md
  # sessions (screen geometry, keyboard input quirks and the like still need
  # a human looking at a real window); and it does not attempt wineconsole (a
  # separate GUI console host binary) or the 16-color-console startup theme
  # that only shows up there (WINE.md §18.1). What it does check is real and
  # load-bearing: --wine-probe's ProbePTYUsable exercises libwinescape's
  # actual fork/openpty path (winescape.OpenPTY, pty_wine_windows.go), not a
  # mock of it, and the render smoke tests exercise the same win32
  # console/GUI startup path issue #474 broke (the GUI leg runs under Xvfb,
  # since Wine itself is not a display server).
  wine:
    name: End-to-end under Wine (linux/amd64 host)
    needs: [should-run-full]
    if: needs.should-run-full.outputs.run-full == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      CGO_ENABLED: 0
      GOOS: windows
      GOARCH: amd64
      # Set globally for the *host* wine64 invocations below. This has
      # nothing to do with f4's own WINEDEBUG handling for its children
      # (WINE.md §18.4): f4 never sets or reads WINEDEBUG itself, and this
      # variable only quiets the wine64 process this job launches directly.
      WINEDEBUG: "-all"
      WINEARCH: win64
      WINEDLLOVERRIDES: "mscoree,mshtml="

    steps:
    - name: Checkout code
      uses: actions/checkout@v7
      with:
        submodules: recursive

    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26.9'
        cache-dependency-path: go.sum

    - name: Install Wine
      run: |
        set -euo pipefail
        sudo apt-get update -qq
        sudo apt-get install -y -qq --no-install-recommends wine64 xvfb
        # On Ubuntu the 64-bit loader lives under /usr/lib/wine and is not
        # always on PATH under the name a script would guess.
        W=$(command -v wine || command -v wine64 || echo /usr/lib/wine/wine64)
        echo "WINE=$W" >> "$GITHUB_ENV"
        "$W" --version

    - name: Build f4.exe
      run: |
        set -euo pipefail
        mkdir -p build
        go build -trimpath -o build/f4.exe ./cmd/f4
        cp -r internal/i18n/lang internal/dialog/help build/
        cp f4.example.ini build/
        # Portable profile (Far.exe.ini's UseSystemProfiles=0, config.go's
        # ResolveProfileDir): isolates this run's settings.ini, logs/ and
        # crashes/ under build/Profile instead of the runner's %APPDATA%,
        # and keeps every path this job asserts on predictable. This does
        # not touch $HOME/hostmode.HomeDir resolution (WINE.md §18.2): the
        # profile location is Win32-resolved in both personalities.
        printf '[General]\r\nUseSystemProfiles=0\r\n' > build/f4.exe.ini

    - name: Initialise the Wine prefix
      run: |
        "$WINE" wineboot --init || true
        sleep 5

    - name: Probe under Wine (posix auto-detect)
      working-directory: build
      run: |
        set -euo pipefail
        "$WINE" f4.exe --wine-probe | tee probe-posix.txt
        grep -q 'winescape.IsWine:.*true' probe-posix.txt
        grep -q 'winescape.Available:.*true' probe-posix.txt
        grep -q 'hostmode.Posix:.*true' probe-posix.txt
        # The real thing, not a mock of it: winePTYUsable (pty_wine_windows.go)
        # calls winescape.OpenPTY(), a genuine fork+openpty under this Wine.
        grep -q 'ProbePTYUsable:.*true' probe-posix.txt

    - name: Probe under Wine (UseWinescape=0 equivalent)
      working-directory: build
      run: |
        set -euo pipefail
        # F4_WINE_POSIX=0 forces the same decision UseWinescape=0 would
        # (vfs/hostmode.Posix, "escape hatch ahead of the real config
        # setting"), without needing a second settings.ini profile just to
        # flip one checkbox. WINE.md §18.6 flagged this combination as
        # never run under a live Wine; this is that run.
        F4_WINE_POSIX=0 "$WINE" f4.exe --wine-probe | tee probe-nopx.txt
        grep -q 'hostmode.Posix:.*false' probe-nopx.txt
        # The native pty backend must not survive turning posix off
        # (WINE.md §18.3, "нативный pty подчиняется общей галке").
        grep -q 'ProbePTYUsable:.*false' probe-nopx.txt

    - name: Render smoke test (console, winapi backend)
      working-directory: build
      run: |
        set -euo pipefail
        printf 'one\ntwo\nthree\n' > smoke.txt

        run_smoke() {
          local label="$1"; shift
          rm -f vtui.screen.log Profile/logs/debug.log
          # f4 does not exit after --dump-screen-after (it keeps running
          # the UI loop); the runner killing it via `timeout` is the
          # expected way this step ends, not a failure.
          #
          # This must run under a real pseudo-terminal, not GitHub Actions'
          # plain stdin/stdout pipes: on those pipes Wine's console layer
          # exposes no console at all (GetStdHandle/GetConsoleMode come
          # back "Invalid handle" -- the same term.GetSize warnings the
          # --wine-probe steps above print, harmlessly there since
          # --wine-probe never touches raw mode). Here it is not harmless:
          # vtinput's term.MakeRaw(stdin) fails on that invalid handle,
          # vtui.PrepareTerminal() returns the error, and f4 exits within
          # a second of starting -- long before --dump-screen-after's timer
          # or this function's own timeout, so vtui.screen.log never gets
          # written. `script` allocates that pty.
          script -qec "$*" /dev/null || true
          if [ ! -s vtui.screen.log ]; then
            echo "::error::$label: no vtui.screen.log (screen dump never ran, or f4 never started)"
            exit 1
          fi
          if [ -f Profile/logs/debug.log ] && grep -q 'FATAL PANIC' Profile/logs/debug.log; then
            echo "::error::$label: FATAL PANIC in debug.log"
            cat Profile/logs/debug.log
            exit 1
          fi
          mkdir -p "../wine-logs/$label"
          cp vtui.screen.log "../wine-logs/$label/" || true
          if [ -f Profile/logs/debug.log ]; then
            cp Profile/logs/debug.log "../wine-logs/$label/" || true
          fi
        }

        # Forces the Win32-console-API renderer (wineconsole/ReactOS/VT-less
        # Windows) rather than whatever backend auto-detection would pick
        # under plain `wine f4.exe`; the ANSI/VT path already has non-Wine
        # coverage in the rest of CI, this backend has none.
        run_smoke console-winapi \
          timeout --preserve-status 25 "$WINE" f4.exe --debug -e smoke.txt --dump-screen-after 8 --tty=winapi

    # GUI mode needs an actual display to draw its window onto -- Wine is
    # not itself a display server -- so this leg alone gets Xvfb. It is the
    # exact command issue #474 was reported with (`wine f4.exe --gui=win32`)
    # and is marked informational rather than blocking: Wine's GUI path
    # under a virtual framebuffer is inherently more fragile than the
    # console path above, and this is the first time either has run in CI
    # at all.
    - name: Render smoke test (win32 GUI backend)
      working-directory: build
      continue-on-error: true
      run: |
        set -euo pipefail
        printf 'one\ntwo\nthree\n' > smoke.txt
        rm -f vtui.screen.log Profile/logs/debug.log
        xvfb-run --auto-servernum -- \
          timeout --preserve-status 25 "$WINE" f4.exe --debug -e smoke.txt --dump-screen-after 8 --gui=win32 || true
        mkdir -p ../wine-logs/gui-win32
        cp vtui.screen.log ../wine-logs/gui-win32/ 2>/dev/null || true
        cp Profile/logs/debug.log ../wine-logs/gui-win32/ 2>/dev/null || true
        if [ ! -s vtui.screen.log ]; then
          echo "::warning::gui-win32: no vtui.screen.log (screen dump never ran, or f4 never started)"
          exit 1
        fi
        if [ -f Profile/logs/debug.log ] && grep -q 'FATAL PANIC' Profile/logs/debug.log; then
          echo "::warning::gui-win32: FATAL PANIC in debug.log"
          cat Profile/logs/debug.log
          exit 1
        fi

    - uses: actions/upload-artifact@v7
      if: always()
      with:
        name: wine-logs
        path: |
          build/probe-*.txt
          wine-logs/**
        retention-days: 7

  qt-release:
    name: Create Linux Qt feature release
    # The explicit Linux release builds only the two Linux portable artifacts;
    # it does not depend on unrelated Windows/macOS Qt jobs or Go test shards.
    needs: [portable-qt-linux]
    runs-on: ubuntu-latest
    if: ${{ always() && github.event_name == 'workflow_dispatch' && inputs.publish_qt_release == true && needs.portable-qt-linux.result == 'success' }}
    permissions:
      contents: write
    steps:
    - name: Validate release tag
      shell: bash
      env:
        RELEASE_TAG: ${{ inputs.release_tag }}
      run: |
        set -euo pipefail
        if [[ ! "$RELEASE_TAG" =~ ^v[0-9]{4}\.[0-9]{2}\.[0-9]{2}$ ]]; then
          echo "::error::release_tag must match vYYYY.MM.DD; got '$RELEASE_TAG'"
          exit 1
        fi

    - name: Checkout release packaging script
      uses: actions/checkout@v7
      with:
        ref: ${{ github.sha }}

    - name: Test release packaging scripts
      run: python3 -m unittest ci/test_package_release_scripts.py ci/test_go_build_metadata.py ci/test_portable_qt_linux.py

    - name: Download Linux Qt artifacts
      uses: actions/download-artifact@v8
      with:
        path: dist
        pattern: f4-portable-linux-*
        merge-multiple: false

    - name: Assemble exactly two Linux Qt release assets
      run: python3 ci/package-qt-release.py dist release --platform linux

    - name: Publish Qt feature release
      env:
        GH_TOKEN: ${{ github.token }}
        RELEASE_TAG: ${{ inputs.release_tag }}
      run: |
        set -euo pipefail
        gh release create "$RELEASE_TAG" release/* \
          --repo "$GITHUB_REPOSITORY" \
          --target "$GITHUB_SHA" \
          --title "$RELEASE_TAG" \
          --prerelease \
          --generate-notes \
          --notes 'Linux Qt feature release. Includes single-file amd64 and arm64 binaries with FFmpeg video and PulseAudio output support. Linux sound uses the desktop PulseAudio service or PipeWire pulse compatibility service.'

  release:
    name: Create Official Release
    # Narrowing build-batch's condition would make release on a tag skipped, not failed.
    needs: [build, qt-host, portable-qt, portable-qt-arm64-version, build-batch, build-lite, build-win7, build-reactos, build-termux, build-cloudfox-plugin, build-android-plugin, build-ios-plugin, test, race]
    runs-on: ubuntu-latest
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: write
    steps:
    - name: Verify release build prerequisites
      if: needs.build.result != 'success' || needs.qt-host.result != 'success' || needs.portable-qt.result != 'success' || needs.portable-qt-arm64-version.result != 'success' || needs.build-batch.result != 'success' || needs.build-win7.result != 'success' || needs.build-reactos.result != 'success' || needs.build-termux.result != 'success' || needs.test.result != 'success' || needs.race.result != 'success' || needs.build-lite.result != 'success' || needs.build-cloudfox-plugin.result != 'success' || needs.build-android-plugin.result != 'success' || needs.build-ios-plugin.result != 'success'
      run: |
        echo "::error::Official release prerequisites failed. build=${{ needs.build.result }}, qt-host=${{ needs.qt-host.result }}, portable-qt=${{ needs.portable-qt.result }}, build-batch=${{ needs.build-batch.result }}, build-win7=${{ needs.build-win7.result }}, build-reactos=${{ needs.build-reactos.result }}, build-termux=${{ needs.build-termux.result }}, test=${{ needs.test.result }}, race=${{ needs.race.result }}"
        exit 1
    - name: Checkout release packaging script
      uses: actions/checkout@v7
    - name: Test release packaging scripts
      run: python3 -m unittest ci/test_package_release_scripts.py ci/test_go_build_metadata.py ci/test_portable_qt_linux.py
    - name: Download all artifacts
      uses: actions/download-artifact@v8
      with:
        path: dist
        merge-multiple: false
    - name: Assemble full matrix, Qt desktop, and standalone plugin assets
      run: python3 ci/package-release.py dist release
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26.9'
        cache-dependency-path: go.sum

    - name: Check the release against installed updaters
      run: go run ./tools/releasecheck release
    - name: Publish Release
      uses: softprops/action-gh-release@v3
      with:
        files: release/*
        generate_release_notes: true
        body: |
          ## Downloads

          The release contains four Linux/Windows embedded-Qt single-file
          archives and two classic macOS `F4.app` bundles, one per
          architecture, plus Windows 7z compatibility archives. The full
          terminal-only platform matrix, lite and legacy editions, macOS
          CLI archives, Termux packages, and standalone plugins are retained.

    # The check before publishing replays installed builds over the names
    # sorted the way the GitHub API lists assets today, which the API does
    # not promise. Read the release back as the updaters will and replay it
    # in that order; if they would misread it, turn it back into a draft,
    # which no updater sees, and fail.
    - name: Check the published release as the API lists it
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: ${{ github.ref_name }}
      run: |
        set -euo pipefail
        gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[].name' > published-assets.txt
        if ! go run ./tools/releasecheck -listed published-assets.txt; then
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=true
          exit 1
        fi

  # Эта джоба обновляет Homebrew tap при пуше тэгов v*.*.*,
  # чтобы под macOS можно было поставить f4 одной командой:
  #   brew install <owner>/tap/f4
  homebrew:
    name: Homebrew tap
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
    - name: Compute version and download macOS artifacts
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        echo "VERSION=$VERSION" >> "$GITHUB_ENV"
        BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
        for arch in amd64 arm64; do
          file="f4-darwin-${arch}.tar.gz"
          echo "Downloading $file ..."
          curl -fL --retry 5 --retry-delay 10 --retry-all-errors -o "$file" "$BASE/$file"
          sha=$(sha256sum "$file" | cut -d' ' -f1)
          echo "SHA_${arch}=$sha" >> "$GITHUB_ENV"
          echo "URL_${arch}=$BASE/$file" >> "$GITHUB_ENV"
        done

    - name: Generate formula
      run: |
        mkdir -p tap/Formula
        cat > tap/Formula/f4.rb <<EOF
        # This file is generated automatically by CI on each tagged release.
        # Do not edit by hand — changes will be overwritten.
        class F4 < Formula
          desc "# f4 — efficient and cozy file manager in go"
          homepage "https://github.com/${GITHUB_REPOSITORY}"
          version "${VERSION}"
          license "BSD-3-Clause"

          on_macos do
            on_arm do
              url "${URL_arm64}"
              sha256 "${SHA_arm64}"
            end
            on_intel do
              url "${URL_amd64}"
              sha256 "${SHA_amd64}"
            end
          end

          def install
            bin.install "f4"
            prefix.install "plugins" if File.directory?("plugins")
          end

          test do
            assert_match "f4", shell_output("#{bin}/f4 --version 2>&1")
          end
        end
        EOF
        echo "----- Generated Formula -----"
        cat tap/Formula/f4.rb

    - name: Push formula to tap repository
      env:
        TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      run: |
        if [ -z "$TAP_TOKEN" ]; then
          echo "::warning::HOMEBREW_TAP_TOKEN secret is not set; skipping tap update."
          echo "Create a PAT with 'contents:write' on ${GITHUB_REPOSITORY_OWNER}/homebrew-tap and add it as HOMEBREW_TAP_TOKEN."
          exit 0
        fi
        TAP_REPO="${GITHUB_REPOSITORY_OWNER}/homebrew-tap"
        git clone "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" tap-repo
        mkdir -p tap-repo/Formula
        cp tap/Formula/f4.rb tap-repo/Formula/f4.rb
        cd tap-repo
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        if git diff --quiet -- Formula/f4.rb; then
          echo "Formula already up to date; nothing to commit."
          exit 0
        fi
        git add Formula/f4.rb
        git commit -m "f4 ${VERSION}"
        git push

  # Эта джоба обновляет "плавающий" nightly релиз при каждом пуше в main
  nightly:
    name: Update Nightly Release
    # Narrowing build-batch's condition would make release on a tag skipped, not failed.
    needs: [build, qt-host, portable-qt, portable-qt-arm64-version, build-batch, build-lite, build-win7, build-reactos, build-termux, build-cloudfox-plugin, build-android-plugin, build-ios-plugin, test, race]
    runs-on: ubuntu-latest
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
    steps:
    - name: Verify nightly build prerequisites
      if: needs.build.result != 'success' || needs.qt-host.result != 'success' || needs.portable-qt.result != 'success' || needs.portable-qt-arm64-version.result != 'success' || needs.build-batch.result != 'success' || needs.build-win7.result != 'success' || needs.build-reactos.result != 'success' || needs.build-termux.result != 'success' || needs.test.result != 'success' || needs.race.result != 'success' || needs.build-lite.result != 'success' || needs.build-cloudfox-plugin.result != 'success' || needs.build-android-plugin.result != 'success' || needs.build-ios-plugin.result != 'success'
      run: |
        echo "::error::Nightly release prerequisites failed. build=${{ needs.build.result }}, qt-host=${{ needs.qt-host.result }}, portable-qt=${{ needs.portable-qt.result }}, build-batch=${{ needs.build-batch.result }}, build-win7=${{ needs.build-win7.result }}, build-reactos=${{ needs.build-reactos.result }}, build-termux=${{ needs.build-termux.result }}, test=${{ needs.test.result }}, race=${{ needs.race.result }}"
        exit 1
    - name: Checkout code (to get git info)
      uses: actions/checkout@v7

    - name: Test release packaging and metadata contracts
      run: python3 -m unittest ci/test_package_release_scripts.py ci/test_go_build_metadata.py ci/test_portable_qt_linux.py

    - name: Set Release Metadata
      run: |
        echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> "$GITHUB_ENV"
        # Go embeds the commit timestamp as vcs.time in every nightly binary.
        # Publish that same timestamp so the updater and F1's Help Index use
        # one source instead of comparing the workflow clock with commit time.
        echo "BUILD_TIME=$(date -u -d "@$(git show -s --format='%ct' HEAD)" +'%Y-%m-%d %H:%M:%S')" >> "$GITHUB_ENV"

    # Download into dist/, NOT artifacts/. This job checks the repository out,
    # and artifacts/ is a tracked directory (see artifacts/README.md). It once
    # held the ConPTY audit evidence, and downloading on top of it merged that
    # evidence with the build output, so the publish step below uploaded the
    # native-openconsole-probe*.json files as nightly release assets.
    # Collecting that data is a manual job -- conpty-probe.yml, workflow_dispatch
    # only -- so nothing in the automatic pipeline should be publishing it.
    - name: Download all artifacts
      uses: actions/download-artifact@v8
      with:
        path: dist
        merge-multiple: false

    # Stable and nightly publish the same full updater-compatible platform
    # set, with portable Qt replacing the four primary desktop launchers.
    - name: Assemble user-facing nightly assets
      run: python3 ci/package-release.py dist release

    # wine-logs (and any future artifact whose own upload path had more
    # than one root, e.g. build/probe-*.txt alongside wine-logs/**) keeps
    # that nested structure through merge-multiple, landing as a real
    # subdirectory here -- dist/build/ -- rather than a flat file. Every
    # actual release binary is a flat file at dist/'s top level, so any
    # top-level directory here is debug/log ballast, never a release
    # asset; a directory in this glob makes `gh release create`'s upload
    # fail outright (you cannot POST a directory as a single asset).
    - name: Prune non-file artifacts (e.g. wine-logs) before publishing
      run: find dist -mindepth 1 -maxdepth 1 -type d -exec rm -rf {} +

    # Every f4 installed anywhere reads this release with the updater it was
    # built with, and a shipped updater cannot be fixed (#1656: plugin and
    # lite archives sorted before f4's own and were installed in its place).
    # Replay all of them over dist/ and unpack what they would install; on
    # any problem nothing is published and the previous nightly stays.
    - name: Set up Go
      uses: actions/setup-go@v7
      with:
        go-version: '1.26.9'
        cache-dependency-path: go.sum

    - name: Check the release against installed updaters
      run: go run ./tools/releasecheck release

    # The Releases page is sorted by each release's created_at, and GitHub
    # sets that to the date of the tagged commit, not to the moment the
    # release was created or last edited. Recreating the release alone
    # therefore changes nothing while the nightly tag keeps pointing at the
    # commit that introduced it: the nightly stays pinned below every stable
    # release. Move the tag to the commit being built first, so the recreated
    # release inherits the newest commit date on main and sorts above every
    # v* tag on older commits. The push trigger only matches v*.*.* tags,
    # so pushing nightly does not start another run.
    - name: Move Nightly Tag to HEAD
      run: |
        set -euo pipefail
        git tag -f nightly HEAD
        git push -f origin refs/tags/nightly

    # created_at is fixed when the release object is created and does not
    # follow the tag afterwards, so an update in place would keep the old
    # date. Delete and recreate the release; the tag stays where the step
    # above put it.
    - name: Refresh Nightly Release Position
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        if gh release view nightly --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
          gh release delete nightly --repo "$GITHUB_REPOSITORY" --yes
        fi

    - name: Update Nightly Release
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        set -euo pipefail
        # The release action uploads all assets concurrently. With the full
        # matrix that occasionally races while creating its temporary asset
        # directories and fails the otherwise successful main CI run. The
        # GitHub CLI uploads the same files sequentially, which is reliable
        # for the nightly's ~30 architecture assets.
        gh release create nightly release/* \
          --repo "$GITHUB_REPOSITORY" \
          --title "Continuous Build (Nightly)" \
          --notes "Automated pre-release build of the latest main branch. Commit: $SHORT_SHA. Built on: $BUILD_TIME" \
          --prerelease

    # The check before publishing replays installed builds over the names
    # sorted the way the GitHub API lists assets today, which the API does
    # not promise. Read the release back as the updaters will and replay it
    # in that order; if they would misread it, turn it back into a draft,
    # which no updater sees, and fail.
    - name: Check the published release as the API lists it
      env:
        GH_TOKEN: ${{ github.token }}
        TAG: nightly
      run: |
        set -euo pipefail
        gh api "repos/$GITHUB_REPOSITORY/releases/tags/$TAG" --jq '.assets[].name' > published-assets.txt
        if ! go run ./tools/releasecheck -listed published-assets.txt; then
          gh release edit "$TAG" --repo "$GITHUB_REPOSITORY" --draft=true
          exit 1
        fi
