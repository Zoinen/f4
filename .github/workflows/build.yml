name: Build & Release

on:
  push:
    branches: [ "main", "zoin" ]
    tags: [ "v*.*.*" ]
  pull_request:
    branches: [ "main" ]
  workflow_dispatch:

jobs:
  build:
    name: Build (${{ matrix.goos }}/${{ matrix.goarch }})
    if: github.ref != 'refs/heads/zoin'
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goos: [linux, windows, darwin, freebsd, dragonfly, openbsd, netbsd, illumos, solaris]
        goarch: [amd64, arm64, arm]
        exclude:
          - goos: dragonfly
            goarch: arm64
          - goos: illumos
            goarch: arm64
          - goos: solaris
            goarch: arm64
          - goos: windows
            goarch: arm
          - goos: darwin
            goarch: arm
          - goos: freebsd
            goarch: arm
          - goos: dragonfly
            goarch: arm
          - goos: openbsd
            goarch: arm
          - goos: netbsd
            goarch: arm
          - goos: illumos
            goarch: arm
          - goos: solaris
            goarch: arm
    env:
      CGO_ENABLED: 0

    steps:
    - name: Checkout code
      uses: actions/checkout@v4
      with:
        submodules: recursive # Автоматически подтягивает vtui и vtinput
        ssh-key: ${{ secrets.SUBMODULE_SSH_KEY }}

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.x'
        cache-dependency-path: go.sum

    - name: Collect core version metadata
      shell: bash
      run: |
        echo "F4_BUILD_REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
        echo "F4_BUILD_TIME=$(git show -s --format=%cI HEAD)" >> "$GITHUB_ENV"
        echo "F4_BUILD_MODIFIED=false" >> "$GITHUB_ENV"
        if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          echo "F4_BUILD_VERSION=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
        else
          echo "F4_BUILD_VERSION=" >> "$GITHUB_ENV"
        fi

    - name: Check formatting
      if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
      run: |
        if [ -n "$(gofmt -s -l .)" ]; then
          echo "The following files are not properly formatted:"
          gofmt -s -l .
          echo "Please run 'gofmt -s -w .' locally and commit the changes."
          exit 1
        fi

    - name: Verify generated application icons
      if: matrix.goos == 'linux' && matrix.goarch == 'amd64'
      run: |
        go generate
        git diff --exit-code -- \
          assets/icon/generated \
          rsrc_windows_amd64.syso \
          rsrc_windows_arm64.syso

    - name: Run Tests
      if: matrix.goos == 'linux' && matrix.goarch == 'amd64' || (matrix.goos == 'windows' && matrix.goarch == 'amd64')
      run: |
        echo "Running f4 core tests..."
        go test -v -skip '^TestAllDialogs_LayoutValidation$' ./...
        # Layout validation mutates shared UI registries from parallel
        # subtests. Go 1.26 schedules them aggressively enough to expose the
        # upstream race, so isolate that test in a single-threaded process.
        GOMAXPROCS=1 go test -v -run '^TestAllDialogs_LayoutValidation$' .

    - name: Build binaries
      env:
        GOOS: ${{ matrix.goos }}
        GOARCH: ${{ matrix.goarch }}
      run: |
        mkdir -p build/plugins/dummy_internal
        EXT=""
        if [ "$GOOS" = "windows" ]; then EXT=".exe"; fi

        # Prepare flags for truly static binary on Linux
        VERSION_LDFLAGS="-X main.buildRevision=$F4_BUILD_REVISION -X main.buildTime=$F4_BUILD_TIME -X main.buildModified=$F4_BUILD_MODIFIED"
        if [ -n "$F4_BUILD_VERSION" ]; then
          VERSION_LDFLAGS="$VERSION_LDFLAGS -X main.buildVersion=$F4_BUILD_VERSION"
        fi
        LDFLAGS="-s -w $VERSION_LDFLAGS"
        if [ "$GOOS" = "linux" ]; then LDFLAGS="$LDFLAGS -extldflags '-static'"; fi

        GCFLAGS=""
        if [ "$GOOS" = "freebsd" ]; then
          GCFLAGS="-gcflags=github.com/go-webgpu/goffi/internal/fakecgo=-std"
        fi

        # Build core
        go build -trimpath $GCFLAGS -ldflags="$LDFLAGS" -o build/f4$EXT .

        # Build GUI-only binary for Windows (no console flash)
        if [ "$GOOS" = "windows" ]; then
          go build -trimpath $GCFLAGS -ldflags="$LDFLAGS -H windowsgui" -o build/f4-gui$EXT .
        fi

        # Copy language and help assets
        cp -r lang help build/
        mkdir -p build/licenses
        cp plugins/visren/LICENSE.upstream build/licenses/VisRen-BSD-3-Clause.txt
        cp plugins/ios/LICENSE.go-ios build/licenses/go-ios-MIT.txt

        # Add freedesktop launch metadata and the application icon to Linux archives.
        if [ "$GOOS" = "linux" ]; then
          mkdir -p build/share/applications
          cp packaging/linux/f4.desktop build/share/applications/
          for size in 16 24 28 30 32 36 42 48 56 64 128 256 512 1024; do
            icon_dir="build/share/icons/hicolor/${size}x${size}/apps"
            mkdir -p "$icon_dir"
            cp "assets/icon/generated/f4-${size}.png" \
              "$icon_dir/io.github.unxed.f4.png"
          done
          mkdir -p build/share/icons/hicolor/scalable/apps
          cp assets/icon/f4.svg \
            build/share/icons/hicolor/scalable/apps/io.github.unxed.f4.svg
        fi

        # Build internal dummy plugin
        cd plugins/dummy_internal
        go build -trimpath $GCFLAGS -ldflags="$LDFLAGS" -o ../../build/plugins/dummy_internal/f4-internal-dummy-plugin$EXT .

    - name: Package
      run: |
        if [ "${{ matrix.goos }}" = "windows" ]; then
          (cd build && zip -r ../f4-${{ matrix.goos }}-${{ matrix.goarch }}.zip .)
        else
          # Создаем архив в корне, упаковывая содержимое build (без самой папки build)
          tar -czvf f4-${{ matrix.goos }}-${{ matrix.goarch }}.tar.gz -C build .
        fi

        if [ "${{ matrix.goos }}" = "darwin" ]; then
          VERSION="0.0.${GITHUB_RUN_NUMBER}"
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            VERSION="${GITHUB_REF_NAME#v}"
          fi

          APP="F4.app"
          mkdir -p "$APP/Contents/MacOS" "$APP/Contents/Resources"
          cp build/f4 "$APP/Contents/MacOS/f4"
          chmod +x "$APP/Contents/MacOS/f4"
          cp assets/icon/generated/f4.icns "$APP/Contents/Resources/f4.icns"
          sed -e "s/__VERSION__/$VERSION/g" \
              -e "s/__BUILD_VERSION__/$GITHUB_RUN_NUMBER/g" \
              packaging/macos/Info.plist > "$APP/Contents/Info.plist"
          zip -r "f4-${{ matrix.goos }}-${{ matrix.goarch }}.app.zip" "$APP"
        fi

    - name: Upload Artifact
      uses: actions/upload-artifact@v4
      with:
        name: f4-${{ matrix.goos }}-${{ matrix.goarch }}
        path: f4-${{ matrix.goos }}-${{ matrix.goarch }}.*
        retention-days: 7

  qt-host:
    name: Qt host (${{ matrix.platform }}, list + Gallery)
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: macos-14
            platform: darwin
    env:
      CONAN_HOME: ${{ github.workspace }}/.conan2

    steps:
    - name: Checkout f4
      uses: actions/checkout@v4
      with:
        submodules: recursive
        ssh-key: ${{ secrets.SUBMODULE_SSH_KEY }}

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.x'
        cache-dependency-path: go.sum

    - name: Collect core version metadata
      shell: bash
      run: |
        echo "F4_BUILD_REVISION=$(git rev-parse HEAD)" >> "$GITHUB_ENV"
        echo "F4_BUILD_TIME=$(git show -s --format=%cI HEAD)" >> "$GITHUB_ENV"
        echo "F4_BUILD_MODIFIED=false" >> "$GITHUB_ENV"
        if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
          echo "F4_BUILD_VERSION=$GITHUB_REF_NAME" >> "$GITHUB_ENV"
        else
          echo "F4_BUILD_VERSION=" >> "$GITHUB_ENV"
        fi

    - name: Enable the MSVC build environment
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Install native build tools
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install "conan==2.29.1" "cmake==3.31.6" "ninja==1.13.0"
        conan profile detect --force

    - name: Build and test the Qt host
      shell: bash
      run: |
        conan_platform_settings=()
        if [[ "$RUNNER_OS" == "macOS" ]]; then
          conan_platform_settings+=("-s:h" "os.version=13.0")
        fi
        conan install qt/host --build=missing \
          -s:h build_type=Release -s:h compiler.cppstd=20 \
          -c tools.system.package_manager:mode=install \
          -c tools.system.package_manager:sudo=True \
          "${conan_platform_settings[@]}" \
          --output-folder=qt/host/build-ci
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          qt_cmake_prefix="$(cygpath -w "$PWD/qt/host/build-ci")"
          pwsh -File ci/build-qwindowkit.ps1 -QtRoot "$qt_cmake_prefix" -BuildType Release
        else
          bash ci/build-qwindowkit.sh "$PWD/qt/host/build-ci" Release
        fi
        cmake -S qt/host -B qt/host/build-ci -G Ninja \
          -DCMAKE_TOOLCHAIN_FILE="$PWD/qt/host/build-ci/conan_toolchain.cmake" \
          -DCMAKE_BUILD_TYPE=Release -DBUILD_TESTING=ON -DUSE_QWK=ON \
          -DCMAKE_PREFIX_PATH="$PWD/build/qwindowkit-install"
        cmake --build qt/host/build-ci --config Release --parallel 4
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          python - <<'PY'
        import pathlib
        import subprocess

        build_dir = pathlib.Path("qt/host/build-ci").resolve()
        run_environment = build_dir / "conanrun.bat"
        if not run_environment.is_file():
            raise SystemExit(f"Conan run environment is missing: {run_environment}")
        command = (
            f'call "{run_environment}" && '
            f'set "QML_IMPORT_PATH={build_dir / "ZoinGallery"};{build_dir / "qml"}" && '
            f'set "QML2_IMPORT_PATH={build_dir / "ZoinGallery"};{build_dir / "qml"}" && '
            f'ctest --test-dir "{build_dir}" -C Release --output-on-failure '
            f'-R "^(F4|QtShellController|WindowGeometryPersistence)"'
        )
        subprocess.run(["cmd.exe", "/d", "/c", command], check=True)
        PY
        else
          test -f qt/host/build-ci/conanrun.sh
          source qt/host/build-ci/conanrun.sh
          export QML_IMPORT_PATH="$PWD/qt/host/build-ci/ZoinGallery:$PWD/qt/host/build-ci/qml"
          export QML2_IMPORT_PATH="$PWD/qt/host/build-ci/ZoinGallery:$PWD/qt/host/build-ci/qml"
          ctest --test-dir qt/host/build-ci -C Release --output-on-failure \
            -R '^(F4|QtShellController|WindowGeometryPersistence)'
        fi

    - name: Install the integrated sidecar tree
      shell: bash
      run: |
        cmake --install qt/host/build-ci --config Release --prefix qt/host/stage-ci
        executable_suffix=""
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          executable_suffix=".exe"
        fi
        version_ldflags="-X main.buildRevision=$F4_BUILD_REVISION -X main.buildTime=$F4_BUILD_TIME -X main.buildModified=$F4_BUILD_MODIFIED"
        if [ -n "$F4_BUILD_VERSION" ]; then
          version_ldflags="$version_ldflags -X main.buildVersion=$F4_BUILD_VERSION"
        fi
        CGO_ENABLED=0 go build -trimpath -ldflags="-s -w $version_ldflags" \
          -o "qt/host/stage-ci/bin/f4${executable_suffix}" .
        mkdir -p qt/host/stage-ci/bin/plugins/dummy_internal
        (
          cd plugins/dummy_internal
          CGO_ENABLED=0 go build -trimpath -ldflags='-s -w' \
            -o "../../qt/host/stage-ci/bin/plugins/dummy_internal/f4-internal-dummy-plugin${executable_suffix}" .
        )
        cp -R lang help qt/host/stage-ci/bin/

    - name: Validate and smoke-test the installed tree
      shell: bash
      run: |
        python - <<'PY'
        import os
        import pathlib
        import subprocess

        root = pathlib.Path("qt/host/stage-ci").resolve()
        suffix = ".exe" if os.environ["RUNNER_OS"] == "Windows" else ""
        core = root / "bin" / f"f4{suffix}"
        host = root / "bin" / f"f4-qt-host{suffix}"
        lucide_license = root / "licenses" / "Lucide-LICENSE.txt"
        required = [core, host, lucide_license]
        missing = [str(path) for path in required if not path.is_file()]
        if missing:
            raise SystemExit("missing installed executable(s): " + ", ".join(missing))

        env = os.environ.copy()
        env["QT_QPA_PLATFORM"] = "offscreen"
        env["QSG_RHI_BACKEND"] = "software"
        # Restrict Qt discovery to the installed tree. ZoinGallery is linked
        # statically, so successful startup proves that its QML types were
        # registered without relying on build-tree module/plugin files.
        env["QML_IMPORT_PATH"] = str(root / "qml")
        env["QML2_IMPORT_PATH"] = str(root / "qml")
        env["QT_PLUGIN_PATH"] = str(root / "plugins")
        if os.environ["RUNNER_OS"] == "Windows":
            # Do not inherit Conan cache paths: the smoke test must prove that
            # all runtime DLLs are present in the staged artifact.
            runtime_dirs = [root / "bin", root / "lib"]
            env["PATH"] = os.pathsep.join(
                [str(path) for path in runtime_dirs if path.is_dir()]
                + [env.get("PATH", "")]
            )
        result = subprocess.run(
            [str(host), "--f4-ext-connect=127.0.0.1:1", "--f4-ext-nonce=ci-smoke",
             "--f4-ext-cols=100", "--f4-ext-rows=30"],
            cwd=root / "bin", env=env, text=True,
            stdout=subprocess.PIPE, stderr=subprocess.STDOUT, timeout=30,
        )
        print(result.stdout)
        if result.returncode != 2:
            raise SystemExit(
                f"installed Qt host returned {result.returncode}; expected 2 for a refused test socket"
            )
        failure_markers = (
            "QQmlApplicationEngine failed to load component",
            "module \"ZoinGallery\" is not installed",
            "Could not find the Qt platform plugin",
        )
        if any(marker in result.stdout for marker in failure_markers):
            raise SystemExit("installed Qt host reported a deployment/QML import failure")
        PY

    - name: Package integrated artifact
      id: qt-package
      shell: bash
      run: |
        go_arch="$(go env GOARCH)"
        artifact_base="f4-qt-${{ matrix.platform }}-${go_arch}"
        if [[ "$RUNNER_OS" == "Windows" ]]; then
          archive="${artifact_base}.zip"
          ARTIFACT_ARCHIVE="$archive" python - <<'PY'
        import os
        import pathlib
        import zipfile

        source = pathlib.Path("qt/host/stage-ci")
        with zipfile.ZipFile(os.environ["ARTIFACT_ARCHIVE"], "w", zipfile.ZIP_DEFLATED) as archive:
            for path in source.rglob("*"):
                if path.is_file():
                    archive.write(path, path.relative_to(source))
        PY
        else
          archive="${artifact_base}.tar.gz"
          tar -czf "$archive" -C qt/host/stage-ci .
        fi
        echo "name=$artifact_base" >> "$GITHUB_OUTPUT"
        echo "archive=$archive" >> "$GITHUB_OUTPUT"

    - name: Upload integrated Qt artifact
      uses: actions/upload-artifact@v4
      with:
        name: ${{ steps.qt-package.outputs.name }}
        path: ${{ steps.qt-package.outputs.archive }}
        if-no-files-found: error
        retention-days: 7

  portable-qt:
    name: Portable single-file Qt (${{ matrix.platform }}/amd64)
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 360
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            platform: linux
          - runner: windows-2022
            platform: windows
    env:
      CONAN_HOME: ${{ github.workspace }}/.conan2-portable-${{ matrix.platform }}

    steps:
    - name: Checkout f4
      uses: actions/checkout@v4
      with:
        submodules: recursive
        ssh-key: ${{ secrets.SUBMODULE_SSH_KEY }}

    - name: Set up Go
      uses: actions/setup-go@v5
      with:
        go-version: '1.26.x'
        cache-dependency-path: go.sum

    - name: Enable the MSVC build environment
      if: runner.os == 'Windows'
      uses: ilammy/msvc-dev-cmd@v1

    - name: Cache the portable native dependency graph
      uses: actions/cache@v4
      with:
        path: ${{ env.CONAN_HOME }}/p
        key: portable-qt-6.11.1-${{ matrix.platform }}-${{ runner.arch }}-${{ hashFiles('qt/host/conanfile.py', 'ci/build-portable-qt-linux.sh') }}
        restore-keys: |
          portable-qt-6.11.1-${{ matrix.platform }}-${{ runner.arch }}-

    - name: Build the glibc 2.27 portable executable
      if: runner.os == 'Linux'
      shell: bash
      run: |
        go_root="$(go env GOROOT)"
        docker run --rm \
          -e CONAN_HOME=/workspace/.conan2-portable-linux \
          -v "$PWD:/workspace" \
          -v "$go_root:/opt/go:ro" \
          -w /workspace \
          ubuntu:18.04 \
          bash ci/build-portable-qt-linux.sh

    - name: Install native build tools
      if: runner.os == 'Windows'
      shell: bash
      run: |
        python -m pip install --upgrade pip
        python -m pip install "conan==2.29.1" "cmake==3.31.6" "ninja==1.13.0"
        conan profile detect --force

    - name: Build the portable Windows executable
      if: runner.os == 'Windows'
      shell: pwsh
      run: |
        $ErrorActionPreference = "Stop"

        # tukaani.org intermittently times out from GitHub's Windows runners.
        # Export the unchanged Conan Center recipe with the byte-identical
        # archive served by the upstream project's GitHub release instead.
        conan download xz_utils/5.8.3 --only-recipe --remote=conancenter
        if ($LASTEXITCODE -ne 0) { throw "Unable to download the xz recipe" }
        $xzRecipe = (conan cache path xz_utils/5.8.3 | Select-Object -Last 1).Trim()
        if ($LASTEXITCODE -ne 0) { throw "Unable to locate the xz recipe" }
        $xzRecipeCopy = Join-Path $env:RUNNER_TEMP "f4-xz-recipe"
        Remove-Item -Recurse -Force $xzRecipeCopy -ErrorAction SilentlyContinue
        New-Item -ItemType Directory -Force $xzRecipeCopy | Out-Null
        Copy-Item "$xzRecipe/conanfile.py", "$xzRecipe/conandata.yml" $xzRecipeCopy
        $xzData = Join-Path $xzRecipeCopy "conandata.yml"
        (Get-Content $xzData -Raw).Replace(
          "https://tukaani.org/xz/",
          "https://github.com/tukaani-project/xz/releases/download/v5.8.3/"
        ) | Set-Content $xzData -NoNewline
        if (!(Select-String -Quiet -Path $xzData -SimpleMatch `
          "https://github.com/tukaani-project/xz/releases/download/v5.8.3/xz-5.8.3.tar.xz")) {
          throw "The xz mirror URL was not installed into the recipe"
        }
        conan export $xzRecipeCopy --name=xz_utils --version=5.8.3
        if ($LASTEXITCODE -ne 0) { throw "Unable to export the mirrored xz recipe" }

        $conanInstalled = $false
        for ($attempt = 1; $attempt -le 3; $attempt++) {
          conan install qt/host --build=missing `
            -s:h build_type=Release -s:h compiler.cppstd=20 `
            -s:h compiler.runtime=static `
            -s:b build_type=Release -s:b compiler.cppstd=20 `
            -s:b compiler.runtime=static `
            -o:h "qt/*:shared=False" `
            -o:h "qt/*:with_libjpeg=libjpeg-turbo" `
            -o:h "qt/*:disabled_features=quickcontrols2_fusion quickcontrols2_imagine quickcontrols2_material quickcontrols2_universal quickcontrols2_fluentwinui3 quickcontrols2_stylekit quickcontrols2_windows" `
            -o:h "libraw/*:shared=False" `
            -c tools.system.package_manager:mode=install `
            --output-folder=qt/host/build-portable-windows
          if ($LASTEXITCODE -eq 0) {
            $conanInstalled = $true
            break
          }
          if ($attempt -lt 3) {
            $delay = $attempt * 15
            Write-Warning "Conan install attempt $attempt failed; retrying in ${delay}s"
            Start-Sleep -Seconds $delay
          }
        }
        if (!$conanInstalled) { throw "Conan install failed after 3 attempts" }
        $PSNativeCommandUseErrorActionPreference = $true

        pwsh -File ci/build-qwindowkit.ps1 `
          -QtRoot "$PWD/qt/host/build-portable-windows" `
          -BuildType Release -Linkage static
        cmake -S qt/host -B qt/host/build-portable-windows -G Ninja `
          "-DCMAKE_TOOLCHAIN_FILE=$PWD/qt/host/build-portable-windows/conan_toolchain.cmake" `
          -DCMAKE_BUILD_TYPE=Release `
          "-DCMAKE_PREFIX_PATH=$PWD/build/qwindowkit-install" `
          "-DQWindowKit_DIR=$PWD/build/qwindowkit-install/lib/cmake/QWindowKit" `
          -DBUILD_TESTING=ON -DUSE_QWK=ON -DF4_PORTABLE_STATIC=ON
        cmake --build qt/host/build-portable-windows --config Release --parallel 4
        $env:QML_IMPORT_PATH = "$PWD/qt/host/build-portable-windows/ZoinGallery;$PWD/qt/host/build-portable-windows/qml"
        $env:QML2_IMPORT_PATH = "$PWD/qt/host/build-portable-windows/ZoinGallery;$PWD/qt/host/build-portable-windows/qml"
        ctest --test-dir qt/host/build-portable-windows -C Release --output-on-failure `
          -R "^(F4|QtShellController|WindowGeometryPersistence)"

        $qtHost = "$PWD/qt/host/build-portable-windows/bin/Release/f4-qt-host.exe"
        pwsh -File ci/audit-portable-qt-windows.ps1 -HostPath $qtHost
        $env:QT_QPA_PLATFORM = "offscreen"
        $env:QSG_RHI_BACKEND = "software"
        & $qtHost --f4-ext-connect=127.0.0.1:1 --f4-ext-nonce=ci-smoke `
          --f4-ext-cols=100 --f4-ext-rows=30
        if ($LASTEXITCODE -ne 2) {
          throw "Disconnected static Qt host returned $LASTEXITCODE, expected 2"
        }

        python ci/package-embedded-qt-host.py $qtHost
        go test -tags f4_embedded_qt_host `
          -run "TestMaterializeEmbeddedQtHost|TestGeneratedEmbeddedQtHostPayload" .
        New-Item -ItemType Directory -Force dist/f4-windows-amd64 | Out-Null
        $env:CGO_ENABLED = "0"
        $env:GOOS = "windows"
        $env:GOARCH = "amd64"
        go build -trimpath -tags f4_embedded_qt_host -ldflags="-s -w" `
          -o dist/f4-windows-amd64/f4.exe .
        $files = @(Get-ChildItem dist/f4-windows-amd64 -File)
        if ($files.Count -ne 1 -or $files[0].Name -ne "f4.exe") {
          throw "Portable Windows artifact must contain only f4.exe"
        }

    - name: Upload portable single-file artifact
      uses: actions/upload-artifact@v4
      with:
        name: f4-portable-${{ matrix.platform }}-amd64
        path: dist/f4-${{ matrix.platform }}-amd64/f4${{ matrix.platform == 'windows' && '.exe' || '' }}
        if-no-files-found: error
        retention-days: 7

  # Эта джоба создает постоянные релизы при пуше тэгов v*.*.*
  release:
    name: Create Official Release
    needs: [build, qt-host, portable-qt]
    runs-on: ubuntu-latest
    if: ${{ always() && startsWith(github.ref, 'refs/tags/v') }}
    permissions:
      contents: write
    steps:
    - name: Verify release build prerequisites
      if: needs.build.result != 'success' || needs.qt-host.result != 'success' || needs.portable-qt.result != 'success'
      run: |
        echo "::error::Official release requires CGO-free, macOS bundle, and portable Qt builds. build=${{ needs.build.result }}, qt-host=${{ needs.qt-host.result }}, portable-qt=${{ needs.portable-qt.result }}"
        exit 1
    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        merge-multiple: true
    - name: Publish Release
      uses: softprops/action-gh-release@v2
      with:
        files: artifacts/*
        generate_release_notes: true

  # Эта джоба обновляет Homebrew tap при пуше тэгов v*.*.*,
  # чтобы под macOS можно было поставить f4 одной командой:
  #   brew install <owner>/tap/f4
  homebrew:
    name: Update Homebrew Tap
    needs: release
    runs-on: ubuntu-latest
    if: startsWith(github.ref, 'refs/tags/v')
    steps:
    - name: Compute version and download macOS artifacts
      run: |
        VERSION="${GITHUB_REF_NAME#v}"
        echo "VERSION=$VERSION" >> "$GITHUB_ENV"
        BASE="https://github.com/${GITHUB_REPOSITORY}/releases/download/${GITHUB_REF_NAME}"
        for arch in amd64 arm64; do
          file="f4-darwin-${arch}.tar.gz"
          echo "Downloading $file ..."
          curl -fL --retry 5 --retry-delay 10 --retry-all-errors -o "$file" "$BASE/$file"
          sha=$(sha256sum "$file" | cut -d' ' -f1)
          echo "SHA_${arch}=$sha" >> "$GITHUB_ENV"
          echo "URL_${arch}=$BASE/$file" >> "$GITHUB_ENV"
        done

    - name: Generate formula
      run: |
        mkdir -p tap/Formula
        cat > tap/Formula/f4.rb <<EOF
        # This file is generated automatically by CI on each tagged release.
        # Do not edit by hand — changes will be overwritten.
        class F4 < Formula
          desc "# f4 — efficient and cozy file manager in go"
          homepage "https://github.com/${GITHUB_REPOSITORY}"
          version "${VERSION}"
          license "BSD-3-Clause"

          on_macos do
            on_arm do
              url "${URL_arm64}"
              sha256 "${SHA_arm64}"
            end
            on_intel do
              url "${URL_amd64}"
              sha256 "${SHA_amd64}"
            end
          end

          def install
            bin.install "f4"
            prefix.install "plugins" if File.directory?("plugins")
          end

          test do
            assert_match "f4", shell_output("#{bin}/f4 --version 2>&1")
          end
        end
        EOF
        echo "----- Generated Formula -----"
        cat tap/Formula/f4.rb

    - name: Push formula to tap repository
      env:
        TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
      run: |
        if [ -z "$TAP_TOKEN" ]; then
          echo "::warning::HOMEBREW_TAP_TOKEN secret is not set; skipping tap update."
          echo "Create a PAT with 'contents:write' on ${GITHUB_REPOSITORY_OWNER}/homebrew-tap and add it as HOMEBREW_TAP_TOKEN."
          exit 0
        fi
        TAP_REPO="${GITHUB_REPOSITORY_OWNER}/homebrew-tap"
        git clone "https://x-access-token:${TAP_TOKEN}@github.com/${TAP_REPO}.git" tap-repo
        mkdir -p tap-repo/Formula
        cp tap/Formula/f4.rb tap-repo/Formula/f4.rb
        cd tap-repo
        git config user.name "github-actions[bot]"
        git config user.email "github-actions[bot]@users.noreply.github.com"
        if git diff --quiet -- Formula/f4.rb; then
          echo "Formula already up to date; nothing to commit."
          exit 0
        fi
        git add Formula/f4.rb
        git commit -m "f4 ${VERSION}"
        git push

  # Эта джоба обновляет "плавающий" nightly релиз при каждом пуше в main
  nightly:
    name: Update Nightly Release
    needs: [build, qt-host, portable-qt]
    runs-on: ubuntu-latest
    if: ${{ always() && github.event_name == 'push' && github.ref == 'refs/heads/main' }}
    permissions:
      contents: write
    steps:
    - name: Verify nightly build prerequisites
      if: needs.build.result != 'success' || needs.qt-host.result != 'success' || needs.portable-qt.result != 'success'
      run: |
        echo "::error::Nightly release requires CGO-free, macOS bundle, and portable Qt builds. build=${{ needs.build.result }}, qt-host=${{ needs.qt-host.result }}, portable-qt=${{ needs.portable-qt.result }}"
        exit 1
    - name: Checkout code (to get git info)
      uses: actions/checkout@v4

    - name: Set Release Metadata
      run: |
        echo "SHORT_SHA=$(git rev-parse --short HEAD)" >> $GITHUB_ENV
        echo "BUILD_TIME=$(date +'%Y-%m-%d %H:%M:%S')" >> $GITHUB_ENV

    - name: Download all artifacts
      uses: actions/download-artifact@v4
      with:
        path: artifacts
        merge-multiple: true

    - name: Update Nightly Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: nightly
        name: "Continuous Build (Nightly)"
        body: |
          Automated pre-release build of the latest `main` branch.

          **Commit:** `${{ env.SHORT_SHA }}`
          **Built on:** `${{ env.BUILD_TIME }}`
        prerelease: true
        files: artifacts/*
