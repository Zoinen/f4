# Icon themes contain group-named artwork only. Matching conditions live in shared file groups.
[FileGroups]
Version = 3

[FileGroupTheme.lucide]
Name = Lucide
IconCatalog = lucide
TintIcons = true
GroupIcons = true
LegacyIconPrefix = qrc:/F4QtHost/icons/lucide/

[FileGroupTheme.zoin]
Name = Zoin
IconCatalog = zoin
TintIcons = true
GroupIcons = true

[FileGroupTheme.system]
Name = Native
IconCatalog = system
TintIcons = false
GroupIcons = true

