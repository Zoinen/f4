# Example highlight.ini: the default groups of the built-in Color Styles,
# spelled out as user rules. f4 never reads this copy -- the file it reads is
# created on first run in the config directory (~/.config/f4/highlight.ini, or
# %APPDATA%\f4\highlight.ini on Windows). docs/HIGHLIGHTING.md describes every
# key a group accepts.

[Highlight_0]
Name = Hidden Files
IncludeAttributes = Hidden
NormalColor = foreground:Panel.Hidden

[Highlight_1]
Name = System Files
IncludeAttributes = System
NormalColor = foreground:Panel.System

[Highlight_2]
Name = Directories
IncludeAttributes = Directory
NormalColor = foreground:#EEEEEC

[Highlight_3]
Name = Scripts
Mask = *.sh, *.bash, *.py, *.pl, *.cmd, *.exe, *.bat, *.com
ExcludeAttributes = Directory
Mark = *
NormalColor = foreground:Panel.Exec

[Highlight_4]
Name = Archives
Mask = *.zip, *.rar, *.tar, *.gz, *.7z, *.tgz, *.bz2, *.xz, *.zst, *.jar, *.cab, *.lzh, *.cpio, *.rpm
ExcludeAttributes = Directory
NormalColor = foreground:Panel.Archive

[Highlight_5]
Name = Temporary Files
Mask = *.bak, *.tmp
ExcludeAttributes = Directory
NormalColor = foreground:Panel.Tmp

[Highlight_6]
Name = Executables
IncludeAttributes = Executable
ExcludeAttributes = Directory
Mark = *
NormalColor = foreground:Panel.Exec
