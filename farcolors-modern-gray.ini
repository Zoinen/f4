[farcolors]
# Modern gray palette tuned from the user's Far Manager screenshot.
# On macOS, copy this to:
#   ~/Library/Application Support/f4/farcolors.ini

Menu.Text = foreground:#D0D0D0 | background:#434343
Menu.Text.Selected = foreground:#FFFFFF | background:#3B6290
Menu.Highlight = foreground:#7FAFE3 | background:#434343
Menu.Highlight.Selected = foreground:#D8E9FF | background:#3B6290
Menu.Box = foreground:#5A5A5A | background:#434343
Menu.Title = foreground:#D0D0D0 | background:#434343

MenuBar.Text = foreground:#D0D0D0 | background:#343434
MenuBar.Text.Selected = foreground:#FFFFFF | background:#3B6290
MenuBar.Highlight = foreground:#7FAFE3 | background:#343434
MenuBar.Highlight.Selected = foreground:#D8E9FF | background:#3B6290

Scrollbar = foreground:#5A5A5A | background:#232323
Table.Box = foreground:#5A5A5A | background:#232323

Panel.Text = foreground:#AAAAAA | background:#232323
Panel.Text.Selected = foreground:#FFFFFF | background:#232323
Panel.Text.Highlight = foreground:#8A8A8A | background:#232323
Panel.Text.Info = foreground:#B8B8B8 | background:#232323
Panel.Cursor = foreground:#FFFFFF | background:#3B6290
Panel.Cursor.Selected = foreground:#FFFFFF | background:#3B6290
Panel.Title = foreground:#D0D0D0 | background:#232323
Panel.Title.Selected = foreground:#FFFFFF | background:#232323
Panel.Title.Column = foreground:#C8C8C8 | background:#232323
Panel.Box = foreground:#444444 | background:#232323
Panel.Scrollbar = foreground:#5A5A5A | background:#232323
Panel.Dir = foreground:#FFFFFF | background:#232323

Dialog.Text = foreground:#D0D0D0 | background:#434343
Dialog.Highlight = foreground:#7FAFE3 | background:#434343
Dialog.Box = foreground:#5A5A5A | background:#434343
Dialog.Box.Title = foreground:#E8E8E8 | background:#434343
Dialog.Box.Title.Highlight = foreground:#7FAFE3 | background:#434343
Dialog.Edit = foreground:#D0D0D0 | background:#232323
Dialog.Button = foreground:#D0D0D0 | background:#434343
Dialog.Button.Selected = foreground:#FFFFFF | background:#3B6290
Dialog.Button.Highlight = foreground:#7FAFE3 | background:#434343
Dialog.Button.Highlight.Selected = foreground:#D8E9FF | background:#3B6290
Dialog.Edit.Unchanged = foreground:#9A9A9A | background:#232323
Dialog.Edit.Selected = foreground:#FFFFFF | background:#3B6290

CommandLine.UserScreen = foreground:#D0D0D0 | background:#000000
CommandLine.Prompt = foreground:#9CDC6A | background:#000000
CommandLine.Text = foreground:#D0D0D0 | background:#000000
CommandLine.Text.Selected = foreground:#FFFFFF | background:#3B6290

KeyBar.Numbers = foreground:#8A8A8A | background:#000000
KeyBar.Labels = foreground:#C8C8C8 | background:#363636

Viewer.Text = foreground:#D0D0D0 | background:#232323
Viewer.Status = foreground:#D0D0D0 | background:#434343
Viewer.Arrows = foreground:#A8A8A8 | background:#232323
Viewer.Scrollbar = foreground:#5A5A5A | background:#232323
Editor.Text = foreground:#D0D0D0 | background:#232323
Editor.Scrollbar = foreground:#5A5A5A | background:#232323
